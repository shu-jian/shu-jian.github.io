SJ.readers.md = (function () {
'use strict';
/* ============================================================
 * src/readers/md.js · Markdown → Book IR
 *
 * 极简手写解析（REQUIREMENTS R1：不引入 markdown 库）。
 *
 * 覆盖：
 *   - ATX 标题 `#`~`######`（层级映射到 IR 的 1|2|3，4~6 级夹到 3）
 *     → 每个标题起一个新章节；标题文本不重复进 html，只进 `chapter.title`
 *   - 标题层级 → `nav` 树（浅层标题挂载深层标题，见 buildNav）
 *   - 段落、无序/有序列表、引用块、围栏代码块、水平线
 *   - 行内：加粗（星号双写或下划线双写包裹）、斜体（单个星号或下划线包裹）、
 *     行内代码（反引号包裹）、链接 [text](url)、图片 ![alt](src)
 *
 * 图片的取舍（见 ResultReport.learned）：
 *   reader 默认只拿到内存里的这一份 .md 文本，取不到外部图片文件（零网络）。
 *   两条例外路径能把图片真正落进 resources：
 *     1. data: URI 形式的内嵌图片，原地解码成 `resources`（不违反
 *        "img[src] 不得是 data URI"——解码后 src 已指向内部资源）。
 *     2. 相对路径图片引用，若调用方（如 zip reader 解包同目录文件后）
 *        通过 `opts.siblingAssets`（Map<文件名, Uint8Array>）把兄弟文件
 *        一并传入，按文件名匹配后同样落进 resources。
 *   两条路径都不命中时（如 http(s) 外链、没有提供 siblingAssets 的孤立
 *   .md 文件引用相对路径图片），降级为纯文字 alt，并记 `md.image-unresolved`。
 *
 * 已知不覆盖（极简解析的已知代价，见 ResultReport.capability.limits）：
 *   - 表格、嵌套列表、Setext 标题（文字 + 下一行 === / ---）
 *   - 段落内某一行字面以 # 开头时会被误判为新标题
 *   - 链接/图片 alt 文本内的嵌套行内标记不再二次解析
 * ============================================================ */

const { newBook, warn, sanitizeHtml } = SJ.ir;

/* ---------- 转义 ---------- */

function escText(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
/** 把「已经过 escText 的片段」安全地塞进带引号的属性值：只需再挡双引号 */
function escQuote(s) {
  return String(s).replace(/"/g, '&quot;');
}

/** 从标题原文里剥掉行内 markdown 装饰，得到用作 title 的纯文本 */
function titleText(raw) {
  let t = String(raw).trim();
  t = t.replace(/`([^`]+)`/g, '$1');
  t = t.replace(/\*\*([^*]+)\*\*/g, '$1').replace(/__([^_]+)__/g, '$1');
  t = t.replace(/\*([^*]+)\*/g, '$1');
  t = t.replace(/(^|[^\w])_([^_]+)_(?!\w)/g, '$1$2');
  t = t.replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1');
  t = t.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
  return t.trim();
}

/** 粗略 slug（用于文内 `#锚点` 链接指回标题所在章节），非严格规范实现 */
function slugify(s) {
  return String(s)
    .trim()
    .toLowerCase()
    .replace(/[`*_[\]()!]/g, '')
    .replace(/\s+/g, '-')
    .replace(/[^\p{L}\p{N}-]/gu, '');
}

/** 手写 base64 解码（避免依赖浏览器 atob / Node Buffer，保持环境中立） */
const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function base64Decode(str) {
  const clean = String(str).replace(/[^A-Za-z0-9+/=]/g, '');
  const bytes = [];
  for (let i = 0; i < clean.length; i += 4) {
    const c0 = B64.indexOf(clean[i]);
    const c1 = B64.indexOf(clean[i + 1]);
    const c2raw = clean[i + 2];
    const c3raw = clean[i + 3];
    const c2 = c2raw === undefined || c2raw === '=' ? -1 : B64.indexOf(c2raw);
    const c3 = c3raw === undefined || c3raw === '=' ? -1 : B64.indexOf(c3raw);
    if (c0 < 0 || c1 < 0) break;
    bytes.push((c0 << 2) | (c1 >> 4));
    if (c2 >= 0) bytes.push(((c1 & 0xf) << 4) | (c2 >> 2));
    if (c3 >= 0) bytes.push(((c2 & 0x3) << 6) | c3);
  }
  return new Uint8Array(bytes);
}

/* ---------- 相对路径图片：查 opts.siblingAssets ---------- */

const MIME_BY_EXT = {
  png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif',
  webp: 'image/webp', svg: 'image/svg+xml', bmp: 'image/bmp',
};

function extOf(name) {
  const m = String(name).match(/\.([a-zA-Z0-9]+)$/);
  return m ? m[1].toLowerCase() : '';
}

/** 协议开头（http: https: mailto: 等）或协议相对（//host/...）视为绝对引用，不查 siblingAssets */
function isAbsoluteRef(src) {
  return /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(src) || src.startsWith('//');
}

function normalizeAssetKey(p) {
  let s = String(p).trim();
  try { s = decodeURIComponent(s); } catch { /* 非法转义序列，保留原样 */ }
  s = s.replace(/^\.\//, '').replace(/^\/+/, '');
  return s;
}

/**
 * 在 siblingAssets 里按文件名找图片二进制。siblingAssets 的 key 约定未知
 * （可能是相对 .md 的路径，也可能只是 basename），依次尝试几种归一化，
 * 尽量宽松匹配；找不到返回 null。
 */
function lookupSibling(siblingAssets, src) {
  if (!siblingAssets || typeof siblingAssets.get !== 'function') return null;
  const norm = normalizeAssetKey(src);
  const rawBase = src.split('/').pop();
  const normBase = norm.split('/').pop();
  const candidates = [src, norm, rawBase, normBase].filter(Boolean);
  for (const key of candidates) {
    if (siblingAssets.has(key)) return { key, data: siblingAssets.get(key) };
  }
  return null;
}

/* ---------- 按 ATX 标题切段 ---------- */

/**
 * @returns {{level:number, rawTitle:string|null, lines:string[]}[]}
 *   level===0 表示首个标题之前的前言段（title:null 章节）
 */
function splitSections(lines) {
  const sections = [];
  let current = { level: 0, rawTitle: null, lines: [] };
  let fenceChar = null; // '`' | '~' | null，围栏代码块内部时非空

  for (const line of lines) {
    const trimmed = line.trim();

    if (fenceChar) {
      current.lines.push(line);
      if (new RegExp(`^${fenceChar}{3,}$`).test(trimmed)) fenceChar = null;
      continue;
    }
    const fenceOpen = trimmed.match(/^(`{3,}|~{3,})/);
    if (fenceOpen) {
      fenceChar = fenceOpen[1][0];
      current.lines.push(line);
      continue;
    }

    const h = line.match(/^(#{1,6})\s+(.+?)\s*#*\s*$/);
    if (h) {
      sections.push(current);
      current = { level: Math.min(h[1].length, 3), rawTitle: h[2], lines: [] };
      continue;
    }
    current.lines.push(line);
  }
  sections.push(current);

  // 丢掉纯空白的前言段（除非它是唯一的 section——那样至少要留一章）
  return sections.filter((s, i, arr) => {
    if (s.level > 0) return true;
    const nonBlank = s.lines.some((l) => l.trim() !== '');
    return nonBlank || arr.length === 1;
  });
}

/* ---------- 块级渲染 ---------- */

function isHr(line) {
  const noSpace = line.trim().replace(/\s+/g, '');
  if (noSpace.length < 3) return false;
  return /^-+$/.test(noSpace) || /^\*+$/.test(noSpace) || /^_+$/.test(noSpace);
}

function renderBlock(lines, renderInline) {
  const out = [];
  let i = 0;
  const n = lines.length;
  while (i < n) {
    const line = lines[i];
    if (line.trim() === '') { i++; continue; }

    // 围栏代码块
    const fence = line.trim().match(/^(`{3,}|~{3,})/);
    if (fence) {
      const marker = fence[1][0];
      const code = [];
      i++;
      while (i < n && !new RegExp(`^${marker}{3,}\\s*$`).test(lines[i].trim())) {
        code.push(lines[i]);
        i++;
      }
      if (i < n) i++; // 跳过收尾围栏行
      out.push(`<pre><code>${escText(code.join('\n'))}</code></pre>`);
      continue;
    }

    // 引用块
    if (/^>\s?/.test(line)) {
      const quote = [];
      while (i < n && (/^>\s?/.test(lines[i]) || (lines[i].trim() === '' && i + 1 < n && /^>\s?/.test(lines[i + 1])))) {
        quote.push(lines[i].trim() === '' ? '' : lines[i].replace(/^>\s?/, ''));
        i++;
      }
      out.push(`<blockquote>${renderBlock(quote, renderInline)}</blockquote>`);
      continue;
    }

    // 水平线（须在列表判断之前，否则 "- - -" 会被误判成列表项）
    if (isHr(line)) { out.push('<hr />'); i++; continue; }

    // 无序列表
    if (/^\s*[-*+]\s+/.test(line)) {
      const items = [];
      while (i < n && /^\s*[-*+]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*+]\s+/, '').trim());
        i++;
      }
      out.push(`<ul>${items.map((it) => `<li>${renderInline(it)}</li>`).join('')}</ul>`);
      continue;
    }

    // 有序列表
    if (/^\s*\d+[.)]\s+/.test(line)) {
      const items = [];
      while (i < n && /^\s*\d+[.)]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+[.)]\s+/, '').trim());
        i++;
      }
      out.push(`<ol>${items.map((it) => `<li>${renderInline(it)}</li>`).join('')}</ol>`);
      continue;
    }

    // 段落：吃到下一个空行或下一个特殊块为止
    const para = [];
    while (
      i < n && lines[i].trim() !== '' &&
      !/^(`{3,}|~{3,})/.test(lines[i].trim()) &&
      !/^>\s?/.test(lines[i]) &&
      !isHr(lines[i]) &&
      !/^\s*[-*+]\s+/.test(lines[i]) &&
      !/^\s*\d+[.)]\s+/.test(lines[i])
    ) {
      para.push(lines[i].trim());
      i++;
    }
    out.push(`<p>${renderInline(para.join(' '))}</p>`);
  }
  return out.join('');
}

/* ---------- 行内渲染 ---------- */

function renderInline(raw, ctx) {
  let s = escText(raw);

  // 行内代码：先保护内容，避免被加粗/斜体规则二次处理
  const codeStash = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => {
    codeStash.push(c);
    return `\x00C${codeStash.length - 1}\x00`;
  });

  // 图片
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (_, alt, src) => ctx.resolveImage(alt, src));

  // 链接
  s = s.replace(/\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (_, label, href) => {
    const resolved = escQuote(ctx.resolveHref(href));
    return `<a href="${resolved}">${label}</a>`;
  });

  // 加粗
  s = s.replace(/\*\*([^*]+)\*\*/g, (_, t) => `<strong>${t}</strong>`);
  s = s.replace(/__([^_]+)__/g, (_, t) => `<strong>${t}</strong>`);

  // 斜体
  s = s.replace(/\*([^*]+)\*/g, (_, t) => `<em>${t}</em>`);
  s = s.replace(/(^|[^0-9A-Za-z])_([^_]+)_(?![0-9A-Za-z])/g, (_, pre, t) => `${pre}<em>${t}</em>`);

  // 还原行内代码
  s = s.replace(/\x00C(\d+)\x00/g, (_, idx) => `<code>${escText(codeStash[Number(idx)])}</code>`);

  return s;
}

/* ---------- 目录树 ---------- */

function buildNav(sections, chapterIds) {
  const root = [];
  const stack = []; // [{level, node}]
  sections.forEach((s, i) => {
    if (s.level === 0) return; // 前言不进目录
    const node = { title: titleText(s.rawTitle), target: chapterIds[i], anchor: null, level: s.level, children: [] };
    while (stack.length && stack[stack.length - 1].level >= s.level) stack.pop();
    if (stack.length) stack[stack.length - 1].node.children.push(node);
    else root.push(node);
    stack.push({ level: s.level, node });
  });
  return root;
}

/* ---------- 主流程 ---------- */

async function read(buf, opts = {}) {
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let text = new TextDecoder('utf-8').decode(bytes);
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1); // 去 BOM
  text = text.replace(/\r\n?/g, '\n');
  const lines = text.split('\n');

  const sections = splitSections(lines);

  // 书名：若文档最开头就是标题（前言已被过滤掉），拿它当书名；否则退回文件名
  let title;
  if (sections.length && sections[0].level > 0) {
    title = titleText(sections[0].rawTitle);
  } else if (opts.filename) {
    title = String(opts.filename).replace(/^.*[\\/]/, '').replace(/\.[^./\\]+$/, '');
  }

  const book = newBook({ title, language: opts.language, author: opts.author });

  const chapterIds = sections.map((_, i) => `ch${i + 1}`);

  // 标题 slug → chapterId，供文内 `[x](#锚点)` 粗略解析回目标章节
  const slugMap = new Map();
  sections.forEach((s, i) => {
    if (s.level === 0) return;
    const slug = slugify(titleText(s.rawTitle));
    if (slug && !slugMap.has(slug)) slugMap.set(slug, chapterIds[i]);
  });

  const resolveHref = (href) => {
    if (href.startsWith('#')) {
      let frag = href.slice(1);
      try { frag = decodeURIComponent(frag); } catch { /* 保留原样 */ }
      const target = slugMap.get(slugify(frag));
      if (target) return `#${target}`;
    }
    return href;
  };

  let imgCounter = 0;
  const addImageResource = (data, mime, extHint) => {
    imgCounter += 1;
    const ext = (extHint || (mime.split('/')[1] || 'bin')).replace(/[^a-z0-9]/gi, '').toLowerCase() || 'bin';
    const rid = `img${imgCounter}`;
    const href = `images/${rid}.${ext}`;
    book.resources.set(rid, { href, mime, data: data instanceof Uint8Array ? data : new Uint8Array(data) });
    return href;
  };

  const resolveImage = (alt, src) => {
    // 1. data: URI 内嵌图片：原地解码
    const dataUri = src.match(/^data:([^;,]+)(?:;charset=[^;,]+)?;base64,([\s\S]+)$/i);
    if (dataUri) {
      const mime = dataUri[1];
      const data = base64Decode(dataUri[2]);
      if (data.length) {
        const href = addImageResource(data, mime);
        return `<img src="${escQuote(href)}" alt="${escQuote(alt)}" />`;
      }
    }

    // 2. 相对路径图片：调用方（如 zip reader）若一并传入了同目录兄弟文件，按文件名匹配
    if (!isAbsoluteRef(src)) {
      const hit = lookupSibling(opts.siblingAssets, src);
      if (hit && hit.data && hit.data.length) {
        const ext = extOf(hit.key) || extOf(src);
        const mime = MIME_BY_EXT[ext] || 'application/octet-stream';
        const href = addImageResource(hit.data, mime, ext);
        return `<img src="${escQuote(href)}" alt="${escQuote(alt)}" />`;
      }
    }

    // 3. 两条路径都没命中：本地相对路径缺 siblingAssets、或 http(s) 外链——零网络取不到图片数据
    warn(book, 'md.image-unresolved', `图片未随文件提供，已降级为替代文字: ${src.slice(0, 120)}`);
    return alt || '';
  };

  const ctx = { resolveHref, resolveImage };

  sections.forEach((s, i) => {
    book.chapters.push({
      id: chapterIds[i],
      title: s.level > 0 ? titleText(s.rawTitle) : null,
      level: s.level > 0 ? s.level : 1,
      html: sanitizeHtml(renderBlock(s.lines, (raw) => renderInline(raw, ctx))),
    });
  });

  if (!book.chapters.length) {
    book.chapters.push({ id: 'ch1', title: null, level: 1, html: '' });
  }
  if (!sections.some((s) => s.level > 0)) {
    warn(book, 'md.no-chapters', '未识别到任何 # 标题，全文作为单章处理');
  }

  book.nav = buildNav(sections, chapterIds);

  return book;
}

return { read };
})();

/* ==== src/readers/epub.js ==== */
SJ.readers.epub = (function () {
'use strict';
/* ============================================================
 * EPUB → Book IR
 *
 * 解析链：META-INF/container.xml → OPF（metadata/manifest/spine）
 *   → 目录（EPUB3 nav 文档，回退 NCX）→ 逐个 spine 内容文档转 chapters。
 *
 * 环境中立：不依赖 DOMParser（Node 测试环境没有），自带一个极简 XML/XHTML
 *   tokenizer，专为 EPUB 里出现的（半）规范标记服务，不是通用 XML 解析器。
 *
 * 只假定 globalThis.JSZip 存在，不加载任何外部脚本、不发任何网络请求。
 * ============================================================ */

const { newBook, warn, sanitizeHtml } = SJ.ir;

const tick = () => new Promise((resolve) => setTimeout(resolve, 0));

/* ---------- 友好错误 ---------- */

function fail(message) {
  throw new Error(message);
}

/* ============================================================
 * 极简 XML tokenizer（container.xml / OPF / NCX / nav 文档 / 内容文档共用）
 * ============================================================ */

const XML_ENTITIES = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" };

function decodeXmlEntities(s) {
  return String(s).replace(/&(#x?[0-9a-fA-F]+|[a-zA-Z]+);/g, (m, body) => {
    if (body[0] === '#') {
      const code = body[1] === 'x' || body[1] === 'X'
        ? parseInt(body.slice(2), 16)
        : parseInt(body.slice(1), 10);
      return Number.isFinite(code) ? String.fromCodePoint(code) : m;
    }
    return XML_ENTITIES[body.toLowerCase()] ?? m;
  });
}

function escapeAttrLocal(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

/** 去掉标签名的命名空间前缀（dc:title → title），用于宽松匹配 */
function localName(tag) {
  const i = tag.indexOf(':');
  return i === -1 ? tag : tag.slice(i + 1);
}

function parseAttrsGeneric(s) {
  const attrs = {};
  const re = /([a-zA-Z_:][a-zA-Z0-9_:.-]*)(?:\s*=\s*("([^"]*)"|'([^']*)'))?/g;
  let m;
  while ((m = re.exec(s))) {
    if (!m[1]) continue;
    const name = m[1].toLowerCase();
    const value = m[3] ?? m[4] ?? '';
    attrs[name] = decodeXmlEntities(value);
  }
  return attrs;
}

/**
 * 把 XML/XHTML 串切成 token 流：{type:'text',value}
 *   | {type:'open',tag,attrs,selfClose} | {type:'close',tag}
 * 注释 / CDATA / doctype / PI 处理为文本或直接吞掉。
 */
function tokenizeXml(str) {
  const tokens = [];
  const s = String(str || '');
  const n = s.length;
  let i = 0;
  while (i < n) {
    const lt = s.indexOf('<', i);
    if (lt === -1) { if (i < n) tokens.push({ type: 'text', value: s.slice(i) }); break; }
    if (lt > i) tokens.push({ type: 'text', value: s.slice(i, lt) });

    if (s.startsWith('<!--', lt)) {
      const end = s.indexOf('-->', lt + 4);
      i = end === -1 ? n : end + 3;
      continue;
    }
    if (s.startsWith('<![CDATA[', lt)) {
      const end = s.indexOf(']]>', lt + 9);
      tokens.push({ type: 'text', value: s.slice(lt + 9, end === -1 ? n : end) });
      i = end === -1 ? n : end + 3;
      continue;
    }
    if (s[lt + 1] === '!' || s[lt + 1] === '?') {
      const end = s.indexOf('>', lt + 1);
      i = end === -1 ? n : end + 1;
      continue;
    }

    const gt = s.indexOf('>', lt);
    if (gt === -1) { tokens.push({ type: 'text', value: s.slice(lt) }); break; }

    let raw = s.slice(lt + 1, gt).trim();
    i = gt + 1;
    if (!raw) continue;

    if (raw[0] === '/') {
      tokens.push({ type: 'close', tag: raw.slice(1).trim().toLowerCase() });
      continue;
    }

    let selfClose = false;
    if (raw.endsWith('/')) { selfClose = true; raw = raw.slice(0, -1).trim(); }

    const mName = raw.match(/^([a-zA-Z_][a-zA-Z0-9_:.-]*)/);
    if (!mName) continue;
    const tag = mName[1].toLowerCase();
    const attrs = parseAttrsGeneric(raw.slice(mName[1].length));
    tokens.push({ type: 'open', tag, attrs, selfClose });
  }
  return tokens;
}

/**
 * 在一段 token 数组里找所有满足 predicate(tag, attrs) 的元素（含自闭合），
 * 返回 {tag, attrs, startIdx, endIdx}（endIdx 为闭合标签之后一位，exclusive）。
 * 命中后跳过其整个范围，不深入其内部找同类嵌套匹配（够用：本文件的目标
 * 结构都不会把同名元素直接嵌套自身，除 footnote 极端情况，可接受）。
 */
function findElements(tokens, predicate) {
  const results = [];
  let i = 0;
  while (i < tokens.length) {
    const t = tokens[i];
    if (t.type === 'open' && predicate(t.tag, t.attrs)) {
      if (t.selfClose) {
        results.push({ tag: t.tag, attrs: t.attrs, startIdx: i, endIdx: i + 1 });
        i += 1;
        continue;
      }
      let depth = 1, j = i + 1;
      while (j < tokens.length && depth > 0) {
        const tj = tokens[j];
        if (tj.type === 'open' && tj.tag === t.tag && !tj.selfClose) depth += 1;
        else if (tj.type === 'close' && tj.tag === t.tag) depth -= 1;
        j += 1;
      }
      results.push({ tag: t.tag, attrs: t.attrs, startIdx: i, endIdx: j });
      i = j;
      continue;
    }
    i += 1;
  }
  return results;
}

/** 拼出一段 token 区间里的纯文本（忽略标签，折叠空白） */
function tokensToText(tokens) {
  let s = '';
  for (const t of tokens) if (t.type === 'text') s += t.value;
  return decodeXmlEntities(s).replace(/\s+/g, ' ').trim();
}

/** 把 token 数组重新序列化为字符串（供再交给 sanitizeHtml 清洗） */
function serializeTokens(tokens) {
  let out = '';
  for (const t of tokens) {
    if (t.type === 'text') { out += t.value; continue; }
    if (t.type === 'open') {
      const attrStr = Object.entries(t.attrs)
        .map(([k, v]) => ` ${k}="${escapeAttrLocal(v)}"`)
        .join('');
      out += `<${t.tag}${attrStr}${t.selfClose ? ' /' : ''}>`;
      continue;
    }
    if (t.type === 'close') out += `</${t.tag}>`;
  }
  return out;
}

/* ============================================================
 * 路径工具（POSIX，环境中立，不用 node:path——产物要在浏览器里跑）
 * ============================================================ */

function dirnamePosix(p) {
  const i = p.lastIndexOf('/');
  return i === -1 ? '' : p.slice(0, i);
}

function joinPosix(dir, rel) {
  const stack = dir ? dir.split('/').filter(Boolean) : [];
  for (const part of rel.split('/')) {
    if (part === '' || part === '.') continue;
    if (part === '..') { if (stack.length) stack.pop(); }
    else stack.push(part);
  }
  return stack.join('/');
}

function decodePathSafe(p) {
  try { return decodeURIComponent(p); } catch { return p; }
}

/** 解析 OPF manifest 里的 href（相对 OPF 所在目录） */
function resolveManifestHref(opfDir, href) {
  const path = href.split('#')[0];
  return joinPosix(opfDir, decodePathSafe(path));
}

/** 解析某内容文档内部的 href（相对该文档所在目录），返回 {zipPath, frag} */
function resolveDocHref(docPath, href) {
  if (!href) return { zipPath: null, frag: null };
  const hashIdx = href.indexOf('#');
  const pathPart = hashIdx === -1 ? href : href.slice(0, hashIdx);
  const frag = hashIdx === -1 ? null : decodePathSafe(href.slice(hashIdx + 1)) || null;
  if (!pathPart) return { zipPath: docPath, frag };
  if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(pathPart)) return { zipPath: null, frag }; // 外部协议链接
  const zipPath = joinPosix(dirnamePosix(docPath), decodePathSafe(pathPart));
  return { zipPath, frag };
}

/* ============================================================
 * zip 存取
 * ============================================================ */

function findZipFile(zip, path) {
  const norm = path.replace(/^\/+/, '');
  let f = zip.file(norm);
  if (f) return f;
  const lower = norm.toLowerCase();
  for (const key of Object.keys(zip.files)) {
    if (key.toLowerCase() === lower) return zip.file(key);
  }
  return null;
}

async function readZipText(zip, path) {
  const f = findZipFile(zip, path);
  if (!f) return null;
  return f.async('string');
}

/* ============================================================
 * OPF 解析
 * ============================================================ */

function parseOpf(opfText) {
  const tokens = tokenizeXml(opfText);

  const metadataEls = findElements(tokens, (t) => localName(t) === 'metadata');
  const metaInner = metadataEls.length
    ? tokens.slice(metadataEls[0].startIdx + 1, metadataEls[0].endIdx - 1)
    : [];

  const pickAll = (name) => findElements(metaInner, (t) => localName(t) === name)
    .map((e) => tokensToText(metaInner.slice(e.startIdx + 1, e.endIdx - 1)))
    .filter(Boolean);
  const pickFirst = (name) => { const all = pickAll(name); return all.length ? all[0] : null; };

  const title = pickFirst('title');
  const creators = pickAll('creator');
  const creator = creators.length ? creators.join('、') : null;
  const language = pickFirst('language');
  const publisher = pickFirst('publisher');
  const date = pickFirst('date');
  const description = pickFirst('description');
  const identifier = pickFirst('identifier');

  let coverId = null;
  for (const m of findElements(metaInner, (t) => t === 'meta')) {
    if ((m.attrs.name || '').toLowerCase() === 'cover' && m.attrs.content) { coverId = m.attrs.content; break; }
  }

  const manifest = new Map();
  const manifestEls = findElements(tokens, (t) => localName(t) === 'manifest');
  if (manifestEls.length) {
    const inner = tokens.slice(manifestEls[0].startIdx + 1, manifestEls[0].endIdx - 1);
    for (const it of findElements(inner, (t) => t === 'item')) {
      const a = it.attrs;
      if (!a.id || !a.href) continue;
      manifest.set(a.id, {
        href: a.href,
        mediaType: (a['media-type'] || '').toLowerCase(),
        properties: (a.properties || '').split(/\s+/).filter(Boolean),
      });
    }
  }

  let spine = { ppd: null, items: [], tocId: null };
  const spineEls = findElements(tokens, (t) => localName(t) === 'spine');
  if (spineEls.length) {
    const se = spineEls[0];
    const inner = tokens.slice(se.startIdx + 1, se.endIdx - 1);
    const items = [];
    for (const ir of findElements(inner, (t) => t === 'itemref')) {
      if (!ir.attrs.idref) continue;
      items.push({ idref: ir.attrs.idref, linear: (ir.attrs.linear || 'yes').toLowerCase() !== 'no' });
    }
    spine = {
      ppd: (se.attrs['page-progression-direction'] || '').toLowerCase() || null,
      items,
      tocId: se.attrs.toc || null,
    };
  }

  return { title, creator, language, publisher, date, description, identifier, coverId, manifest, spine };
}

function findOpfPath(containerXml) {
  const tokens = tokenizeXml(containerXml);
  for (const r of findElements(tokens, (t) => localName(t) === 'rootfile')) {
    if (r.attrs['full-path']) return r.attrs['full-path'];
  }
  return null;
}

/* ============================================================
 * 加密检测：只有当被加密的资源是正文文档或图片时才判定为真正的 DRM
 * 并中止。常见的字体混淆（IDPF / Adobe 两种字体混淆算法，本产品本就不
 * 保留字体，读入不受影响）不中止，但也不再完全静默——返回一个标记，
 * 交由调用方在 book 建好后挂一条软 warning，让用户知情。
 * ============================================================ */

async function checkEncryption(zip, manifestByHref) {
  const encXml = await readZipText(zip, 'META-INF/encryption.xml');
  if (!encXml) return { softEncrypted: false };
  const tokens = tokenizeXml(encXml);
  let softEncrypted = false;
  for (const e of findElements(tokens, (t) => localName(t) === 'encrypteddata')) {
    const inner = tokens.slice(e.startIdx + 1, e.endIdx - 1);
    for (const r of findElements(inner, (t) => localName(t) === 'cipherreference')) {
      const uri = r.attrs.uri;
      if (!uri) continue;
      const path = decodePathSafe(uri).replace(/^\/+/, '');
      const info = manifestByHref.get(path);
      const mt = info ? info.mediaType : '';
      const looksBlocking = /^(application\/x?html\+xml|image\/)/i.test(mt)
        || /\.(x?html?|jpe?g|png|gif|svg|webp|bmp)$/i.test(path);
      if (looksBlocking) {
        fail('这本 EPUB 加了数字版权保护（DRM），无法读取内容。');
      }
      // 走到这里说明这条加密引用不指向正文/图片（典型如字体混淆），不阻断读入。
      softEncrypted = true;
    }
  }
  return { softEncrypted };
}

/* ============================================================
 * 图片资源登记
 * ============================================================ */

const MIME_BY_EXT = {
  jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif',
  svg: 'image/svg+xml', webp: 'image/webp', bmp: 'image/bmp',
};

function guessMimeFromExt(path) {
  const m = path.match(/\.([a-z0-9]+)$/i);
  return m ? (MIME_BY_EXT[m[1].toLowerCase()] || 'application/octet-stream') : 'application/octet-stream';
}

async function registerImage(zip, resources, cache, zipPath, mediaTypeHint) {
  if (cache.has(zipPath)) return cache.get(zipPath);
  const f = findZipFile(zip, zipPath);
  if (!f) { cache.set(zipPath, null); return null; }
  const data = new Uint8Array(await f.async('uint8array'));
  const mime = mediaTypeHint || guessMimeFromExt(zipPath);
  resources.set(zipPath, { href: zipPath, mime, data });
  cache.set(zipPath, zipPath);
  return zipPath;
}

/* ============================================================
 * 内容文档处理：svg 封面展开 / 脚注抽取 / 图片解析 / 章内链接改写
 * ============================================================ */

/** 常见的「svg 包一张图」封面写法：把 <svg><image xlink:href=".."/></svg> 展开成 <img> */
function unwrapSvgImages(tokens) {
  const matches = findElements(tokens, (tag) => tag === 'svg');
  for (let k = matches.length - 1; k >= 0; k--) {
    const m = matches[k];
    const inner = tokens.slice(m.startIdx + 1, m.endIdx - 1);
    const imgs = findElements(inner, (tag) => tag === 'image');
    let replacement = [];
    if (imgs.length) {
      const im = imgs[0];
      const href = im.attrs['xlink:href'] || im.attrs.href || '';
      if (href) replacement = [{ type: 'open', tag: 'img', attrs: { src: href, alt: '' }, selfClose: true }];
    }
    tokens.splice(m.startIdx, m.endIdx - m.startIdx, ...replacement);
  }
}

const NOTE_TYPES = new Set(['footnote', 'endnote', 'rearnote', 'note']);

/** 抽取 EPUB3 脚注块（epub:type 精确匹配，不误伤 "footnotes" 容器） */
function extractFootnotesFromTokens(tokens) {
  const isNoteEl = (tag, attrs) => {
    if (tag !== 'aside' && tag !== 'div' && tag !== 'section') return false;
    const types = (attrs['epub:type'] || '').toLowerCase().split(/\s+/);
    return types.some((t) => NOTE_TYPES.has(t));
  };
  const matches = findElements(tokens, isNoteEl);
  const extracted = [];
  for (let k = matches.length - 1; k >= 0; k--) {
    const m = matches[k];
    const id = m.attrs.id || null;
    if (!id) continue; // 没 id 就没法被引用，留在正文里当普通内容
    const inner = tokens.slice(m.startIdx + 1, m.endIdx - 1);
    extracted.push({ id, tokens: inner });
    tokens.splice(m.startIdx, m.endIdx - m.startIdx);
  }
  extracted.reverse();
  return extracted;
}

/** 把指向已抽取脚注 id 的 <a href="#id"> 改写为 <a class="noteref" href="#noteId"> */
function rewriteNoterefs(tokens, idToNoteId) {
  for (const t of tokens) {
    if (t.type !== 'open' || t.tag !== 'a') continue;
    const href = t.attrs.href || '';
    if (!href.startsWith('#')) continue;
    const localId = href.slice(1);
    if (!idToNoteId.has(localId)) continue;
    // class 必须排在 href 前面：validate() 的 noteref 正则要求这个顺序
    const rebuilt = { class: `${(t.attrs.class || '').trim()} noteref`.trim() };
    for (const [k, v] of Object.entries(t.attrs)) {
      if (k === 'class' || k === 'epub:type') continue;
      rebuilt[k] = k === 'href' ? `#${idToNoteId.get(localId)}` : v;
    }
    t.attrs = rebuilt;
  }
}

/** 解析并登记正文里的 <img src>，把 src 改写为 resources 里的键 */
async function resolveImagesInTokens(tokens, docPath, zip, resources, imgCache, manifestByHref, missing) {
  let i = 0;
  while (i < tokens.length) {
    const t = tokens[i];
    if (t.type === 'open' && t.tag === 'img') {
      const src = t.attrs.src;
      let rid = null;
      if (src) {
        const { zipPath } = resolveDocHref(docPath, src);
        if (zipPath) {
          const info = manifestByHref.get(zipPath);
          rid = await registerImage(zip, resources, imgCache, zipPath, info && info.mediaType);
        }
      }
      if (rid) {
        t.attrs = { ...t.attrs, src: rid };
        i += 1;
        continue;
      }
      missing.push(src || '(空 src)');
      tokens.splice(i, 1);
      if (tokens[i] && tokens[i].type === 'close' && tokens[i].tag === 'img') tokens.splice(i, 1);
      continue;
    }
    i += 1;
  }
}

/** 章内 <a href> 交叉引用改写（BOOK-IR §2.1 约定） */
function classifyLink(href, docPath, hrefToChapterId) {
  if (!href) return { kind: 'drop' };
  if (href.startsWith('#')) {
    const frag = href.slice(1);
    return frag ? { kind: 'same', frag } : { kind: 'drop' };
  }
  if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(href)) return { kind: 'drop' }; // http(s): mailto: 等外部协议
  const { zipPath, frag } = resolveDocHref(docPath, href);
  if (!zipPath) return { kind: 'drop' };
  if (zipPath === docPath) return frag ? { kind: 'same', frag } : { kind: 'drop' };
  const chapterId = hrefToChapterId.get(zipPath);
  if (chapterId) return { kind: 'cross', chapterId };
  return { kind: 'drop' };
}

function unwrapElement(tokens, startIdx) {
  const tag = tokens[startIdx].tag;
  let depth = 1, j = startIdx + 1;
  while (j < tokens.length && depth > 0) {
    const tj = tokens[j];
    if (tj.type === 'open' && tj.tag === tag && !tj.selfClose) depth += 1;
    else if (tj.type === 'close' && tj.tag === tag) depth -= 1;
    j += 1;
  }
  if (depth !== 0) return false;
  tokens.splice(j - 1, 1);
  tokens.splice(startIdx, 1);
  return true;
}

function rewriteAnchors(tokens, docPath, hrefToChapterId) {
  let i = 0;
  while (i < tokens.length) {
    const t = tokens[i];
    if (t.type === 'open' && t.tag === 'a' && t.attrs && t.attrs.href) {
      const decision = classifyLink(t.attrs.href, docPath, hrefToChapterId);
      if (decision.kind === 'same') { t.attrs.href = `#${decision.frag}`; i += 1; continue; }
      if (decision.kind === 'cross') { t.attrs.href = `#${decision.chapterId}`; i += 1; continue; }
      if (t.selfClose) { tokens.splice(i, 1); continue; }
      const ok = unwrapElement(tokens, i);
      if (!ok) i += 1;
      continue;
    }
    i += 1;
  }
}

function extractBody(xhtmlText) {
  const m = xhtmlText.match(/<body\b[^>]*>([\s\S]*)<\/body>/i);
  return m ? m[1] : xhtmlText;
}

function extractFirstHeading(html) {
  const m = html.match(/<h[1-6]\b[^>]*>([\s\S]*?)<\/h[1-6]>/i);
  if (!m) return null;
  const text = decodeXmlEntities(m[1].replace(/<[^>]+>/g, '')).trim();
  return text || null;
}

/* ============================================================
 * 目录（nav / ncx）解析
 * ============================================================ */

/** <ol><li><a href>Title</a>[<ol>...</ol>]</li></ol> → 原始树 {title,href,children} */
function parseOlList(tokens) {
  const raw = [];
  for (const li of findElements(tokens, (tag) => tag === 'li')) {
    const inner = tokens.slice(li.startIdx + 1, li.endIdx - 1);
    const labelEls = findElements(inner, (tag) => tag === 'a' || tag === 'span');
    let title = '', href = null;
    if (labelEls.length) {
      const e = labelEls[0];
      title = tokensToText(inner.slice(e.startIdx + 1, e.endIdx - 1));
      href = e.attrs.href || null;
    }
    let children = [];
    const olEls = findElements(inner, (tag) => tag === 'ol');
    if (olEls.length) {
      const olInner = inner.slice(olEls[0].startIdx + 1, olEls[0].endIdx - 1);
      children = parseOlList(olInner);
    }
    raw.push({ title, href, children });
  }
  return raw;
}

/** NCX <navPoint><navLabel><text>Title</text></navLabel><content src=".."/>...</navPoint> */
function parseNavPoints(tokens) {
  const raw = [];
  for (const np of findElements(tokens, (t) => localName(t) === 'navpoint')) {
    const inner = tokens.slice(np.startIdx + 1, np.endIdx - 1);
    let title = '';
    const labelEls = findElements(inner, (t) => localName(t) === 'navlabel');
    if (labelEls.length) {
      const le = labelEls[0];
      const labelInner = inner.slice(le.startIdx + 1, le.endIdx - 1);
      const textEls = findElements(labelInner, (t) => t === 'text');
      if (textEls.length) {
        const te = textEls[0];
        title = tokensToText(labelInner.slice(te.startIdx + 1, te.endIdx - 1));
      }
    }
    let href = null;
    const contentEls = findElements(inner, (t) => t === 'content');
    if (contentEls.length) href = contentEls[0].attrs.src || null;
    const children = parseNavPoints(inner);
    raw.push({ title, href, children });
  }
  return raw;
}

/** 原始 {title,href,children} 树 → IR Nav[]（无法解析的节点被丢弃，子节点提升到上一级） */
function convertNavTree(rawList, navDocPath, hrefToChapterId, level) {
  const out = [];
  for (const raw of rawList) {
    const kids = convertNavTree(raw.children, navDocPath, hrefToChapterId, level + 1);
    if (!raw.href) { out.push(...kids); continue; }
    const { zipPath, frag } = resolveDocHref(navDocPath, raw.href);
    const chapterId = zipPath ? hrefToChapterId.get(zipPath) : null;
    if (!chapterId) { out.push(...kids); continue; }
    out.push({ title: raw.title || '', target: chapterId, anchor: frag || null, level, children: kids });
  }
  return out;
}

function collectChapterLevels(nav, map) {
  for (const n of nav) {
    if (n.anchor == null) {
      const cur = map.get(n.target);
      if (cur == null || n.level < cur) map.set(n.target, n.level);
    }
    if (n.children.length) collectChapterLevels(n.children, map);
  }
}

/* ============================================================
 * 单个 spine 条目的处理（第一遍：抽取 body / 展开封面 / 抽脚注 / 登记图片）
 * ============================================================ */

async function processSpineDoc(zip, docPath, resources, imgCache, manifestByHref, book, state) {
  const raw = await readZipText(zip, docPath);
  if (raw == null) return null;

  const tokens = tokenizeXml(extractBody(raw));
  unwrapSvgImages(tokens);

  const footnotes = extractFootnotesFromTokens(tokens);
  const idToNoteId = new Map();
  for (const fn of footnotes) {
    const noteId = `n${++state.noteCounter}`;
    idToNoteId.set(fn.id, noteId);
    await resolveImagesInTokens(fn.tokens, docPath, zip, resources, imgCache, manifestByHref, state.missingImages);
    book.notes.set(noteId, { html: sanitizeHtml(serializeTokens(fn.tokens)) });
  }
  rewriteNoterefs(tokens, idToNoteId);

  await resolveImagesInTokens(tokens, docPath, zip, resources, imgCache, manifestByHref, state.missingImages);

  return { docPath, tokens };
}

/* ============================================================
 * 主入口
 * ============================================================ */

async function read(buf, opts = {}) {
  const JSZipLib = globalThis.JSZip;
  if (!JSZipLib) fail('暂时无法处理 EPUB 文件，请刷新页面后重试。');

  let zip;
  try {
    zip = await JSZipLib.loadAsync(buf);
  } catch {
    fail('这似乎不是有效的 EPUB 文件。');
  }

  const containerXml = await readZipText(zip, 'META-INF/container.xml');
  if (!containerXml) fail('这似乎不是有效的 EPUB 文件（缺少必要的目录信息）。');
  const opfPath = findOpfPath(containerXml);
  if (!opfPath) fail('这似乎不是有效的 EPUB 文件（找不到书籍清单）。');
  const opfText = await readZipText(zip, opfPath);
  if (!opfText) fail('这似乎不是有效的 EPUB 文件（书籍清单缺失）。');
  const opfDir = dirnamePosix(opfPath);

  const opf = parseOpf(opfText);
  if (!opf.spine.items.length) fail('这本 EPUB 没有可读取的正文内容。');

  const manifestByHref = new Map();
  for (const [id, item] of opf.manifest) {
    manifestByHref.set(resolveManifestHref(opfDir, item.href), { id, mediaType: item.mediaType, properties: item.properties });
  }

  const encryptionInfo = await checkEncryption(zip, manifestByHref);

  const book = newBook({
    title: opf.title || titleFromFilename(opts.filename),
    author: opf.creator,
    language: opf.language || undefined,
    identifier: opf.identifier || undefined,
    publisher: opf.publisher,
    date: opf.date,
    description: opf.description,
    writingMode: opf.spine.ppd === 'rtl' ? 'vertical-rl' : 'horizontal-tb',
  });

  if (encryptionInfo.softEncrypted) {
    warn(book, 'epub.encrypted', '检测到加密信息，但仅涉及字体等非正文资源（如字体混淆），不影响阅读，本产品也不保留字体。');
  }

  const resources = book.resources;
  const imgCache = new Map();

  // 封面
  let coverZipPath = null;
  for (const [, item] of opf.manifest) {
    if (item.properties.includes('cover-image')) { coverZipPath = resolveManifestHref(opfDir, item.href); break; }
  }
  if (!coverZipPath && opf.coverId) {
    const item = opf.manifest.get(opf.coverId);
    if (item && /^image\//.test(item.mediaType)) coverZipPath = resolveManifestHref(opfDir, item.href);
  }
  if (coverZipPath) {
    const info = manifestByHref.get(coverZipPath);
    book.cover = await registerImage(zip, resources, imgCache, coverZipPath, info && info.mediaType);
  }

  // 目录来源：EPUB3 nav 优先，否则回退 NCX
  let navRawTree = null, navDocPath = null;
  for (const [, item] of opf.manifest) {
    if (item.properties.includes('nav')) { navDocPath = resolveManifestHref(opfDir, item.href); break; }
  }
  if (navDocPath) {
    const navText = await readZipText(zip, navDocPath);
    if (navText) {
      const navTokens = tokenizeXml(navText);
      const navEls = findElements(navTokens, (t) => t === 'nav');
      let chosen = navEls.find((e) => /(^|\s)toc(\s|$)/i.test(e.attrs['epub:type'] || ''));
      if (!chosen) chosen = navEls[0];
      if (chosen) {
        const inner = navTokens.slice(chosen.startIdx + 1, chosen.endIdx - 1);
        const olEls = findElements(inner, (t) => t === 'ol');
        if (olEls.length) navRawTree = parseOlList(inner.slice(olEls[0].startIdx + 1, olEls[0].endIdx - 1));
      }
    }
  }
  if (!navRawTree) {
    let ncxDocPath = null;
    if (opf.spine.tocId) {
      const item = opf.manifest.get(opf.spine.tocId);
      if (item) ncxDocPath = resolveManifestHref(opfDir, item.href);
    }
    if (!ncxDocPath) {
      for (const [, item] of opf.manifest) {
        if (item.mediaType === 'application/x-dtbncx+xml') { ncxDocPath = resolveManifestHref(opfDir, item.href); break; }
      }
    }
    if (ncxDocPath) {
      const ncxText = await readZipText(zip, ncxDocPath);
      if (ncxText) {
        const ncxTokens = tokenizeXml(ncxText);
        const navMapEls = findElements(ncxTokens, (t) => localName(t) === 'navmap');
        if (navMapEls.length) {
          navRawTree = parseNavPoints(ncxTokens.slice(navMapEls[0].startIdx + 1, navMapEls[0].endIdx - 1));
          navDocPath = ncxDocPath;
        }
      }
    }
  }

  // spine → chapters（第一遍：抽取/登记，容错内部异常）
  const state = { noteCounter: 0, missingImages: [] };
  const docs = [];
  let idx = 0;
  try {
    for (const spItem of opf.spine.items) {
      idx += 1;
      const item = opf.manifest.get(spItem.idref);
      if (!item) { warn(book, 'epub.broken-spine-item', `spine 引用了不存在的清单项: ${spItem.idref}`); continue; }
      const docPath = resolveManifestHref(opfDir, item.href);
      const processed = await processSpineDoc(zip, docPath, resources, imgCache, manifestByHref, book, state);
      if (!processed) { warn(book, 'epub.broken-spine-item', `找不到内容文档: ${docPath}`); continue; }
      docs.push({ id: `c${docs.length + 1}`, ...processed });
      if (idx % 4 === 0) await tick();
    }
  } catch (e) {
    fail(`解析这本 EPUB 时出了问题，文件可能已损坏或不规范（${e.message}）。`);
  }

  if (!docs.length) fail('这本 EPUB 没有可读取的正文内容。');

  const hrefToChapterId = new Map();
  for (const d of docs) hrefToChapterId.set(d.docPath, d.id);

  book.nav = navRawTree ? convertNavTree(navRawTree, navDocPath, hrefToChapterId, 1) : [];
  if (!book.nav.length && docs.length > 1) warn(book, 'epub.no-toc', '未找到可用目录，已按 spine 顺序生成章节');

  const levelByChapter = new Map();
  collectChapterLevels(book.nav, levelByChapter);

  let di = 0;
  for (const d of docs) {
    di += 1;
    rewriteAnchors(d.tokens, d.docPath, hrefToChapterId);
    const html = sanitizeHtml(serializeTokens(d.tokens));
    const title = extractFirstHeading(html);
    const level = Math.min(3, Math.max(1, levelByChapter.get(d.id) || 1));
    book.chapters.push({ id: d.id, title, level, html });
    if (di % 6 === 0) await tick();
  }

  if (state.missingImages.length) {
    warn(book, 'epub.missing-image', `${state.missingImages.length} 处图片引用未在书内找到，已忽略`);
  }

  return book;
}

function titleFromFilename(name) {
  if (!name) return undefined;
  const base = String(name).split(/[/\\]/).pop().replace(/\.[^.]+$/, '');
  return base || undefined;
}

return { read };
})();

/* ==== src/readers/docx.js ==== */
SJ.readers.docx = (function () {
'use strict';
/* ============================================================
 * src/readers/docx.js · DOCX → Book IR
 *
 * 分工：globalThis.mammoth（vendor 注入的 UMD，浏览器端由集成层按需从 CDN
 *   加载；本模块自己不发任何网络请求）负责「OOXML → HTML」的转换；本模块
 *   只做「HTML → IR」的整形：
 *     - 按 h1/h2/h3 切章、按标题层级建 nav 树（h4-h6 保留在正文内当子标题，
 *       不参与切章——IR 的 chapter.level 只有 1|2|3，这是 schema 的硬限制，
 *       不是本 reader 的降级）
 *     - <w:drawing> 内嵌图片 → resources（写成真实文件而非 data URI）
 *     - 脚注/尾注 → notes，正文留 <a class="noteref">（BOOK-IR §2.1 约定：
 *       脚注/尾注不作区分，统一进 notes）
 *
 * mammoth 产出的 HTML 已经是干净的白名单子集（h1-h6/p/img/sup/a…），但仍
 * 过一遍 sanitizeHtml() 兜底——不直接信任第三方输出，尤其是 style 属性。
 *
 * 元数据：docProps/core.xml 不在 mammoth 的产出范围内（它只转换正文），
 *   用 globalThis.JSZip（vendor 同源注入）单独读一次。JSZip 缺失时静默跳过
 *   ——书名/作者是锦上添花，缺了不影响正文与结构，不值得因此让整本书读取失败。
 * ============================================================ */

const { newBook, warn, sanitizeHtml, plainText } = SJ.ir;

/** 常见图片 MIME → 扩展名。查不到时退回 mime 子类型本身。 */
const IMG_EXT = {
  'image/png': 'png',
  'image/jpeg': 'jpg',
  'image/gif': 'gif',
  'image/bmp': 'bmp',
  'image/tiff': 'tiff',
  'image/webp': 'webp',
  'image/svg+xml': 'svg',
  'image/x-emf': 'emf',
  'image/x-wmf': 'wmf',
};

/** 环境中立的让出主线程：浏览器/Node 都有 setTimeout。 */
function tick() {
  return new Promise((resolve) => {
    if (typeof setTimeout === 'function') setTimeout(resolve, 0);
    else resolve();
  });
}

/* ---------- base64 → bytes，不依赖 atob/Buffer（浏览器与 Node 都要能跑） ---------- */
const B64_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function base64ToBytes(b64) {
  const s = String(b64 || '').replace(/[^A-Za-z0-9+/=]/g, '');
  const len = s.length;
  if (!len) return new Uint8Array(0);
  let outLen = (len / 4) * 3;
  if (s[len - 1] === '=') outLen--;
  if (s[len - 2] === '=') outLen--;
  const bytes = new Uint8Array(Math.max(0, outLen));
  let p = 0;
  for (let i = 0; i < len; i += 4) {
    const e1 = B64_ALPHABET.indexOf(s[i]);
    const e2 = B64_ALPHABET.indexOf(s[i + 1]);
    const e3 = B64_ALPHABET.indexOf(s[i + 2]);
    const e4 = B64_ALPHABET.indexOf(s[i + 3]);
    const c1 = (e1 << 2) | (e2 >> 4);
    const c2 = ((e2 & 15) << 4) | (e3 >> 2);
    const c3 = ((e3 & 3) << 6) | (e4 & 63);
    if (p < outLen) bytes[p++] = c1;
    if (e3 !== -1 && p < outLen) bytes[p++] = c2;
    if (e4 !== -1 && p < outLen) bytes[p++] = c3;
  }
  return bytes;
}

function toArrayBuffer(buf) {
  if (buf instanceof ArrayBuffer) return buf;
  if (ArrayBuffer.isView(buf)) return buf.buffer.slice(buf.byteOffset, buf.byteOffset + buf.byteLength);
  throw new Error('这似乎不是有效的 DOCX 文件');
}

function looksLikeZip(bytes) {
  // ZIP 本地文件头 PK\x03\x04，空压缩包 PK\x05\x06，分卷 PK\x07\x08
  return bytes.length >= 4 && bytes[0] === 0x50 && bytes[1] === 0x4b &&
    (bytes[2] === 0x03 || bytes[2] === 0x05 || bytes[2] === 0x07);
}

/* ---------- docProps/core.xml：可选的书籍元数据补充 ---------- */
function xmlText(xml, tag) {
  const m = xml.match(new RegExp(`<${tag}[^>]*>([\\s\\S]*?)</${tag}>`, 'i'));
  if (!m) return null;
  const text = m[1]
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'").replace(/&amp;/g, '&')
    .trim();
  return text || null;
}

async function readCoreProps(bytes) {
  const JSZipLib = globalThis.JSZip;
  if (!JSZipLib) return {};
  try {
    const zip = await JSZipLib.loadAsync(bytes);
    const entry = zip.file('docProps/core.xml');
    if (!entry) return {};
    const xml = await entry.async('string');
    return {
      title: xmlText(xml, 'dc:title'),
      author: xmlText(xml, 'dc:creator'),
      description: xmlText(xml, 'dc:description') || xmlText(xml, 'dc:subject'),
      language: xmlText(xml, 'dc:language'),
      date: xmlText(xml, 'dcterms:created'),
      publisher: xmlText(xml, 'dc:publisher'),
    };
  } catch {
    return {}; // 元数据是锦上添花，读不到就算了，不影响正文
  }
}

/** 构造 mammoth 的 convertImage 回调：把图片写进 resources，返回内部路径。 */
function makeImageConverter(book, counter) {
  return async function convertImage(image) {
    const base64 = await image.read('base64');
    const bytes = base64ToBytes(base64);
    const mime = image.contentType || 'application/octet-stream';
    const ext = IMG_EXT[mime] || (mime.split('/')[1] || 'bin').replace(/[^a-z0-9]/gi, '') || 'bin';
    const idx = ++counter.n;
    const rid = `img-${idx}`;
    const href = `images/${rid}.${ext}`;
    book.resources.set(rid, { href, mime, data: bytes });
    return { src: href }; // mammoth 会自动补 alt（来自 element.altText），这里不必重复设置
  };
}

/**
 * 从 mammoth 产出的 HTML 里摘出脚注/尾注列表。
 *
 * mammoth 把脚注/尾注渲染成 <li id="footnote-N">/<li id="endnote-N">，统一
 * 附加在正文末尾的一个 <ol> 里；但文档正文本身的有序列表也会被渲染成 <ol>，
 * 两者无法靠"最后一个 <ol>"这种位置启发式区分——必须按 id 精确摘取。
 *
 * 摘取后 <li> 所在的 <ol> 若被掏空会自动留下 <ol></ol>，一并清理。
 *
 * @returns {{html: string, notes: Array<[string, string]>}}
 */
function extractNotes(html) {
  const notes = [];
  let out = html.replace(/<li id="((?:footnote|endnote)-[^"]+)">([\s\S]*?)<\/li>/g, (m, id, inner) => {
    notes.push([id, inner]);
    return '';
  });
  out = out.replace(/<ol>\s*<\/ol>/g, '');
  return { html: out, notes };
}

/** 去掉 mammoth 自动追加在脚注末尾的"↑"回链——它是给交互式网页用的，静态书里没有意义。 */
function stripBackLink(noteHtml) {
  return noteHtml
    .replace(/<a href="#(?:footnote|endnote)-ref-[^"]+">[^<]*<\/a>/g, '')
    .replace(/[ \t]+<\/p>/g, '</p>');
}

/** 把正文里的脚注引用 <sup><a href="#footnote-1" id="footnote-ref-1">[1]</a></sup>
 *  改写成 IR 的 noteref 约定：<a class="noteref" href="#footnote-1">1</a>。 */
function rewriteNoteRefs(html) {
  return html.replace(/<sup><a\s+([^>]*)>\s*\[(\d+)\]\s*<\/a><\/sup>/g, (m, attrs, num) => {
    const hrefM = attrs.match(/href="#([^"]+)"/);
    if (!hrefM) return m;
    return `<sup><a class="noteref" href="#${hrefM[1]}">${num}</a></sup>`;
  });
}

/**
 * 按 h1/h2/h3 把整篇 HTML 切成章节，并同步建出 nav 树。
 * 标题不重复进 html（与 txt/md reader 的既有约定一致）。
 * @returns {{sawHeading: boolean}}
 */
async function splitChapters(book, html) {
  const HEAD_RE = /<h([1-3])(?:\s[^>]*)?>([\s\S]*?)<\/h\1>/g;
  const matches = [...html.matchAll(HEAD_RE)];
  let ci = 0;
  const navStack = []; // [{level, node}]

  const pushChapter = (title, level, htmlChunk) => {
    const id = `c${++ci}`;
    book.chapters.push({ id, title, level, html: sanitizeHtml(htmlChunk) });
    return id;
  };
  const attachNav = (title, level, target) => {
    const node = { title, target, anchor: null, level, children: [] };
    while (navStack.length && navStack[navStack.length - 1].level >= level) navStack.pop();
    if (navStack.length) navStack[navStack.length - 1].node.children.push(node);
    else book.nav.push(node);
    navStack.push({ level, node });
  };

  if (matches.length === 0) {
    // 整篇没有任何 h1-h3：单章，标题退回书名（与 txt reader「全文无标题→title=文件名」同一约定）
    if (plainText(html).trim()) pushChapter(book.meta.title, 1, html);
    return { sawHeading: false };
  }

  const first = matches[0];
  if (first.index > 0) {
    const pre = html.slice(0, first.index);
    if (plainText(pre).trim()) pushChapter(null, 1, pre); // 首个标题前的正文 → 无标题章
  }

  for (let i = 0; i < matches.length; i++) {
    const mm = matches[i];
    const level = Number(mm[1]);
    const title = plainText(mm[2]).trim() || null;
    const start = mm.index + mm[0].length;
    const end = i + 1 < matches.length ? matches[i + 1].index : html.length;
    const id = pushChapter(title, level, html.slice(start, end));
    if (title) attachNav(title, level, id);
    if ((i & 15) === 15) await tick(); // 大文档让出主线程
  }
  return { sawHeading: true };
}

/**
 * @param {ArrayBuffer|Uint8Array} buf
 * @param {{filename?: string, language?: string}} [opts]
 * @returns {Promise<import('../ir.js').Book>}
 */
async function read(buf, opts = {}) {
  const mammoth = globalThis.mammoth;
  if (!mammoth || typeof mammoth.convertToHtml !== 'function') {
    throw new Error('DOCX 解析组件尚未就绪，请刷新页面重试');
  }

  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(toArrayBuffer(buf));
  if (!looksLikeZip(bytes)) throw new Error('这似乎不是有效的 DOCX 文件');

  const arrayBuffer = toArrayBuffer(bytes);
  const core = await readCoreProps(bytes);
  const filename = opts.filename ? String(opts.filename).replace(/\.docx$/i, '') : null;

  const book = newBook({
    title: core.title || filename || undefined,
    author: core.author || undefined,
    language: core.language || opts.language || undefined,
    date: core.date || undefined,
    description: core.description || undefined,
    publisher: core.publisher || undefined,
  });

  const counter = { n: 0 };
  let result;
  try {
    result = await mammoth.convertToHtml(
      { arrayBuffer },
      { convertImage: mammoth.images.imgElement(makeImageConverter(book, counter)) },
    );
  } catch {
    throw new Error('这似乎不是有效的 DOCX 文件，可能已损坏');
  }

  for (const msg of result.messages || []) {
    if (msg && msg.type && msg.type !== 'info') {
      warn(book, 'docx.mammoth-message', msg.message || String(msg));
    }
  }

  let html = result.value || '';

  const { html: withoutNotes, notes } = extractNotes(html);
  html = rewriteNoteRefs(withoutNotes);
  for (const [id, inner] of notes) {
    book.notes.set(id, { html: sanitizeHtml(stripBackLink(inner)) });
  }

  const { sawHeading } = await splitChapters(book, html);
  if (!sawHeading) warn(book, 'docx.no-headings', '文档没有可识别的标题层级，已作为单章处理');

  if (book.chapters.length === 0) {
    // 兜底：整篇没有任何正文（极端空文档）
    book.chapters.push({ id: 'c1', title: null, level: 1, html: '' });
  }

  return book;
}

return { read };
})();

/* ==== src/readers/zip.js ==== */
SJ.readers.zip = (function () {
'use strict';
/* ============================================================
 * src/readers/zip.js · ZIP 压缩包 → Book IR（分发器）
 *
 * ZIP 本身不是一种书籍格式，是容器。这个 reader 不产出书籍内容本身，
 * 而是解包后按内含文件的扩展名分发给对应的兄弟 reader（黑盒调用它们的
 * read()，不复制其解析逻辑），拿到它们产出的 Book。
 *
 * ---- 单本 / 多本契约（IR 只描述"一本书"，没有"多本书"的概念，
 *      这一点由本模块自行决定如何对外暴露，见下）----
 *
 *   export async function read(buf, opts) -> Book
 *     通用单本契约（roundtrip.mjs、以及任何期待"一个文件进来一本书出去"
 *     的调用点用这个）。
 *       - zip 内找到 1 本可识别的书 → 返回它。
 *       - zip 内找到 0 本 → 抛出人话错误。
 *       - zip 内找到 >1 本 → 按内含条目名排序，返回第一本，并在它的
 *         warnings 里记 `zip.multiple-books`、列出被忽略的条目名——
 *         不静默丢书（I4）。多本场景的正确用法是下面的 readAll()。
 *
 *   export async function readAll(buf, opts) -> Array<{ name, book }>
 *     "逐本处理"的真正入口（REQUIREMENTS.md R1 对 zip 的验收口径）。
 *     zip 内每个能识别的书籍文件各自独立解析成一本 Book。UI 层拿到这个
 *     列表后应该把每一本当独立文件走完整处理流程，而不是合并成一本。
 *     read() 只是它在"只要一本"场景下的收窄视图。
 *
 * ---- 支持的内含格式 ----
 *   当前只分发到已经落地的兄弟 reader：.txt / .md / .epub。
 *   .docx / .mobi / .azw3 / .pdf 已规划但兄弟 reader 还没落地，遇到时
 *   记 `zip.unsupported`（与"根本不是书"的文件区分对待，不静默）。
 *   这个映射表将来随对应 reader 落地需要手动补（见文件底部 DISPATCH）。
 *
 * ---- 嵌套 zip：只展开一层（REQUIREMENTS.md R1 zip 行）----
 *   外层 zip 里的 zip 会被当作子容器整体展开、并入候选列表；子 zip 里
 *   如果还有 zip，不再展开，记 `zip.nested-too-deep`。
 *
 * ---- 非书文件 ----
 *   压缩软件/操作系统自动生成的垃圾条目（__MACOSX/、.DS_Store、
 *   Thumbs.db、AppleDouble 的 ._ 前缀文件）彻底静默，不计入任何 warning
 *   ——这些跟"用户塞进来的书"无关。
 *   其余识别不了的文件（图片、样式表等）会被跳过，但为了不用几十条
 *   warning 淹没用户，这里把它们**聚合成一条** `zip.skipped`（BOOK-IR.md
 *   §4 zip 行要求"记录跳过的文件"，聚合仍满足"记录"，但不逐条打扰）。
 *
 * ---- 已知缺口 ----
 *   zip 内 .md 文件引用同目录相对路径图片时，本 reader 会把同目录的
 *   图片文件读出来，通过 opts.siblingAssets（Map<文件名, Uint8Array>）
 *   传给 md reader —— 但 md reader 当前的 opts 契约不消费这个字段
 *   （STATUS.md 已登记的已知缺口），所以图片仍会按 md reader 自己的
 *   降级路径变成 alt 文字 + warning。这里只是把管道先接好，等 md reader
 *   补上消费端就能直接工作，不需要再改 zip.js。
 *
 * 文件名编码：zip 条目名可能来自没打 UTF-8 标记位的旧压缩包（GBK/Big5）。
 *   通过 JSZip 的 decodeFileName 钩子逐条尝试 UTF-8 → GB18030 → Big5，
 *   全部失败时退回宽容 UTF-8 解码（可能出现替换字符），不让整包解析失败。
 *
 * 环境中立：只假定 globalThis.JSZip 存在，不加载任何外部脚本、不发任何
 *   网络请求。大包处理中定期 await 一次 tick，避免占死主线程。
 * ============================================================ */

const { warn } = SJ.ir;
const { read: readTxt } = SJ.readers.txt;
const { read: readMd } = SJ.readers.md;
const { read: readEpub } = SJ.readers.epub;

// 命名刻意加 zip 前缀：build.mjs 把所有模块拼进同一个 <script> 作用域，
// 剥掉 export 后，重名的顶层 const/function 会互相冲突（函数声明静默
// 覆盖、const 直接报重复声明的 SyntaxError）。这里避免再制造新的重名。
const zipTick = () => new Promise((resolve) => setTimeout(resolve, 0));

function zipFail(message) {
  throw new Error(message);
}

/** 已经落地、可以分发的兄弟 reader */
const DISPATCH = {
  '.txt': readTxt,
  '.md': readMd,
  '.epub': readEpub,
};

/** 已规划但兄弟 reader 还没落地的格式：识别出来但暂不能处理，与"非书文件"区分 */
const PLANNED_NOT_READY = new Set(['.docx', '.mobi', '.azw3', '.pdf']);

/** 视觉上像图片的扩展名，用于给 md 兄弟文件收集同目录图片 */
const IMAGE_EXT = new Set(['.png', '.jpg', '.jpeg', '.gif', '.svg', '.webp', '.bmp']);

function extOf(name) {
  const m = /\.[^./\\]+$/.exec(name);
  return m ? m[0].toLowerCase() : '';
}

function baseName(name) {
  const parts = String(name).split('/');
  return parts[parts.length - 1];
}

function dirOf(name) {
  const i = String(name).lastIndexOf('/');
  return i === -1 ? '' : name.slice(0, i + 1);
}

/** 压缩软件/操作系统自动生成的垃圾条目：跟用户塞进来的书无关，彻底静默 */
function isJunkEntry(name) {
  if (name.startsWith('__MACOSX/')) return true;
  const b = baseName(name);
  if (b === '.DS_Store' || b === 'Thumbs.db' || b === 'desktop.ini') return true;
  if (b.startsWith('._')) return true; // AppleDouble 资源叉文件
  return false;
}

/* ---------- 条目名编码嗅探 ---------- */

/**
 * JSZip 的 decodeFileName 钩子：不管有没有打 UTF-8 标记位都会调用。
 * 现代 zip 的条目名多数就是合法 UTF-8，严格解码会直接成功；老旧的中文
 * 压缩包用的是 GBK/Big5，严格 UTF-8 解码会先失败，再依次尝试这两种。
 */
function decodeEntryName(bytes) {
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  } catch { /* 不是合法 UTF-8，往下试中文遗留编码 */ }
  for (const enc of ['gb18030', 'big5']) {
    try {
      return new TextDecoder(enc, { fatal: true }).decode(bytes);
    } catch { /* 试下一种 */ }
  }
  // 全部严格解码失败：宽容解码兜底，允许出现替换字符，但不让整包解析崩掉
  return new TextDecoder('utf-8').decode(bytes);
}

async function loadZip(buf) {
  const JSZip = globalThis.JSZip;
  if (!JSZip) zipFail('压缩包解析组件未加载，请刷新页面重试。');
  try {
    return await JSZip.loadAsync(buf, { decodeFileName: decodeEntryName });
  } catch {
    zipFail('这似乎不是有效的 ZIP 压缩包，或文件已损坏。');
  }
}

/**
 * 展开一层 zip，把内含条目分类。
 * @param {*} zip JSZip 实例
 * @param {number} depth 当前嵌套深度（顶层=0）
 * @returns {Promise<{candidates: Array, unsupported: string[], skipped: string[], tooDeep: string[]}>}
 */
async function classify(zip, depth) {
  const candidates = [];   // {name, ext, entry, zipRef}
  const unsupported = [];  // 已规划但 reader 未落地的格式
  const skipped = [];      // 既不是书也不是已规划格式；或处理失败的条目
  const tooDeep = [];      // 嵌套 zip 超过一层

  const names = Object.keys(zip.files);
  for (let i = 0; i < names.length; i++) {
    if (i % 8 === 0) await zipTick();
    const name = names[i];
    const entry = zip.files[name];
    if (entry.dir) continue;
    if (isJunkEntry(name)) continue;

    const ext = extOf(name);

    if (ext === '.zip') {
      if (depth >= 1) { tooDeep.push(name); continue; }
      try {
        const innerBytes = await entry.async('uint8array');
        const innerZip = await globalThis.JSZip.loadAsync(innerBytes, { decodeFileName: decodeEntryName });
        const inner = await classify(innerZip, depth + 1);
        for (const c of inner.candidates) candidates.push({ ...c, name: `${name}/${c.name}` });
        for (const n of inner.unsupported) unsupported.push(`${name}/${n}`);
        for (const n of inner.skipped) skipped.push(`${name}/${n}`);
        for (const n of inner.tooDeep) tooDeep.push(`${name}/${n}`);
      } catch {
        skipped.push(`${name}（内层压缩包已损坏）`);
      }
      continue;
    }

    if (DISPATCH[ext]) { candidates.push({ name, ext, entry, zipRef: zip }); continue; }
    if (PLANNED_NOT_READY.has(ext)) { unsupported.push(name); continue; }
    skipped.push(name);
  }

  return { candidates, unsupported, skipped, tooDeep };
}

/**
 * 给 md 候选收集同目录下的图片兄弟文件，best-effort，见文件头「已知缺口」。
 * 同时把消耗掉的条目原始名一并返回——调用方要把它们从"跳过"清单里摘掉，
 * 不然明明被用上的图片会被 warning 误报成"已跳过"，违反 warnings 的诚实义务。
 */
async function collectSiblingAssets(zipRef, entryPath) {
  const dir = dirOf(entryPath);
  const map = new Map();
  const consumedRawNames = [];
  for (const name of Object.keys(zipRef.files)) {
    if (name === entryPath) continue;
    const f = zipRef.files[name];
    if (f.dir || isJunkEntry(name)) continue;
    if (!name.startsWith(dir)) continue;
    if (name.slice(dir.length).includes('/')) continue; // 只取同级，不递归子文件夹
    if (!IMAGE_EXT.has(extOf(name))) continue;
    map.set(baseName(name), await f.async('uint8array'));
    consumedRawNames.push(name);
  }
  return { map, consumedRawNames };
}

function truncatedList(list, max = 5) {
  const shown = list.slice(0, max).join('、');
  const more = list.length > max ? ` 等共 ${list.length} 个` : '';
  return `${shown}${more}`;
}

/**
 * 解包并把内含书籍文件逐一分发给兄弟 reader。核心实现，read()/readAll() 都基于它。
 * @param {Uint8Array} buf
 * @param {{filename?: string}} [opts]
 * @returns {Promise<Array<{name: string, book: object}>>}
 */
async function collectBooks(buf, opts = {}) {
  const zip = await loadZip(buf);
  const { candidates, unsupported, skipped, tooDeep } = await classify(zip, 0);

  candidates.sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));

  if (candidates.length === 0) {
    if (unsupported.length) {
      zipFail(`这个压缩包里的书籍格式暂不支持解析（${truncatedList(unsupported, 3)}），试试先转换成 txt / md / epub。`);
    }
    zipFail('这个压缩包里没有找到可识别的书籍文件（支持 .txt / .md / .epub）。');
  }

  const results = [];
  const consumedDisplayNames = new Set(); // 被 siblingAssets 用掉的条目，不该再算"跳过"
  for (let i = 0; i < candidates.length; i++) {
    if (i % 3 === 0) await zipTick();
    const c = candidates[i];
    try {
      const bytes = await c.entry.async('uint8array');
      const readerOpts = { filename: baseName(c.name) };
      if (c.ext === '.md') {
        const { map: siblingAssets, consumedRawNames } = await collectSiblingAssets(c.zipRef, c.entry.name);
        if (siblingAssets.size) {
          readerOpts.siblingAssets = siblingAssets;
          // c.name 相对 c.entry.name 的前缀，就是这层（可能嵌套一层）zip 的展示名前缀
          const prefix = c.name.slice(0, c.name.length - c.entry.name.length);
          for (const raw of consumedRawNames) consumedDisplayNames.add(prefix + raw);
        }
      }
      const book = await DISPATCH[c.ext](bytes, readerOpts);
      results.push({ name: c.name, book });
    } catch (e) {
      skipped.push(`${c.name}（解析失败：${e.message}）`);
    }
  }

  if (results.length === 0) {
    zipFail('这个压缩包里的书籍文件都无法正常解析。');
  }

  const trulySkipped = skipped.filter((s) => !consumedDisplayNames.has(s));

  // 容器级信息追加到每一本产出的书上（BOOK-IR.md §4 zip 行的 warning 义务）
  for (const r of results) {
    if (trulySkipped.length) warn(r.book, 'zip.skipped', `已跳过非书籍文件：${truncatedList(trulySkipped)}`);
    if (unsupported.length) warn(r.book, 'zip.unsupported', `压缩包内以下文件的格式暂不支持解析：${truncatedList(unsupported)}`);
    if (tooDeep.length) warn(r.book, 'zip.nested-too-deep', `压缩包嵌套超过一层，以下内容未展开：${truncatedList(tooDeep)}`);
  }

  return results;
}

/**
 * "逐本处理"的主入口：zip 内每个可识别的书籍文件各自独立解析成一本 Book。
 * @param {Uint8Array} buf
 * @param {{filename?: string}} [opts]
 * @returns {Promise<Array<{name: string, book: object}>>}
 */
async function readAll(buf, opts = {}) {
  return collectBooks(buf, opts);
}

/**
 * 单本契约：见文件头说明。zip 内多本书时返回排序后的第一本，并记 warning。
 * @param {Uint8Array} buf
 * @param {{filename?: string}} [opts]
 * @returns {Promise<object>} Book
 */
async function read(buf, opts = {}) {
  const results = await collectBooks(buf, opts);
  const [first, ...rest] = results;
  if (rest.length) {
    const names = rest.map((r) => r.name);
    warn(first.book, 'zip.multiple-books', `压缩包里有多本书，这里只处理了「${first.name}」，另外未处理：${truncatedList(names)}`);
  }
  return first.book;
}

return { readAll, read };
})();

/* ==== src/readers/mobi.js ==== */
SJ.readers.mobi = (function () {
'use strict';
/* ============================================================
 * src/readers/mobi.js · MOBI（KF7）→ Book IR
 *
 * 解析链：PalmDB 容器 → record0 的 PalmDOC/MOBI 头 → 文本记录解压
 *   （无压缩 type1、PalmDOC LZ77 type2）→ KF7 HTML 抽取 → 按
 *   <mbp:pagebreak> / 标题切章 → sanitizeHtml 落地为 IR。
 *
 * 明确不做（合法降级，见 docs/harness/BOUNDARIES.md §4）：
 *   - HUFF/CDIC 压缩（compression==17480）：抛人话错误，不解
 *   - 加密（PalmDOC EncryptionType != 0）：抛人话错误，不尝试绕过
 *   - 旧式 <a filepos="N"> 内部跳转：无法在不引入大量复杂度的前提下
 *     精确解析，降级为纯文本（sanitizeHtml 会自动丢弃非白名单的
 *     filepos 属性，只保留可见文字），并记 warning
 *
 * 零依赖：只用标准 DataView / TypedArray / TextDecoder，不引入任何库。
 * 环境中立：不碰 Buffer / Node 专有全局，浏览器与 Node 行为一致。
 * ============================================================ */

const { newBook, warn, sanitizeHtml, plainText, validate } = SJ.ir;

/* ---------- 环境中立的分块让步（大文件不卡主线程） ---------- */

function tick() {
  return new Promise((resolve) => {
    if (typeof setTimeout === 'function') setTimeout(resolve, 0);
    else resolve();
  });
}

/* ---------- 字节级工具 ---------- */

function asciiSlice(bytes, start, len) {
  let s = '';
  for (let i = 0; i < len && start + i < bytes.length; i++) {
    const b = bytes[start + i];
    if (b === 0) break;
    s += String.fromCharCode(b);
  }
  return s;
}

function stripExt(name) {
  return String(name).replace(/\.[^./\\]+$/, '');
}

/* ---------- PalmDOC (LZ77) 解压 ----------
 * 标准 PalmDOC 压缩字节含义（见 test/golden/README.md 与 skills 沉淀）：
 *   0x00       字面 0 字节
 *   0x01-0x08  接下来 N 个原始字节直接拷贝
 *   0x09-0x7f  单字节字面量（原样输出）
 *   0x80-0xbf  两字节的"距离/长度"回溯拷贝
 *   0xc0-0xff  展开为 [空格, 该字节异或 0x80]
 * ------------------------------------------ */
function decompressPalmDoc(bytes) {
  const out = [];
  let i = 0;
  const n = bytes.length;
  while (i < n) {
    const c = bytes[i++];
    if (c === 0) {
      out.push(0);
    } else if (c <= 8) {
      for (let j = 0; j < c && i < n; j++) out.push(bytes[i++]);
    } else if (c <= 0x7f) {
      out.push(c);
    } else if (c <= 0xbf) {
      if (i >= n) break;
      const c2 = bytes[i++];
      const combined = ((c & 0x3f) << 8) | c2;
      const distance = combined >> 3;
      const length = (combined & 0x7) + 3;
      const start = Math.max(0, out.length - distance);
      for (let k = 0; k < length; k++) out.push(out[start + k] ?? 0x20);
    } else {
      out.push(0x20, c ^ 0x80);
    }
  }
  return Uint8Array.from(out);
}

/* ---------- 记录尾部附加数据（extra flags）剥离 ----------
 * 部分 MOBI（header length >= 228 且 extraFlags != 0）会在每条文本记录
 * 末尾追加与正文无关的辅助数据（索引项 / 多字节字符截断标记），解压前
 * 必须先剥掉，否则会被压缩解码器误当成操作码，产出乱码。
 * 算法来自 MOBI 生态里广泛复用的 getSizeOfTrailingDataEntries。
 * 本 reader 自造的黄金样本 extraFlags 恒为 0，此路径未被样本覆盖，
 * 是文档化的已知限制（真实旧书若命中此字段，行为未经验证）。
 * ------------------------------------------------------------ */
function sizeOfBackwardVarint(buf, end) {
  let bitpos = 0;
  let result = 0;
  let pos = end;
  while (pos > 0) {
    pos -= 1;
    const v = buf[pos];
    result |= (v & 0x7f) << bitpos;
    bitpos += 7;
    if ((v & 0x80) !== 0 || bitpos >= 28) break;
  }
  return result;
}

function trailingEntriesSize(buf, size, flags) {
  let num = 0;
  let testFlags = flags >> 1;
  while (testFlags) {
    if (testFlags & 1) num += sizeOfBackwardVarint(buf, size - num);
    testFlags >>= 1;
  }
  if (flags & 1) num += (buf[size - num - 1] & 0x3) + 1;
  return num;
}

function stripTrailingEntries(record, extraFlags) {
  if (!extraFlags) return record;
  const size = record.length;
  const trim = trailingEntriesSize(record, size, extraFlags);
  if (trim <= 0 || trim >= size) return record; // 越界即放弃，保留原样，宁可不剥也不破坏正文
  return record.subarray(0, size - trim);
}

/* ---------- EXTH 元数据 ---------- */

function parseExth(record0, rdv, offset) {
  if (offset + 12 > record0.length || asciiSlice(record0, offset, 4) !== 'EXTH') return [];
  const count = rdv.getUint32(offset + 8);
  const decoder = new TextDecoder('utf-8', { fatal: false });
  const out = [];
  let p = offset + 12;
  for (let i = 0; i < count; i++) {
    if (p + 8 > record0.length) break;
    const type = rdv.getUint32(p);
    const len = rdv.getUint32(p + 4);
    if (len < 8 || p + len > record0.length) break;
    const dataBytes = record0.subarray(p + 8, p + len);
    out.push({ type, text: decoder.decode(dataBytes).trim(), bytes: dataBytes });
    p += len;
  }
  return out;
}

function firstExth(list, type) {
  const r = list.find((x) => x.type === type);
  return r && r.text ? r.text : null;
}
function allExth(list, type) {
  return list.filter((x) => x.type === type).map((x) => x.text).filter(Boolean);
}

function mapExthLanguage(tag) {
  if (!tag) return null;
  const t = tag.toLowerCase();
  if (t.startsWith('zh')) return /tw|hk|hant|mo/.test(t) ? 'zh-Hant' : 'zh-Hans';
  if (t.startsWith('ja')) return 'ja';
  if (t.startsWith('ko')) return 'ko';
  if (t.startsWith('en')) return 'en';
  if (t.startsWith('fr')) return 'fr';
  if (t.startsWith('de')) return 'de';
  if (t.startsWith('es')) return 'es';
  return tag;
}

/** 旧式 Mobipocket locale 字段：低字节≈主语言 id，是 EXTH 524 缺失时的兜底猜测 */
function mapLocaleLanguage(locale) {
  const low = locale & 0xff;
  if (low === 0x04) return 'zh-Hans';
  if (low === 0x09) return 'en';
  if (low === 0x11) return 'ja';
  if (low === 0x12) return 'ko';
  return null;
}

/* ---------- 章节切分辅助 ---------- */

/** 找出片段里第一个标题标签，抽出标题文本并从 html 里摘掉（不重复进正文，约定同 txt/docx） */
function extractTitleHeading(html) {
  const m = html.match(/<h([1-6])\b[^>]*>([\s\S]*?)<\/h\1>/i);
  if (!m) return { title: null, level: 1, html };
  const level = Math.min(3, Math.max(1, parseInt(m[1], 10)));
  const titleText = plainText(m[2]).replace(/\s+/g, ' ').trim();
  const newHtml = html.slice(0, m.index) + html.slice(m.index + m[0].length);
  return { title: titleText || null, level, html: newHtml };
}

/** 无 <mbp:pagebreak> 时的退路：按 h1-h3 起始位置切分（标题仍留在片段开头，交给 extractTitleHeading 摘取） */
function splitByHeadings(html) {
  const re = /<h[1-3]\b[^>]*>/gi;
  const idxs = [];
  let m;
  while ((m = re.exec(html))) idxs.push(m.index);
  if (idxs.length === 0) return [html];
  const segs = [];
  if (idxs[0] > 0) segs.push(html.slice(0, idxs[0]));
  for (let i = 0; i < idxs.length; i++) {
    const start = idxs[i];
    const end = i + 1 < idxs.length ? idxs[i + 1] : html.length;
    segs.push(html.slice(start, end));
  }
  return segs;
}

/* ---------- 图片记录 ---------- */

function detectImageMime(b) {
  if (b.length >= 3 && b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) return 'image/jpeg';
  if (b.length >= 8 && b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return 'image/png';
  if (b.length >= 3 && b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) return 'image/gif';
  if (b.length >= 2 && b[0] === 0x42 && b[1] === 0x4d) return 'image/bmp';
  return null;
}

/* ============================================================ */

async function read(buf, opts = {}) {
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  const BAD_FILE = () => new Error('这似乎不是有效的 MOBI 文件');

  if (bytes.length < 78) throw BAD_FILE();
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

  const pdbType = asciiSlice(bytes, 60, 4);
  const pdbCreator = asciiSlice(bytes, 64, 4);
  if (pdbType !== 'BOOK' || pdbCreator !== 'MOBI') throw BAD_FILE();

  const pdbName = asciiSlice(bytes, 0, 32).trim();
  const numRecords = dv.getUint16(76);
  if (numRecords < 1 || 78 + numRecords * 8 > bytes.length) throw BAD_FILE();

  const recordOffsets = [];
  for (let i = 0; i < numRecords; i++) recordOffsets.push(dv.getUint32(78 + i * 8));
  for (let i = 0; i < numRecords; i++) {
    if (recordOffsets[i] < 0 || recordOffsets[i] > bytes.length) throw BAD_FILE();
    if (i > 0 && recordOffsets[i] < recordOffsets[i - 1]) throw BAD_FILE();
  }

  const records = [];
  for (let i = 0; i < numRecords; i++) {
    const start = recordOffsets[i];
    const end = i + 1 < numRecords ? recordOffsets[i + 1] : bytes.length;
    records.push(bytes.subarray(start, Math.max(start, end)));
  }

  const record0 = records[0];
  if (record0.length < 16) throw BAD_FILE();
  const rdv = new DataView(record0.buffer, record0.byteOffset, record0.byteLength);

  const compression = rdv.getUint16(0);
  const textLength = rdv.getUint32(4);
  const textRecordCount = rdv.getUint16(8);
  const encryptionType = rdv.getUint16(12);

  // DRM：绝不尝试绕过，检测到即拒绝处理（BOUNDARIES §3）
  if (encryptionType !== 0) throw new Error('这本书带有版权保护，无法处理');

  if (record0.length < 20 || asciiSlice(record0, 16, 4) !== 'MOBI') throw BAD_FILE();
  const headerLength = rdv.getUint32(20);
  const textEncodingCode = rdv.getUint32(28);
  const fullNameOffset = rdv.getUint32(84);
  const fullNameLength = rdv.getUint32(88);
  const locale = rdv.getUint32(92);
  const firstImageIndex = rdv.getUint32(108);
  const exthFlags = rdv.getUint32(128);
  let extraFlags = 0;
  if (headerLength >= 228 && record0.length >= 244) extraFlags = rdv.getUint16(242);

  if (compression === 17480) {
    throw new Error('这本 MOBI 使用了旧式的 HUFF/CDIC 压缩，暂时无法解析');
  }
  if (compression !== 1 && compression !== 2) {

  }

  if (fullNameLength > 0 && fullNameOffset + fullNameLength <= record0.length) {
    fullName = decoder.decode(record0.subarray(fullNameOffset, fullNameOffset + fullNameLength)).trim();
  }

  const title = firstExth(exthRecords, 503) || fullName || pdbName ||
    (opts.filename ? stripExt(opts.filename) : null) || undefined;
  const author = allExth(exthRecords, 100).join('、') || null;
  const publisher = firstExth(exthRecords, 101);
  const description = firstExth(exthRecords, 103);
  const date = firstExth(exthRecords, 106);
  const isbn = firstExth(exthRecords, 104);
  const langTag = firstExth(exthRecords, 524);
  const language = mapExthLanguage(langTag) || mapLocaleLanguage(locale) || undefined;

  const book = newBook({
    title,
    author,
    language,
    identifier: isbn ? `urn:isbn:${isbn}` : undefined,
    publisher,
    date,
    description,
  });

  /* ---- 文本记录解压 + 拼接 ---- */
  const lastTextRec = Math.min(textRecordCount, records.length - 1);
  const chunks = [];
  let totalLen = 0;
  for (let i = 1; i <= lastTextRec; i++) {
    const trimmed = stripTrailingEntries(records[i], extraFlags);
    const dec = compression === 2 ? decompressPalmDoc(trimmed) : trimmed;
    chunks.push(dec);
    totalLen += dec.length;
    if (i % 40 === 0) await tick();
  }
  const fullBytes = new Uint8Array(totalLen);
  { let off = 0; for (const c of chunks) { fullBytes.set(c, off); off += c.length; } }
  const usable = textLength > 0 && textLength <= fullBytes.length ? fullBytes.subarray(0, textLength) : fullBytes;
  const rawHtml = decoder.decode(usable);

  /* ---- 图片记录解析（recindex 1-based，相对 firstImageIndex） ---- */
  const imgByRecNo = new Map();
  let imgCounter = 0;
  function resolveImageAtRecNo(recNo) {
    if (imgByRecNo.has(recNo)) return imgByRecNo.get(recNo);
    if (!Number.isFinite(recNo) || recNo < 0 || recNo >= records.length) return null;
    const raw = records[recNo];
    const mime = detectImageMime(raw);
    if (!mime) return null;
    imgCounter += 1;
    const ext = mime === 'image/png' ? 'png' : mime === 'image/gif' ? 'gif' : mime === 'image/bmp' ? 'bmp' : 'jpg';
    const id = `img${String(imgCounter).padStart(3, '0')}`;
    book.resources.set(id, { href: `images/${id}.${ext}`, mime, data: raw });
    imgByRecNo.set(recNo, id);
    return id;
  }
  function resolveImageResource(recindex) {
    if (firstImageIndex === undefined || firstImageIndex === 0xffffffff) return null;
    return resolveImageAtRecNo(firstImageIndex + recindex - 1);
  }

  // 封面（EXTH 201，最佳努力：约定为相对 firstImageIndex 的 0-based 偏移）
  const coverExth = exthRecords.find((x) => x.type === 201);
  if (coverExth && coverExth.bytes.length >= 4 && firstImageIndex !== 0xffffffff) {
    const cdv = new DataView(coverExth.bytes.buffer, coverExth.bytes.byteOffset, coverExth.bytes.byteLength);
    const coverOffset = cdv.getUint32(0);
    const coverId = resolveImageAtRecNo(firstImageIndex + coverOffset);
    if (coverId) book.cover = coverId;
  }

  /* ---- 切章：优先 <mbp:pagebreak>，退路按 h1-h3 ---- */
  let segments;
  if (/<mbp:pagebreak\b[^>]*\/?>/i.test(rawHtml)) {
    segments = rawHtml.split(/<mbp:pagebreak\b[^>]*\/?>/gi);
  } else {
    segments = splitByHeadings(rawHtml);
  }

  let hadFilepos = false;
  const chapters = [];
  let ci = 0;
  for (let si = 0; si < segments.length; si++) {
    let seg = segments[si];
    if (!seg) continue;
    if (/\bfilepos\s*=/i.test(seg)) hadFilepos = true;

    // <a name="x"> → id="x"（保留内部锚点，name 不在白名单属性内，需先转 id 才能存活过 sanitizeHtml）
    seg = seg.replace(/<a\b([^>]*)\bname\s*=\s*("([^"]*)"|'([^']*)')([^>]*)>/gi, (_m, pre, _q, dq, sq, post) => {
      const val = dq ?? sq ?? '';
      return `<a${pre} id="${val}"${post}>`;
    });

    // <img recindex="N" ...> → <img src="资源href" alt="...">
    seg = seg.replace(/<img\b[^>]*>/gi, (tag) => {
      const rm = tag.match(/\brecindex\s*=\s*"?0*([0-9]+)"?/i);
      if (!rm) return '';
      const resId = resolveImageResource(parseInt(rm[1], 10));
      if (!resId) return '';
      const altM = tag.match(/\balt\s*=\s*("([^"]*)"|'([^']*)')/i);
      const alt = altM ? (altM[2] ?? altM[3] ?? '') : '';
      const href = book.resources.get(resId).href;
      return `<img src="${href}"${alt ? ` alt="${alt}"` : ''}/>`;
    });

    const extracted = extractTitleHeading(seg);
    const cleanHtml = sanitizeHtml(extracted.html);
    const plain = cleanHtml.replace(/<[^>]*>/g, '').trim();

    if (extracted.title === null && !plain && !/<img\b/i.test(cleanHtml)) continue; // 纯空片段，不算一章

    ci += 1;
    chapters.push({ id: `c${ci}`, title: extracted.title, level: extracted.level, html: cleanHtml || '<p></p>' });
    if (ci % 30 === 0) await tick();
  }

  if (chapters.length === 0) {
    chapters.push({ id: 'c1', title: book.meta.title, level: 1, html: sanitizeHtml(rawHtml) || '<p></p>' });
    warn(book, 'mobi.no-chapters', '未能从正文中切分出章节');
  } else if (chapters.length === 1 && chapters[0].title === null) {
    chapters[0].title = book.meta.title;
    warn(book, 'mobi.no-chapters', '未找到分页符或标题标记，整本书作为单章处理');
  }

  book.chapters = chapters;
  book.nav = chapters
    .filter((c) => c.title != null)
    .map((c) => ({ title: c.title, target: c.id, anchor: null, level: c.level, children: [] }));
  if (chapters.length > 1 && book.nav.length === chapters.filter((c) => c.title != null).length) {
    // 没有从 EXTH/guide 恢复出真正的层级目录，按切章顺序生成平铺目录（合法降级，见 BOOK-IR §4）
    warn(book, 'mobi.flat-nav', '未能从书中恢复原始目录结构，已按章节顺序生成平铺目录');
  }
  if (hadFilepos) {
    warn(book, 'mobi.filepos-unresolved', '书中部分内部链接使用了旧式定位方式，无法精确解析，相关链接已降级为纯文本');
  }

  const check = validate(book);
  if (!check.ok) throw new Error('这本 MOBI 解析后结构异常，可能不是一本完整的书');

  return book;
}

return { read };
})();
