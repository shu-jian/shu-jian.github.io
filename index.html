<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书简</title>
<meta name="description" content="">
<style>
:root{
  --indigo:#16233B;          /* 磁青书衣 */
  --indigo-deep:#101A2C;
  --paper:#F7F2E6;           /* 内页纸色 */
  --paper-soft:#FCF8EE;
  --paper-edge:#E7DEC9;
  --ink:#23241F;
  --ink-soft:#6B675B;
  --seal:#AF3A2A;            /* 朱砂印色 */
  --seal-deep:#8F2C20;
  --hairline:rgba(35,36,31,.22);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, var(--indigo) 0%, var(--indigo-deep) 100%);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.7;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 20px 48px;
}
a{color:inherit}

/* ── 顶栏 ─────────────────────────── */
.topbar{
  width:100%;max-width:860px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:26px 4px 34px;color:var(--paper);
}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.sealpair{display:flex;align-items:center;gap:7px;font-family:var(--serif)}
.sealpair .stamp{
  width:34px;height:34px;display:grid;place-items:center;
  font-size:19px;font-weight:700;line-height:1;border-radius:3px;
}
.stamp.fan{background:var(--seal);color:#FBF3E4;box-shadow:inset 0 0 0 1.5px rgba(251,243,228,.55)}
.stamp.jian{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1.5px rgba(247,242,230,.75)}
.sealpair .arrow{color:rgba(247,242,230,.55);font-size:13px}
.wordmark{font-family:var(--serif);font-size:21px;letter-spacing:.14em;font-weight:600}
.topnote{font-size:12.5px;letter-spacing:.06em;color:rgba(247,242,230,.62);text-align:right}

/* ── 纸页面板 ─────────────────────── */
.sheet-wrap{position:relative;width:100%;max-width:760px;margin-top:60px}
.slip{
  position:absolute;left:-64px;top:34px;width:46px;
  writing-mode:vertical-rl;
  background:var(--paper);
  border:1px solid rgba(35,36,31,.4);
  border-top:4px solid var(--seal);
  padding:20px 0 16px;
  font-family:var(--serif);font-size:14.5px;letter-spacing:.42em;color:var(--ink);
  text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.slip small{display:block;font-size:10.5px;letter-spacing:.34em;color:var(--ink-soft);margin-top:10px}
.sheet{
  position:relative;
  background:var(--paper);
  border-radius:4px;
  padding:44px 48px 40px;
  box-shadow:0 2px 0 var(--paper-edge), 0 5px 0 rgba(231,222,201,.55), 0 24px 60px rgba(0,0,0,.45);
  animation:rise .45s ease-out both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

/* 首屏第一句：一句诗，大字细体（Mac 上 Songti SC Light；细体重点在 font-weight） */
h1.poem{
  font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",var(--serif);
  font-weight:300;
  font-size:clamp(27px,4.9vw,45px);
  letter-spacing:.12em;
  line-height:1.75;
  color:var(--ink);
}
.lede{margin-top:20px;color:var(--ink-soft);font-size:14.5px;line-height:1.85;max-width:58ch}
.lede b{color:var(--ink);font-weight:600}

/* ── 转换方案 / 输出格式 / 日语标音 ─────────────────────── */
.controls{margin-top:26px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.scheme{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.scheme label{font-family:var(--serif);font-weight:600;letter-spacing:.08em;font-size:14.5px}
.scheme select{
  font-family:var(--sans);font-size:14px;color:var(--ink);
  background:var(--paper-soft);
  border:1px solid var(--hairline);border-radius:3px;
  padding:8px 34px 8px 12px;line-height:1.4;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%236B675B' stroke-width='1.5'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;
  cursor:pointer;max-width:100%;
}
.scheme select:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

/* 输出格式的即时提示（integration_ui_04：COPY.outputFormatNotice）。
 * 空字符串时（非 mobi/pdf）靠 :empty 折叠掉占位，不留一条空白线。 */
.output-notice{margin-top:10px;font-size:12.5px;color:var(--ink-soft)}
.output-notice:empty{display:none}

/* ── 功能选项（繁简转换 / 日文标音，横排二选一） ─── */
.modes{
  margin-top:24px;display:flex;gap:8px;flex-wrap:wrap;
  border-bottom:1px solid var(--hairline);
}
.mode{
  flex:1 1 180px;min-width:150px;
  display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
  background:none;border:none;cursor:pointer;
  padding:12px 14px 14px;margin-bottom:-1px;
  border-bottom:2.5px solid transparent;color:var(--ink-soft);
  transition:color .15s, border-color .15s;
}
.mode:hover{color:var(--ink)}
.mode[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--seal)}
.mode:focus-visible{outline:2px solid var(--seal);outline-offset:2px;border-radius:3px}
.mode .mode-name{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.08em}
.mode .mode-desc{font-size:12.5px;color:var(--ink-soft)}

/* 按当前功能显示/隐藏对应选项字段（#sheet[data-active-mode] 由 app.js 切换） */
.controls [data-mode]{display:none}
#sheet[data-active-mode="ts"] .controls [data-mode="ts"]{display:flex}
#sheet[data-active-mode="furigana"] .controls [data-mode="furigana"]{display:flex}
/* 繁简的「转换方向」+「地区用词」并排成一组，一起换行、不被拆散 */
.scheme-pair{gap:22px;flex-wrap:wrap;align-items:center}

/* ── 拖放区 ──────────────────────── */
.drop{
  margin-top:18px;display:block;cursor:pointer;
  border:1.5px dashed rgba(35,36,31,.42);border-radius:4px;
  padding:44px 24px;text-align:center;
  transition:border-color .15s, background-color .15s;
}
.drop:hover,.drop.drag{border-color:var(--seal);background:rgba(175,58,42,.045)}
.drop:focus-within{outline:2px solid var(--seal);outline-offset:3px}
.drop.disabled{opacity:.45;cursor:wait;pointer-events:none}
.drop .main{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.04em}
.drop .sub{margin-top:8px;font-size:13px;color:var(--ink-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}

.engine{margin-top:12px;font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;min-height:20px}
.engine .dot{width:7px;height:7px;border-radius:50%;background:#B99A3F;flex:none}
.engine.ready .dot{background:#4A7A46}
.engine.error .dot{background:var(--seal)}
.engine button{
  font-family:var(--sans);font-size:12.5px;color:var(--seal);background:none;border:none;
  text-decoration:underline;cursor:pointer;padding:0;
}

/* ── 待转换列表 + 开始按钮 ──────────── */
.pending{margin-top:20px}
.pending-head{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;letter-spacing:.04em}
.pending-list{display:flex;flex-direction:column;gap:8px}
.chip{
  display:flex;align-items:center;gap:12px;
  background:var(--paper-soft);border:1px solid rgba(35,36,31,.16);border-radius:3px;
  padding:9px 12px;
}
.chip .cname{font-family:var(--serif);font-size:14px;word-break:break-all}
.chip .csize{font-family:var(--mono);font-size:11px;color:var(--ink-soft);flex:none;margin-left:auto}
.chip .cx{
  flex:none;background:none;border:none;cursor:pointer;color:var(--ink-soft);
  font-size:17px;line-height:1;padding:2px 7px;border-radius:3px;
}
.chip .cx:hover{color:var(--seal);background:rgba(175,58,42,.08)}
.chip .cx:focus-visible{outline:2px solid var(--seal);outline-offset:1px}

.actions{margin-top:22px}
.start{
  font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.12em;
  background:var(--seal);color:#FBF3E4;border:none;border-radius:4px;
  padding:13px 32px;cursor:pointer;transition:background .15s;
}
.start:hover{background:var(--seal-deep)}
.start:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.start:disabled{background:rgba(35,36,31,.2);color:rgba(247,242,230,.8);cursor:not-allowed}

/* ── 文件列表 ─────────────────────── */
.files{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.card{
  background:var(--paper-soft);
  border:1px solid rgba(35,36,31,.16);border-radius:3px;
  padding:14px 16px 12px;
}
.card .row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}
.card .name{font-family:var(--serif);font-weight:600;font-size:15px;word-break:break-all}
.card .size{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);flex:none}
.bar{margin-top:10px;height:2px;background:rgba(35,36,31,.12);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--seal);transition:width .2s}
.card .status{margin-top:8px;font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card.err .status{color:var(--seal-deep)}
.card.err .bar i{background:rgba(175,58,42,.35);width:100%}
.dl{
  font-family:var(--sans);font-size:13px;letter-spacing:.05em;
  background:var(--seal);color:#FBF3E4;border:none;border-radius:3px;
  padding:7px 16px;cursor:pointer;text-decoration:none;display:inline-block;
}
.dl:hover{background:var(--seal-deep)}
.dl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ── 页脚 ────────────────────────── */
.foot{
  width:100%;max-width:760px;margin-top:30px;
  color:rgba(247,242,230,.55);font-size:12.5px;letter-spacing:.04em;
  text-align:center;line-height:2;
}
.foot a{color:rgba(247,242,230,.78);text-underline-offset:3px}

@media (max-width:880px){
  .sheet{padding:32px 24px 30px}
  .sheet-wrap{margin-top:34px}
}
</style>
</head>
<body>

<main class="sheet-wrap">
  <div class="sheet" id="sheet" data-active-mode="ts">
    <h1 id="heroTitle" class="poem"></h1>

    <div class="modes" role="tablist" aria-label="转换功能">
      <button type="button" class="mode" id="modeTs" role="tab" aria-selected="true">
        <span class="mode-name" id="modeTsName"></span>
      </button>
      <button type="button" class="mode" id="modeFuri" role="tab" aria-selected="false">
        <span class="mode-name" id="modeFuriName"></span>
      </button>
    </div>

    <p class="lede" id="heroLede"></p>

    <div class="controls">
      <div class="scheme-pair" data-mode="ts">
        <div class="scheme">
          <label for="tsDirection" id="directionLabel"></label>
          <select id="tsDirection"></select>
        </div>
        <div class="scheme">
          <label for="tsRegion" id="regionLabel"></label>
          <select id="tsRegion"></select>
        </div>
      </div>
      <div class="scheme" data-mode="furigana">
        <label for="annot" id="annotLabel"></label>
        <select id="annot"></select>
      </div>
      <div class="scheme">
        <label for="outputFormat" id="outputLabel"></label>
        <select id="outputFormat"></select>
      </div>
      <div class="scheme">
        <label for="writingDir" id="writingDirLabel"></label>
        <select id="writingDir"></select>
      </div>
    </div>
    <p class="output-notice" id="modeNotice"></p>
    <p class="output-notice" id="outputNotice"></p>

    <label class="drop" id="drop">
      <input type="file" id="picker" accept=".txt,.md,.zip,.epub,.docx,.pdf,.mobi,.azw3,.azw" multiple>
      <div class="main" id="dropMain"></div>
      <div class="sub" id="dropSub"></div>
    </label>

    <div class="engine" id="engine"><span class="dot"></span><span id="engineText"></span></div>

    <div class="pending" id="pending" hidden>
      <div class="pending-head" id="pendingHead"></div>
      <div class="pending-list" id="pendingList"></div>
    </div>

    <div class="actions">
      <button type="button" class="start" id="startBtn" disabled></button>
    </div>

    <div class="files" id="files" aria-live="polite"></div>
  </div>
</main>

<footer class="foot">
  <span id="footerLine"></span>
</footer>

<script type="module">
globalThis.SJ = globalThis.SJ || {};
SJ.readers = SJ.readers || {};
SJ.transforms = SJ.transforms || {};
SJ.ui = SJ.ui || {};
SJ.writers = SJ.writers || {};

/* ==== src/ir.js ==== */
SJ.ir = (function () {
'use strict';
/* ============================================================
 * Book IR · 中间格式契约（全系统枢纽）
 *
 * 契约文档：docs/harness/BOOK-IR.md —— 本文件是它的可执行落地。
 * 冻结原则：schema 一旦定稿，任何改动必须经人类确认（H1）。
 *   reader 只产出 IR，writer 只消费 IR，两者不得互相引用。
 *
 * 环境中立：本模块只用标准 JS，不碰任何 DOM / Node 专有全局，
 *   因此在浏览器（被 build.mjs 内联）与 Node（跑测试）里行为一致。
 *   HTML 的解析与清洗走本文件自带的 tokenizer，不依赖 DOMParser。
 * ============================================================ */

/**
 * @typedef {string} ResourceId  全书唯一的资源键
 * @typedef {string} ChapterId   全书唯一的章节键
 * @typedef {string} NoteId      全书唯一的注释键
 */

/**
 * @typedef {Object} Meta
 * @property {string}      title        必填。缺失时用文件名
 * @property {string|null} author
 * @property {string}      language     BCP 47，如 "zh-Hans" "zh-Hant" "ja"
 * @property {string}      identifier   缺失时生成 UUID
 * @property {string|null} publisher
 * @property {string|null} date         ISO 8601
 * @property {string|null} description
 * @property {'horizontal-tb'|'vertical-rl'} writingMode  阅读方向（H1 决议加入）
 */

/**
 * @typedef {Object} Resource
 * @property {string}     href  IR 内部路径，如 "images/001.jpg"
 * @property {string}     mime
 * @property {Uint8Array} data
 */

/**
 * @typedef {Object} Chapter
 * @property {ChapterId}   id
 * @property {string|null} title  null = 无标题章节（扉页、插图页）
 * @property {1|2|3}       level  目录层级
 * @property {string}      html   受限 HTML 子集，见 BOOK-IR §3
 */

/**
 * @typedef {Object} Nav
 * @property {string}      title
 * @property {ChapterId}   target
 * @property {string|null} anchor    章节内锚点 id
 * @property {number}      level
 * @property {Nav[]}       children
 */

/**
 * @typedef {Object} Warning
 * @property {string} code    "pdf.no-structure" | "epub.encrypted" | ...
 * @property {string} detail
 */

/**
 * @typedef {Object} Book
 * @property {Meta}                      meta
 * @property {ResourceId|null}           cover
 * @property {Map<ResourceId,Resource>}  resources
 * @property {Chapter[]}                 chapters   线性阅读顺序，"书"的本体
 * @property {Nav[]}                     nav        目录树
 * @property {Map<NoteId,{html:string}>} notes
 * @property {Warning[]}                 warnings
 */

/* ---------- 受限 HTML 白名单（BOOK-IR §3，冻结） ---------- */

const WHITELIST_TAGS = new Set([
  'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
  'p', 'div', 'span',
  'em', 'strong', 'i', 'b', 'u', 's',
  'ruby', 'rt', 'rp',
  'img', 'figure', 'figcaption',
  'blockquote', 'pre', 'code',
  'ul', 'ol', 'li', 'dl', 'dt', 'dd',
  'table', 'thead', 'tbody', 'tr', 'th', 'td',
  'a', 'br', 'hr', 'sup', 'sub',
]);

/** 这些标签连同内部文本一并删除（脚本/样式/外链资源） */
const DROP_WITH_CONTENT = new Set([
  'script', 'style', 'link', 'meta', 'iframe', 'object', 'embed',
  'head', 'title',
]);

/** 空元素（无闭合标签） */
const VOID_TAGS = new Set(['img', 'br', 'hr']);

/** 全局允许属性 */
const GLOBAL_ATTRS = new Set(['id', 'class', 'lang', 'dir']);

/** 按标签允许的额外属性 */
const TAG_ATTRS = {
  a: new Set(['href']),
  img: new Set(['src', 'alt', 'width', 'height']),
  td: new Set(['colspan', 'rowspan']),
  th: new Set(['colspan', 'rowspan']),
};

function attrAllowed(tag, name) {
  if (name.startsWith('on')) return false;          // 事件处理器一律剥离
  if (name === 'style') return false;               // 内联样式一律剥离
  if (GLOBAL_ATTRS.has(name)) return true;
  const extra = TAG_ATTRS[tag];
  return extra ? extra.has(name) : false;
}

/* ---------- ID / 工具 ---------- */

/** 环境中立的 UUID（Node ≥ 15 与现代浏览器都有 crypto.randomUUID） */
function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  // 极端回退：非加密强度，仅用于生成占位 identifier
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
  });
}

/** 建一本空书，填好必填默认值 */
function newBook(meta = {}) {
  return {
    meta: {
      title: meta.title || '未命名',
      author: meta.author ?? null,
      language: meta.language || 'zh-Hans',
      identifier: meta.identifier || `urn:uuid:${uuid()}`,
      publisher: meta.publisher ?? null,
      date: meta.date ?? null,
      description: meta.description ?? null,
      // 阅读方向：横排（默认）/ 竖排（CJK 直书）。写作方向是 spine 级属性，非纯视觉，
      // 故进 IR（H1 决议）。epub/kepub writer 据此设 page-progression-direction；txt/pdf 忽略。
      writingMode: meta.writingMode === 'vertical-rl' ? 'vertical-rl' : 'horizontal-tb',
    },
    cover: null,
    resources: new Map(),
    chapters: [],
    nav: [],
    notes: new Map(),
    warnings: [],
  };
}

/** 追加一条 warning（去重：同 code+detail 只留一条） */
function warn(book, code, detail = '') {
  if (!book.warnings.some((w) => w.code === code && w.detail === detail)) {
    book.warnings.push({ code, detail });
  }
}

/** 深度遍历 nav 树 */
function walkNav(nav, fn) {
  for (const n of nav || []) {
    fn(n);
    if (n.children && n.children.length) walkNav(n.children, fn);
  }
}

/* ---------- HTML tokenizer（sanitize / plainText 共用） ---------- */

const NAMED_ENTITIES = {
  amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ',
};

function decodeEntities(s) {
  return s.replace(/&(#x?[0-9a-fA-F]+|[a-zA-Z]+);/g, (m, body) => {
    if (body[0] === '#') {
      const code = body[1] === 'x' || body[1] === 'X'
        ? parseInt(body.slice(2), 16)
        : parseInt(body.slice(1), 10);
      return Number.isFinite(code) ? String.fromCodePoint(code) : m;
    }
    return NAMED_ENTITIES[body.toLowerCase()] ?? m;
  });
}

function escapeText(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeAttr(s) {
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

/**
 * 把 HTML 串切成 token 流。
 * 每个 token 形如 {type:'text',value} | {type:'open',tag,attrs,selfClose}
 *   | {type:'close',tag}。注释 / doctype / PI 直接吞掉。
 * @returns {Array}
 */
function tokenize(html) {
  const tokens = [];
  let i = 0;
  const n = html.length;
  while (i < n) {
    const lt = html.indexOf('<', i);
    if (lt === -1) { tokens.push({ type: 'text', value: html.slice(i) }); break; }
    if (lt > i) tokens.push({ type: 'text', value: html.slice(i, lt) });

    // 注释 / CDATA / doctype / 声明
    if (html.startsWith('<!--', lt)) {
      const end = html.indexOf('-->', lt + 4);
      i = end === -1 ? n : end + 3;
      continue;
    }
    if (html[lt + 1] === '!' || html[lt + 1] === '?') {
      const end = html.indexOf('>', lt + 1);
      i = end === -1 ? n : end + 1;
      continue;
    }

    const gt = html.indexOf('>', lt);
    if (gt === -1) { tokens.push({ type: 'text', value: html.slice(lt) }); break; }

    let raw = html.slice(lt + 1, gt).trim();
    i = gt + 1;
    if (!raw) { tokens.push({ type: 'text', value: '<>' }); continue; }

    if (raw[0] === '/') {
      const tag = raw.slice(1).trim().toLowerCase();
      tokens.push({ type: 'close', tag });
      continue;
    }

    let selfClose = false;
    if (raw.endsWith('/')) { selfClose = true; raw = raw.slice(0, -1).trim(); }

    const mName = raw.match(/^([a-zA-Z][a-zA-Z0-9:-]*)/);
    if (!mName) { tokens.push({ type: 'text', value: `<${raw}>` }); continue; }
    const tag = mName[1].toLowerCase();
    const attrs = parseAttrs(raw.slice(mName[1].length));
    tokens.push({ type: 'open', tag, attrs, selfClose });
  }
  return tokens;
}

function parseAttrs(s) {
  const attrs = [];
  const re = /([a-zA-Z_:][a-zA-Z0-9_:.-]*)(?:\s*=\s*("([^"]*)"|'([^']*)'|([^\s"'=<>`]+)))?/g;
  let m;
  while ((m = re.exec(s))) {
    if (!m[1]) break;
    const name = m[1].toLowerCase();
    const value = m[3] ?? m[4] ?? m[5] ?? '';
    attrs.push([name, value]);
  }
  return attrs;
}

/**
 * 把 HTML 清洗为受限白名单子集（BOOK-IR §3）。
 *  - 非白名单标签：剥掉标签本身，保留其文本内容
 *  - DROP_WITH_CONTENT 标签：连内容一起删除
 *  - 非白名单属性 / style / on*：剥离
 * 纯函数，环境中立。
 */
function sanitizeHtml(html) {
  if (!html) return '';
  const tokens = tokenize(String(html));
  const out = [];
  let dropDepth = 0;        // 处于 DROP_WITH_CONTENT 元素内部的嵌套深度
  let dropTag = null;
  for (const t of tokens) {
    if (dropDepth > 0) {
      if (t.type === 'open' && !t.selfClose && t.tag === dropTag) dropDepth++;
      else if (t.type === 'close' && t.tag === dropTag) dropDepth--;
      continue;
    }
    if (t.type === 'text') { out.push(escapeText(decodeEntities(t.value))); continue; }
    if (t.type === 'open') {
      if (DROP_WITH_CONTENT.has(t.tag)) {
        if (!t.selfClose && !VOID_TAGS.has(t.tag)) { dropDepth = 1; dropTag = t.tag; }
        continue;
      }
      if (!WHITELIST_TAGS.has(t.tag)) continue;      // 剥标签、留内容
      const kept = t.attrs.filter(([name]) => attrAllowed(t.tag, name));
      const attrStr = kept.map(([k, v]) => ` ${k}="${escapeAttr(decodeEntities(v))}"`).join('');
      const isVoid = VOID_TAGS.has(t.tag);
      out.push(`<${t.tag}${attrStr}${isVoid ? ' /' : ''}>`);
      continue;
    }
    if (t.type === 'close') {
      if (DROP_WITH_CONTENT.has(t.tag)) continue;
      if (!WHITELIST_TAGS.has(t.tag)) continue;
      if (VOID_TAGS.has(t.tag)) continue;
      out.push(`</${t.tag}>`);
    }
  }
  return out.join('');
}

/** 抽出纯文本（去标签、解实体、折叠空白）。供 txt writer 与字数统计使用 */
function plainText(html) {
  if (!html) return '';
  const tokens = tokenize(String(html));
  const parts = [];
  let dropDepth = 0, dropTag = null;
  for (const t of tokens) {
    if (dropDepth > 0) {
      if (t.type === 'open' && !t.selfClose && t.tag === dropTag) dropDepth++;
      else if (t.type === 'close' && t.tag === dropTag) dropDepth--;
      continue;
    }
    if (t.type === 'text') { parts.push(decodeEntities(t.value)); continue; }
    if (t.type === 'open') {
      if (DROP_WITH_CONTENT.has(t.tag)) {
        if (!t.selfClose && !VOID_TAGS.has(t.tag)) { dropDepth = 1; dropTag = t.tag; }
        continue;
      }
      if (t.tag === 'br') parts.push('\n');
    }
    if (t.type === 'close' && /^(p|div|li|h[1-6]|blockquote|tr|figcaption|dd|dt)$/.test(t.tag)) {
      parts.push('\n');
    }
  }
  return parts.join('').replace(/[ \t ]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
}

/** 全书正文字数（非空白字符数）。G3 的 ±0.5% 容差基准 */
function countChars(book) {
  let total = 0;
  for (const ch of book.chapters) {
    total += plainText(ch.html).replace(/\s+/g, '').length;
  }
  return total;
}

/* ---------- 校验器（BOOK-IR §7） ---------- */

/** 扫描 html 中出现的所有标签名 */
function tagsIn(html) {
  const found = new Set();
  for (const t of tokenize(String(html || ''))) {
    if (t.type === 'open' || t.type === 'close') found.add(t.tag);
  }
  return found;
}

/**
 * 校验一本 IR 是否合法。
 * @param {Book} book
 * @returns {{ok: boolean, errors: string[]}}
 */
function validate(book) {
  const errors = [];
  const E = (m) => errors.push(m);

  if (!book || typeof book !== 'object') return { ok: false, errors: ['book 不是对象'] };

  // meta
  const meta = book.meta;
  if (!meta || typeof meta !== 'object') E('meta 缺失');
  else {
    if (!meta.title || typeof meta.title !== 'string') E('meta.title 必填且为非空字符串');
    if (!meta.language || typeof meta.language !== 'string') E('meta.language 必填');
    if (!meta.identifier || typeof meta.identifier !== 'string') E('meta.identifier 必填');
    if (meta.writingMode && !['horizontal-tb', 'vertical-rl'].includes(meta.writingMode))
      E(`meta.writingMode 取值非法: ${meta.writingMode}`);
  }

  // resources
  if (!(book.resources instanceof Map)) E('resources 必须是 Map');
  const hrefs = new Set();
  if (book.resources instanceof Map) {
    for (const [rid, res] of book.resources) {
      if (!res || typeof res.href !== 'string') { E(`resource[${rid}] 缺 href`); continue; }
      if (typeof res.mime !== 'string') E(`resource[${rid}] 缺 mime`);
      if (!(res.data instanceof Uint8Array)) E(`resource[${rid}].data 必须是 Uint8Array`);
      hrefs.add(res.href);
    }
  }

  // cover
  if (book.cover != null && !(book.resources instanceof Map && book.resources.has(book.cover))) {
    E(`cover 指向不存在的资源: ${book.cover}`);
  }

  // notes
  if (!(book.notes instanceof Map)) E('notes 必须是 Map');
  const noteIds = book.notes instanceof Map ? new Set(book.notes.keys()) : new Set();

  // chapters
  if (!Array.isArray(book.chapters)) E('chapters 必须是数组');
  const chapterIds = new Set();
  if (Array.isArray(book.chapters)) {
    if (book.chapters.length === 0) E('chapters 为空——一本书至少要有一章');
    for (const ch of book.chapters) {
      if (!ch || typeof ch.id !== 'string') { E('章节缺 id'); continue; }
      if (chapterIds.has(ch.id)) E(`章节 id 重复: ${ch.id}`);
      chapterIds.add(ch.id);
      if (![1, 2, 3].includes(ch.level)) E(`章节 ${ch.id} 的 level 必须是 1/2/3`);
      if (typeof ch.html !== 'string') { E(`章节 ${ch.id} 的 html 必须是字符串`); continue; }

      // 黑名单标签 / 非白名单标签
      for (const tag of tagsIn(ch.html)) {
        if (DROP_WITH_CONTENT.has(tag)) E(`章节 ${ch.id} 含黑名单标签 <${tag}>`);
        else if (!WHITELIST_TAGS.has(tag)) E(`章节 ${ch.id} 含非白名单标签 <${tag}>（须先 sanitizeHtml）`);
      }

      // img[src] 必须解析到 resources，且不得外链 / data URI
      for (const m of ch.html.matchAll(/<img\b[^>]*\bsrc\s*=\s*("([^"]*)"|'([^']*)')/gi)) {
        const src = m[2] ?? m[3] ?? '';
        if (/^(https?:)?\/\//i.test(src) || /^data:/i.test(src)) {
          E(`章节 ${ch.id} 的 img src 是外链/data URI: ${src}`);
        } else if (!hrefs.has(src)) {
          E(`章节 ${ch.id} 的 img src 未在 resources 中: ${src}`);
        }
      }

      // noteref 必须指向存在的 NoteId
      for (const m of ch.html.matchAll(/<a\b[^>]*class\s*=\s*("[^"]*\bnoteref\b[^"]*"|'[^']*\bnoteref\b[^']*')[^>]*href\s*=\s*("#([^"]*)"|'#([^']*)')/gi)) {
        const nid = m[3] ?? m[4] ?? '';
        if (!noteIds.has(nid)) E(`章节 ${ch.id} 的 noteref 指向不存在的注释: ${nid}`);
      }
    }
  }

  // nav.target 必须指向存在的章节
  const checkNav = (list, depth) => {
    if (!Array.isArray(list)) return;
    for (const nv of list) {
      if (!nv || typeof nv !== 'object') { E('nav 条目不是对象'); continue; }
      if (!chapterIds.has(nv.target)) E(`nav "${nv.title}" 指向不存在的章节: ${nv.target}`);
      if (nv.children) checkNav(nv.children, depth + 1);
    }
  };
  checkNav(book.nav, 0);

  if (!Array.isArray(book.warnings)) E('warnings 必须是数组');

  return { ok: errors.length === 0, errors };
}

return { WHITELIST_TAGS, DROP_WITH_CONTENT, VOID_TAGS, uuid, newBook, warn, walkNav, sanitizeHtml, plainText, countChars, validate };
})();

/* ==== src/transforms/opencc.js ==== */
SJ.transforms.opencc = (function () {
'use strict';
/* ============================================================
 * src/transforms/opencc.js · 繁简转换（Book IR → Book IR）
 *
 * 契约：docs/harness/BOOK-IR.md §6（transforms 通用契约）。
 *   1. 结构不变：chapters.length / 每章 level / nav 树形状 / resources 键集合，
 *      进出完全一致——本文件只改文本内容，不碰形状。
 *   2. 可交换：不转换 <rt> 内的文本（假名注音），为的是与 furigana transform
 *      的执行顺序无关（先繁简后注音、先注音后繁简，结果一致）。
 *   3. 幂等对本 transform 不适用（反复转换同一方案是安全的无害操作，
 *      OpenCC 的字典本身是幂等的：cn 字已经是 cn，再转一次还是 cn）。
 *   4. 纯函数：不修改入参 book，返回新对象。
 *
 * 词级转换完全交给 opencc-js（globalThis.OpenCC，由 vendor / CDN 注入）。
 * 本文件不自建任何字符映射表（CLAUDE.md §7：繁简转换是词级的，不是字级的）。
 *
 * 环境中立：不碰 DOM。HTML 文本节点的定位靠简单的“标签 vs 文本”交替切分，
 *   而不是完整 tokenizer——这依赖一个前提：chapter.html / note.html 在进入
 *   IR 时已经过 sanitizeHtml（BOOK-IR §3 白名单子集），标签结构是规整的
 *   （不会有未闭合标签、注释、CDATA 等花活）。这个前提由 reader 保证。
 * ============================================================ */

/**
 * 六种繁简转换方案，命名与现有 index.html 的 <select> 对齐
 * （from/to 是 opencc-js 自己的地区代码：t/cn/hk/tw/twp）。
 * 「不转换」不在这张表里——它是恒等变换，用 scheme=null/'none' 表达。
 */
const SCHEMES = Object.freeze({
  t2cn: Object.freeze({ from: 't', to: 'cn' }), // 繁体 → 简体（通用）
  tw2cn: Object.freeze({ from: 'tw', to: 'cn' }), // 台湾正体 → 简体（仅字形）
  twp2cn: Object.freeze({ from: 'twp', to: 'cn' }), // 台湾正体 → 简体（含用词转换，如 滑鼠→鼠标）
  hk2cn: Object.freeze({ from: 'hk', to: 'cn' }), // 香港繁体 → 简体
  cn2t: Object.freeze({ from: 'cn', to: 't' }), // 简体 → 繁体（通用）
  cn2tw: Object.freeze({ from: 'cn', to: 'tw' }), // 简体 → 台湾正体（仅字形）
  cn2twp: Object.freeze({ from: 'cn', to: 'twp' }), // 简体 → 台湾正体（含用词转换，如 鼠标→滑鼠）
  cn2hk: Object.freeze({ from: 'cn', to: 'hk' }), // 简体 → 香港繁体
});

/** 合法的 scheme 取值（含 'none'），供调用方/UI 校验用户输入。 */
const SCHEME_KEYS = Object.freeze(['none', ...Object.keys(SCHEMES)]);

const tick = () => new Promise((resolve) => setTimeout(resolve, 0));

/* Converter 按 from|to 缓存：opencc-js 构建 Trie 有成本（词库以 MB 计），
 * 同一 scheme 在一次批量转换（多本书）里应当只建一次。 */
const converterCache = new Map();

function getConverter(from, to) {
  const key = `${from}|${to}`;
  const cached = converterCache.get(key);
  if (cached) return cached;
  const OC = globalThis.OpenCC;
  if (!OC || typeof OC.Converter !== 'function') {
    throw new Error('OpenCC 转换引擎未就绪：globalThis.OpenCC 不存在（vendor 未注入）');
  }
  const convert = OC.Converter({ from, to });
  converterCache.set(key, convert);
  return convert;
}

/* ---------- HTML 感知的文本转换 ---------- */

// 交替切分：捕获组保留分隔符本身，结果形如 [text, tag, text, tag, ..., text]
const TAG_SPLIT_RE = /(<[^>]*>)/g;
const TAG_NAME_RE = /^<\/?\s*([a-zA-Z][a-zA-Z0-9]*)/;

/**
 * 转换一段受限 HTML 子集里的文本节点，标签（名字、属性）原样保留。
 * <rt>…</rt> 内部（假名注音）跳过，不转换——这是与 furigana 保持可交换的关键。
 * 不做实体解码/转义：sanitizeHtml 只把 & < > 转义为实体，真实的中日文字符
 * 始终是字面 Unicode 字符，OpenCC 的字典只匹配 CJK 字符序列，不会误碰
 * "&amp;" 这类 ASCII 实体串，所以直接对已转义文本调用 convert() 是安全的，
 * 也天然满足"不破坏实体"的要求（无需额外解码/重新转义这一步）。
 */
function convertHtmlText(html, convert) {
  if (!html) return html;
  const parts = html.split(TAG_SPLIT_RE);
  let rtDepth = 0;
  for (let i = 0; i < parts.length; i++) {
    const part = parts[i];
    if (!part) continue;
    if (part.charCodeAt(0) === 60 /* '<' */) {
      const m = TAG_NAME_RE.exec(part);
      const tag = m ? m[1].toLowerCase() : '';
      if (tag === 'rt') {
        if (part[1] === '/') rtDepth = Math.max(0, rtDepth - 1);
        else rtDepth += 1;
      }
      continue;
    }
    if (rtDepth > 0) continue;
    parts[i] = convert(part);
  }
  return parts.join('');
}

/* ---------- 纯函数式深拷贝（只拷贝会被改写的层级） ---------- */

function cloneNav(list) {
  return (list || []).map((n) => ({ ...n, children: cloneNav(n.children) }));
}

/**
 * 拷贝一本 Book：新建会被本 transform 改写的容器（meta / chapters / nav /
 * notes / warnings），resources 里的二进制数据不转换、不改动，Map 做浅拷贝、
 * 复用同一批 Resource 对象——大书往往带很多图片，没必要为一次文本转换
 * 把图片字节再复制一遍。
 */
function cloneBook(book) {
  return {
    meta: { ...book.meta },
    cover: book.cover,
    resources: new Map(book.resources),
    chapters: book.chapters.map((ch) => ({ ...ch })),
    nav: cloneNav(book.nav),
    notes: new Map(Array.from(book.notes, ([id, n]) => [id, { ...n }])),
    warnings: book.warnings.map((w) => ({ ...w })),
  };
}

/**
 * Book IR → Book IR 的繁简转换。纯函数，不修改入参。
 *
 * @param {import('../ir.js').Book} book
 * @param {{scheme?: string|null}} [opts]  scheme 取值见 SCHEME_KEYS；
 *   缺省 / null / 'none' 均视为「不转换」（合法的恒等变换）。
 * @returns {Promise<import('../ir.js').Book>}
 */
async function opencc(book, opts = {}) {
  const schemeKey = opts && opts.scheme;

  if (!schemeKey || schemeKey === 'none') {
    // 恒等变换：仍然返回新对象，保持"纯函数"契约，但不做任何文本改写。
    return cloneBook(book);
  }

  const def = SCHEMES[schemeKey];
  if (!def) throw new Error(`未知的繁简转换方案: ${schemeKey}`);
  const convert = getConverter(def.from, def.to);

  const out = cloneBook(book);

  // meta：仅改写面向读者的文本内容（书名/作者/出版方/简介）。
  // meta.language / identifier / date / writingMode 是结构性字段，不属于
  // "文本层"，本 transform 不改写；理由与已知限制见 ResultReport.learned。
  if (out.meta.title != null) out.meta.title = convert(out.meta.title);
  if (out.meta.author != null) out.meta.author = convert(out.meta.author);
  if (out.meta.publisher != null) out.meta.publisher = convert(out.meta.publisher);
  if (out.meta.description != null) out.meta.description = convert(out.meta.description);

  // 章节：标题 + html 文本节点。大书分块——每章处理完让出主线程一次。
  for (const ch of out.chapters) {
    if (ch.title != null) ch.title = convert(ch.title);
    ch.html = convertHtmlText(ch.html, convert);
    await tick();
  }

  // 目录树标题
  const convertNavTitles = (list) => {
    for (const n of list) {
      if (n.title != null) n.title = convert(n.title);
      if (n.children && n.children.length) convertNavTitles(n.children);
    }
  };
  convertNavTitles(out.nav);

  // 脚注/尾注：与章节同为 HTML 片段，同样只动文本节点。
  let noteCount = 0;
  for (const [id, note] of out.notes) {
    out.notes.set(id, { ...note, html: convertHtmlText(note.html, convert) });
    noteCount += 1;
    if (noteCount % 20 === 0) await tick();
  }

  return out;
}

return { SCHEMES, SCHEME_KEYS, opencc };
})();

/* ==== src/transforms/furigana.js ==== */
SJ.transforms.furigana = (function () {
'use strict';
/* ============================================================
 * src/transforms/furigana.js · 日语注音（Book IR → Book IR）
 *
 * 契约：docs/harness/BOOK-IR.md §6（transforms 通用契约）。
 *   1. 结构不变：chapters.length / 每章 level / nav 树形状 / resources 键集合，
 *      进出完全一致——本文件只改 chapter.html 与 notes[*].html 里的文本节点，
 *      不碰 chapter.title / nav.title / meta.title（它们是纯文本字段，IR §2
 *      没有把它们纳入"受限 HTML 子集"，塞 <ruby> 进去会破坏 schema）。
 *   2. 可交换：只标注"当前文本长什么样"，不关心这段文本是不是被 opencc 改写过的
 *      字形——本文件对字形差异没有记忆，天然满足"顺序无关"里"本 transform 不做
 *      特殊处理"这一半。另一半（opencc 不转换 <rt>）由 opencc.js 负责。
 *      但有个已知的不可交换场景：这条约定在"日语书 + 非 none 的繁简方案"组合下
 *      无法总是成立，原因不在本文件——见交付时的 ResultReport（opencc 会把一部分
 *      日语汉字的字形改写成分词词典不认识的中文简体/繁体形，导致其中一个顺序下
 *      该字丢失读音）。产品层面的建议是不要对日语书提供繁简方案，而不是让本文件
 *      去猜测"这个字是不是被动过"。
 *   3. 幂等：已在 <ruby> 内的文本（含 <rt>/<rp>）原样跳过，不二次包裹。
 *   4. 纯函数：不修改入参 book，返回新对象。
 *
 * 分词引擎不进本模块。调用方必须已经准备好一个能用的 tokenizer 并注入：
 *   - 优先：opts.tokenizer —— 任何具备 `.tokenize(text): Token[]` 方法的对象
 *     （kuromoji 的 Tokenizer 实例天然满足；测试里直接传等价对象即可）。
 *   - 兜底：globalThis.kuromoji，且它本身要有 `.tokenize()` 方法（即调用方已经
 *     完成 kuromoji.builder({...}).build() 并把结果挂到这个全局名字上）。
 *     注意这不是 kuromoji 模块本身（模块只有 .builder()，没有 .tokenize()）。
 *   两者都没有时抛出人话错误（不是 undefined 方法调用的原始异常）——由 UI 层
 *   捕获后提示"请先勾选注音并等待词典下载完成"（具体文案由 ux-writer 定）。
 *
 * Token 的最低字段要求（对齐 kuromoji 的 IPADIC Token）：
 *   surface_form: string           词面文本
 *   reading:      string|undefined 片假名读音；未登录词/生僻字常缺失
 *
 * 环境中立：不碰 DOM，标签/文本切分复用 opencc.js 同款"正则切分 + 深度计数"
 *   思路（同目录先例），前提同样是 html 已过 sanitizeHtml，标签结构规整。

const tick = () => new Promise((resolve) => setTimeout(resolve, 0));

/* ---------- 汉字判定 / 假名转换 ---------- */

// CJK 统一表意文字 + 扩展 A + 兼容表意文字 + 扩展 B-F（辅助平面）+ 々〇
// （々 是汉字叠字符号，如"人々"；〇 是汉字化的零，两者按汉字处理才不会把
//  "時々""三〇年" 这类词错误地当成"含假名的混排词"处理）
const KANJI_TEST_RE = /[㐀-鿿豈-﫿々〇\u{20000}-\u{2FFFF}]/u;

function isKanjiCp(cp) {
  return (cp >= 0x4E00 && cp <= 0x9FFF)
    || (cp >= 0x3400 && cp <= 0x4DBF)
    || (cp >= 0xF900 && cp <= 0xFAFF)
    || (cp >= 0x20000 && cp <= 0x2FFFF)
    || cp === 0x3005
    || cp === 0x3007;
}

function hasKanji(text) {
  return KANJI_TEST_RE.test(text);
}

// 片假名（U+30A1-U+30F6，含小字/ヴ/ヵヶ）→ 平假名。日语注音惯例用平假名，
// 且与既有样本（test/golden/ja/sample.xhtml）里手工核定的 <rt> 一致。
// 长音符 ー（U+30FC）没有平假名对应，原样保留。
function kataToHira(s) {
  return s.replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
}

// 只用来转义"本文件新合成的文本"（目前只有 rt 里的假名读音）。
// 绝不能拿它处理"从原始 html 里原样复制出来的片段"（surface 文本、非汉字游程、
// ruby base）——那些片段已经是 sanitizeHtml 转义过的合法 HTML 文本，
// 可能已经含有 "&amp;" 这样的实体；再转义一次会把它变成 "&amp;amp;"，
// 是货真价实的破坏输出。这条与 opencc.js 里"不做实体解码/转义"的理由一致，
// 只是这里既有需要转义的新内容（rt），也有必须原样直通的旧内容（surface）。
function escapeText(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ---------- 逐字符游程切分：汉字游程 / 非汉字游程交替 ---------- */

function splitRuns(text) {
  const runs = [];
  let cur = '';
  let curKanji = null;
  for (const ch of text) { // for...of 按码点迭代，辅助平面汉字不会被代理对拆散
    const k = isKanjiCp(ch.codePointAt(0));
    if (curKanji === null) { cur = ch; curKanji = k; }
    else if (k === curKanji) { cur += ch; }
    else { runs.push({ text: cur, kanji: curKanji }); cur = ch; curKanji = k; }
  }
  if (cur) runs.push({ text: cur, kanji: curKanji });
  return runs;
}

// base 原样直通（原始 html 片段，已经是合法转义过的文本，见 escapeText 上面的
// 说明）；rt 是本文件新合成的读音，转义一下不会错，也几乎从不会真的有内容要转
// （假名不含 & < >），纯防御性。
function rubyTag(base, rt) {
  return `<ruby>${base}<rp>(</rp><rt>${escapeText(rt)}</rt><rp>)</rp></ruby>`;
}

/**
 * 按"只标生僻字"开关决定是否真的包 ruby。
 * 粒度是汉字游程整体，不是单字：游程里只要有一个字不在常用汉字表，就整体标注；
 * 全部是常用字则整体跳过。不做字符级的读音拆分——一个游程的读音是分词器给的
 * 一整段音，拆到字符级需要额外的字音对齐假设，超出"不做消歧"的范围。
 */
function maybeWrapRun(text, reading, opts) {
  if (opts && opts.onlyRareKanji) {
    let allCommon = true;
    for (const ch of text) {
      if (isKanjiCp(ch.codePointAt(0)) && !JOYO_KANJI.has(ch)) { allCommon = false; break; }
    }
    if (allCommon) return text; // 原样直通，text 是原始片段，不是新合成内容
  }
  return rubyTag(text, reading);
}

/**
 * 给一个分词器 token 生成标注后的片段。
 * 核心问题：一个词的 surface（如"生まれ"）常常是"汉字+送假名"混排，只应该给
 * 汉字部分套 ruby，送假名（"まれ"）保持原样——不然假名会在正文里重复出现一次
 * （一次是原文，一次在 rt 里），既吵又不符合日语排版惯例。
 *
 * 做法：分词器给的 reading 是整个 surface 的完整读音（片假名）。把 surface 切成
 * 汉字游程/假名游程交替的序列，假名游程的文本转成平假名后应当能在 reading 里
 * 按顺序原样找到（这是"送假名"的定义——怎么写就怎么读）。用假名游程在 reading
 * 里的位置做锚点，两个锚点之间（或锚点到首尾）剩下的 reading 片段就是夹在中间
 * 的汉字游程的读音。
 *
 * 找不到锚点（活用形的音变导致假名游程在 reading 里对不上，实测里没遇到，但
 * 保留兜底）时，整个 surface 一起套一个 ruby，读音用分词器给的完整 reading——
 * 比完全不标注更有用，代价是 rt 里会把送假名的音也重复一遍。
 */
function annotateToken(surface, readingKatakana, opts) {
  if (!hasKanji(surface)) return surface; // 原样直通，surface 是原始片段

  const readingHira = readingKatakana ? kataToHira(readingKatakana) : '';
  if (!readingHira) {
    // 分词器没给读音：多是未登录词/生僻字（word_type UNKNOWN）。不猜，原样输出。
    return surface;
  }

  const runs = splitRuns(surface);

  if (runs.length === 1) {
    // 纯汉字游程（如"見当""所"），整体套 ruby。
    return maybeWrapRun(runs[0].text, readingHira, opts);
  }

  // 多游程：假名游程做锚点，在 reading 里顺序查找。
  let cursor = 0;
  const anchors = [];
  let ok = true;
  for (const run of runs) {
    if (run.kanji) { anchors.push(null); continue; }
    const hiraRun = kataToHira(run.text);
    const idx = readingHira.indexOf(hiraRun, cursor);
    if (idx === -1) { ok = false; break; }
    anchors.push({ start: idx, end: idx + hiraRun.length });
    cursor = idx + hiraRun.length;
  }

  if (!ok) {
    // 兜底：锚点对不齐，整词一起标注。
    return rubyTag(surface, readingHira);
  }

  let out = '';
  let prevEnd = 0;
  for (let i = 0; i < runs.length; i++) {
    const run = runs[i];
    if (!run.kanji) {
      out += run.text; // 原样直通
      prevEnd = anchors[i].end;
      continue;
    }
    let nextStart = readingHira.length;
    for (let j = i + 1; j < runs.length; j++) {
      if (anchors[j]) { nextStart = anchors[j].start; break; }
    }
    const seg = readingHira.slice(prevEnd, nextStart);
    out += seg ? maybeWrapRun(run.text, seg, opts) : run.text;
    prevEnd = nextStart;
  }
  return out;
}

/* ---------- HTML 感知的文本转换（同目录 opencc.js 的切分/深度计数模式） ---------- */

const TAG_SPLIT_RE = /(<[^>]*>)/g;
const TAG_NAME_RE = /^<\/?\s*([a-zA-Z][a-zA-Z0-9]*)/;

// 章内分块阈值：每处理满这么多字符（跨多个文本节点累计）就 await tick() 一次，
// 把主线程让出去。取值来自 verifier 实测反馈（D4，见 ResultReport）：单章 30 万字
// 的日语书连续同步处理会阻塞主线程 ~400ms；按段落（<p> 之间天然的文本节点边界）
// 累计计数、不拆分单个文本节点本身来分块，保证"分块只影响调度时机，不影响
// tokenizer 看到的输入"——语义（输出字节）与不分块时完全一致，只是把一次性的
// 长同步任务切成多段、段间让出主线程。
const CHUNK_CHAR_BUDGET_DEFAULT = 15000;

// opts.__chunkCharBudget：仅供 test/furigana.mjs 用来在同一份输入上强制"几乎从不
// 分块"（传一个很大的数）与"几乎每个节点都分块"（传一个很小的数）两种极端跑一遍，
// 断言两者输出字节级相同——直接证明"分块粒度不改变输出"，而不是依赖计时结果
// （计时本身易抖动，不适合当正确性证据）。不是公开契约的一部分，不出现在本文件
// 头部的 opts 说明里；调用方（app.js）不应该、也不需要传这个字段。
function chunkBudget(opts) {
  const v = opts && opts.__chunkCharBudget;
  return Number.isFinite(v) && v > 0 ? v : CHUNK_CHAR_BUDGET_DEFAULT;
}

/**
 * 标注一段受限 HTML 子集里的文本节点，标签原样保留。
 * 深度计数覆盖 <ruby>...</ruby> 整体（不只是 <rt>）：已有 ruby 的 base 文本和
 * rt/rp 文本都原样跳过——这同时满足"幂等"（不二次包裹）和"不碰 <rt> 里的假名"
 * （<rt> 本来就嵌在 <ruby> 里，被 ruby 深度计数覆盖，不需要单独再判断一次）。
 *
 * 异步且章内分块：每个文本节点仍然整体喂给 tokenizer.tokenize()（不拆分单个
 * 节点，分词结果不受分块影响），只在节点与节点之间、累计字符数超过预算
 * （默认 CHUNK_CHAR_BUDGET_DEFAULT，见 chunkBudget()）时插入一次 await tick()。
 * 大章节（很多 <p>）能被切成多段执行；单个节点本身异常巨大（现实的书不会这样
 * 排版）时，那一次 tokenize() 调用仍是一整块同步耗时，是已知的残余限制，见
 * ResultReport。
 */
async function annotateHtmlText(html, tokenizer, opts) {
  if (!html) return html;
  const parts = html.split(TAG_SPLIT_RE);
  const budgetLimit = chunkBudget(opts);
  let rubyDepth = 0;
  let budget = 0;
  for (let i = 0; i < parts.length; i++) {
    const part = parts[i];
    if (!part) continue;
    if (part.charCodeAt(0) === 60 /* '<' */) {
      const m = TAG_NAME_RE.exec(part);
      const tag = m ? m[1].toLowerCase() : '';
      if (tag === 'ruby') {
        if (part[1] === '/') rubyDepth = Math.max(0, rubyDepth - 1);
        else rubyDepth += 1;
      }
      continue;
    }
    if (rubyDepth > 0) continue; // 已标注区域，原样保留
    if (!hasKanji(part)) continue; // 快速跳过纯假名/拉丁/数字/标点的文本节点
    const tokens = tokenizer.tokenize(part);
    let out = '';
    for (const t of tokens) out += annotateToken(t.surface_form, t.reading, opts);
    parts[i] = out;

    budget += part.length;
    if (budget >= budgetLimit) {
      await tick();
      budget = 0;
    }
  }
  return parts.join('');
}

/* ---------- 分词器解析（不做加载，只做"有没有可用的"判断） ---------- */

function resolveTokenizer(opts) {
  if (opts && opts.tokenizer && typeof opts.tokenizer.tokenize === 'function') {
    return opts.tokenizer;
  }
  const g = typeof globalThis !== 'undefined' ? globalThis.kuromoji : undefined;
  if (g && typeof g.tokenize === 'function') return g;
  throw new Error(
    '日语分词器尚未就绪：请先加载 kuromoji 词典（通过 opts.tokenizer 注入，'
    + '或让 globalThis.kuromoji 指向已 build 完成、带 tokenize() 方法的实例）。'
    + '这是集成侧（勾选注音时按需下载词典）的职责，本函数不负责加载。'
  );
}

/* ---------- 纯函数式深拷贝（与 opencc.js 相同的拷贝粒度） ---------- */

function cloneNav(list) {
  return (list || []).map((n) => ({ ...n, children: cloneNav(n.children) }));
}

function cloneBook(book) {
  return {
    meta: { ...book.meta },
    cover: book.cover,
    resources: new Map(book.resources),
    chapters: book.chapters.map((ch) => ({ ...ch })),
    nav: cloneNav(book.nav),
    notes: new Map(Array.from(book.notes, ([id, n]) => [id, { ...n }])),
    warnings: book.warnings.map((w) => ({ ...w })),
  };
}

/**
 * Book IR → Book IR 的日语注音。纯函数，不修改入参。
 *
 * 只处理 chapter.html 与 notes[*].html 的文本节点；meta.title / chapter.title /
 * nav[].title 是纯文本字段（IR §2），不承载受限 HTML 子集，不会被标注。
 *
 * @param {import('../ir.js').Book} book
 * @param {{tokenizer?: {tokenize(text:string):Array}, onlyRareKanji?: boolean}} [opts]
 * @returns {Promise<import('../ir.js').Book>}
 */
async function furigana(book, opts = {}) {
  const tokenizer = resolveTokenizer(opts);
  const out = cloneBook(book);

  for (const ch of out.chapters) {
    // annotateHtmlText 自己按字符预算章内分块让路（见函数注释）；这里再补一次
    // tick()，覆盖"章节很小、内部从没触发过分块阈值"的情况，保持章与章之间
    // 始终至少让路一次的既有节奏（与 opencc.js 的每章一次 tick 对齐）。
    ch.html = await annotateHtmlText(ch.html, tokenizer, opts);
    await tick();
  }

  let noteCount = 0;
  for (const [id, note] of out.notes) {
    out.notes.set(id, { ...note, html: await annotateHtmlText(note.html, tokenizer, opts) });
    noteCount += 1;
    if (noteCount % 20 === 0) await tick();
  }

  return out;
}

return { furigana };
})();

/* ==== src/readers/txt.js ==== */
SJ.readers.txt = (function () {
'use strict';
/* ============================================================
 * src/readers/txt.js · TXT → Book IR
 *
 * 契约：docs/harness/BOOK-IR.md §4（txt 行）
 *   必须产出 chapters + meta.title；nav/resources/notes 允许省略。
 *   切不出章节标题时整书按单章处理，并记 warning "txt.no-chapters"。
 *
 * 编码嗅探：BOM 优先；否则按 UTF-8 严格解码，失败则在 Big5 / GB18030
 *   间用"乱码字符占比"启发式取更可读者（繁体书大概率 Big5）。
 *
 * 章节切分：整行匹配"第X章/回/卷/篇/部/集"等标题正则即开新章，
 *   该整行文本即为标题（不重复出现在正文 <p> 里）；非空行各自成一个
 *   <p>，空行仅作分隔符不进入输出。首个标题之前的正文归入一个
 *   title:null 的无标题章。
 * ============================================================ */

const { newBook, warn } = SJ.ir;

/* ---------- 章节标题正则 ----------
 * 覆盖简体/繁体常见回目写法："第X章/回/节/節/卷/篇/部/集"，
 * 以及"序章/楔子/引子/尾声/尾聲/后记/後記/番外/终章/終章"等独立标题。
 * X 支持中文数字（含〇零两兩萬万）与阿拉伯数字。
 */
const HEADING_RE = /^\s*(?:第[〇零一二三四五六七八九十百千萬万两兩0-9]+[章回節节卷篇部集]|序章|楔子|引子|尾聲|尾声|後記|后记|番外|终章|終章)(?:\s|$)/;

/* ---------- HTML 转义（正文里可能出现的 & < > 必须转义） ---------- */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ---------- 主线程让步（大文件分块处理用） ---------- */
function tick() {
  return new Promise((resolve) => {
    if (typeof setTimeout === 'function') setTimeout(resolve, 0);
    else if (typeof queueMicrotask === 'function') queueMicrotask(resolve);
    else resolve();
  });
}

/* ---------- 编码嗅探的"乱码度"启发式 ----------
 * 解码错误的 Big5/GB18030 互猜通常会产生注音符号、制表符/方块字符、
 * 私用区或控制字符——正常中文散文几乎不会出现这些。用占比高低择优。
 */
const BAD_RANGES = [
  [0x00, 0x08], [0x0b, 0x0c], [0x0e, 0x1f], // 控制字符（保留 \t\n\r）
  [0x2500, 0x25ff],  // 制表符 / 方块 / 几何图形
  [0x3100, 0x312f],  // 注音符号
  [0x31a0, 0x31bf],  // 注音符号扩展
  [0xe000, 0xf8ff],  // 私用区
  [0xfffd, 0xfffd],  // 替换字符
];
function isBadCodepoint(cp) {
  for (const [lo, hi] of BAD_RANGES) if (cp >= lo && cp <= hi) return true;
  return false;
}
function badScore(s) {
  let bad = 0, total = 0;
  for (const ch of s) { total++; if (isBadCodepoint(ch.codePointAt(0))) bad++; }
  return total ? bad / total : 1;
}

/**
 * 把字节流解码为文本，返回 {text, encoding, warnings}。
 * warnings 是 [{code, detail}] 数组，供调用方合并进 book.warnings。
 */
function decodeText(bytes) {
  const warnings = [];

  // BOM 优先
  if (bytes.length >= 3 && bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) {
    return { text: new TextDecoder('utf-8').decode(bytes.subarray(3)), encoding: 'utf-8', warnings };
  }
  if (bytes.length >= 2 && bytes[0] === 0xff && bytes[1] === 0xfe) {
    return { text: new TextDecoder('utf-16le').decode(bytes.subarray(2)), encoding: 'utf-16le', warnings };
  }
  if (bytes.length >= 2 && bytes[0] === 0xfe && bytes[1] === 0xff) {
    return { text: new TextDecoder('utf-16be').decode(bytes.subarray(2)), encoding: 'utf-16be', warnings };
  }

  // 严格 UTF-8
  try {
    const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    return { text, encoding: 'utf-8', warnings };
  } catch { /* 不是合法 UTF-8，继续尝试中文遗留编码 */ }

  // 严格 GB18030 / Big5：字节序列本身不合法时会抛错
  let gbText = null, big5Text = null;
  try { gbText = new TextDecoder('gb18030', { fatal: true }).decode(bytes); } catch { /* 忽略 */ }
  try { big5Text = new TextDecoder('big5', { fatal: true }).decode(bytes); } catch { /* 忽略 */ }

  if (gbText !== null && big5Text === null) return { text: gbText, encoding: 'gb18030', warnings };
  if (big5Text !== null && gbText === null) return { text: big5Text, encoding: 'big5', warnings };
  if (gbText !== null && big5Text !== null) {
    // 两种编码都能无错解码同一段字节——用乱码占比择优
    if (badScore(gbText) <= badScore(big5Text)) {
      return { text: gbText, encoding: 'gb18030', warnings };
    }
    return { text: big5Text, encoding: 'big5', warnings };
  }

  // 三种编码都解不干净：尽力用 GB18030 非严格模式兜底，明确告知用户
  const text = new TextDecoder('gb18030').decode(bytes);
  warnings.push({ code: 'txt.encoding-fallback', detail: '未能确定文本编码，已尽力解码，部分字符可能显示异常' });
  return { text, encoding: 'gb18030', warnings };
}

function stripExt(name) {
  const base = String(name).split(/[\\/]/).pop() || '';
  const idx = base.lastIndexOf('.');
  return idx > 0 ? base.slice(0, idx) : base;
}

/**
 * 把纯文本切成章节数组。非空行各自成一个 <p>；命中标题正则的整行
 * 开一个新章并把整行文本存为该章 title；首个标题前的内容归入
 * title:null 的无标题章。大文件分块处理，定期让出主线程。
 */
async function buildChapters(text) {
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const chapters = [];
  let cur = null, ci = 0, sawHeading = false;
  const paras = [];

  const flush = () => {
    if (cur && paras.length) cur.html += paras.map((p) => `<p>${escapeHtml(p)}</p>`).join('');
    paras.length = 0;
  };
  const open = (title) => {
    cur = { id: `c${++ci}`, title, level: 1, html: '' };
    chapters.push(cur);
  };

  const CHUNK = 4000;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (HEADING_RE.test(line)) {
      flush();
      sawHeading = true;
      open(line);
    } else if (line) {
      if (!cur) open(null);
      paras.push(line);
    }
    if (i % CHUNK === CHUNK - 1) await tick();
  }
  flush();
  if (chapters.length === 0) open(null);

  return { chapters, sawHeading };
}

/**
 * TXT（ArrayBuffer|Uint8Array）→ Book IR。
 * @param {ArrayBuffer|Uint8Array} buf
 * @param {{filename?: string}} [opts]  filename 可选，用于回退书名
 * @returns {Promise<import('../ir.js').Book>}
 */
async function read(buf, opts = {}) {
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  if (!bytes.length) throw new Error('这个文件是空的，没有内容可以读取。');

  const { text, encoding, warnings: encWarnings } = decodeText(bytes);

  const title = opts && opts.filename ? stripExt(opts.filename) : undefined;
  const book = newBook({
    title,
    language: encoding === 'big5' ? 'zh-Hant' : 'zh-Hans',
  });

  for (const w of encWarnings) warn(book, w.code, w.detail);

  const { chapters, sawHeading } = await buildChapters(text);
  book.chapters = chapters;
  if (!sawHeading) warn(book, 'txt.no-chapters', '未识别到章节标题，已作为单章处理');

  return book;
}

return { read };
})();
