    }
  }
  return Uint8Array.from(out);
}

/* ---------- 每条文本记录末尾的附加数据（多字节续接 / TBS 等），解压前需剥离 ---------- */

function getTrailingEntrySize(data) {
  let num = 0;
  const start = Math.max(0, data.length - 4);
  for (let i = start; i < data.length; i++) {
    const v = data[i];
    if (v & 0x80) num = 0;
    num = num * 128 + (v & 0x7f);
  }
  return num;
}

function trimTrailingEntries(data, trailers, multibyte) {
  for (let i = 0; i < trailers; i++) {
    const num = getTrailingEntrySize(data);
    if (num > 0 && num <= data.length) data = data.subarray(0, data.length - num);
  }
  if (multibyte && data.length > 0) {
    const num = (data[data.length - 1] & 3) + 1;
    if (num <= data.length) data = data.subarray(0, data.length - num);
  }
  return data;
}

function countTrailers(flags) {
  const multibyte = flags & 1;
  let trailers = 0;
  let f = flags;
  while (f > 1) {
    if (f & 2) trailers++;
    f >>= 1;
  }
  return { trailers, multibyte };
}

/* ---------- PDB 容器 ---------- */

function parsePDB(bytes, view) {
  if (bytes.length < 78) fail('这似乎不是有效的 AZW3 文件（文件太小）。');
  const creator = asciiStr(bytes, 64, 4);
  if (creator !== 'MOBI') fail('这似乎不是有效的 AZW3/MOBI 文件。');
  const numRecords = view.getUint16(76);
  if (numRecords < 1) fail('这似乎不是有效的 AZW3 文件（没有数据记录）。');
  const offsets = [];
  for (let i = 0; i < numRecords; i++) offsets.push(view.getUint32(78 + i * 8));
  const sections = [];
  for (let i = 0; i < numRecords; i++) {
    const start = offsets[i];
    const end = i + 1 < numRecords ? offsets[i + 1] : bytes.length;
    sections.push(bytes.subarray(start, Math.max(start, end)));
  }
  let name = asciiStr(bytes, 0, 32);
  const nul = name.indexOf('\u0000');
  if (nul >= 0) name = name.slice(0, nul);
  return { sections, name };
}

/* ---------- MOBI / EXTH 头 ---------- */

function parseEXTH(rec, view, offset) {
  const tags = {};
  let length = 0;
  if (offset + 12 <= rec.length && asciiStr(rec, offset, 4) === 'EXTH') {
    const headerLength = view.getUint32(offset + 4);
    const numItems = view.getUint32(offset + 8);
    let pos = offset + 12;
    for (let i = 0; i < numItems && pos + 8 <= rec.length; i++) {
      const id = view.getUint32(pos);
      const size = view.getUint32(pos + 4);
      if (size < 8 || pos + size > rec.length) break;
      const content = rec.subarray(pos + 8, pos + size);
      (tags[id] || (tags[id] = [])).push(content);
      pos += size;
    }
    length = (headerLength + 3) & ~3;
  }
  return { tags, length };
}

/** 解析一条记录作为「record0 风格」的 MOBI 头。recIndex = 该记录在 PDB 中的下标（combo 文件的 K8 头非 0）。 */
function parseMobiHeader(rec, recIndex) {
  if (rec.length < 20 || asciiStr(rec, 16, 4) !== 'MOBI') return null;
  const view = new DataView(rec.buffer, rec.byteOffset, rec.byteLength);
  const g32 = (off, dflt = 0xffffffff) => (off + 4 <= rec.length ? view.getUint32(off) : dflt);
  const g16 = (off, dflt = 0) => (off + 2 <= rec.length ? view.getUint16(off) : dflt);

  const compressionType = g16(0, 1);
  const encryptionType = g16(12, 0);
  const textRecordCount = g16(8, 0);
  const headerLength = g32(20, 0);
  const textEncoding = g32(28, 65001);
  const version = g32(36, 0);
  const fullNameOffset = g32(84, 0);
  const fullNameLength = g32(88, 0);
  const locale = g32(92, 0);
  let firstResource = g32(108, 0xffffffff);
  const exthFlags = g32(128, 0);
  const drmOffset = g32(168, 0xffffffff);
  const drmCount = g32(172, 0xffffffff);
  const traildataFlags = g16(0xf2, 0);
  let ncxidx = g32(0xf4, 0xffffffff);

  let skelidx = 0xffffffff, fragidx = 0xffffffff, guideidx = 0xffffffff;
  let fdst = 0xffffffff, fdstFlowCount = 0;
  const isK8 = recIndex !== 0 || version === 8;
  if (isK8) {
    fdst = g32(0xc0, 0xffffffff);
    fdstFlowCount = g32(0xc4, 0);
    if (fdstFlowCount <= 1) fdst = 0xffffffff;
    fragidx = g32(0xf8, 0xffffffff);
    skelidx = g32(0xfc, 0xffffffff);
    guideidx = g32(0x104, 0xffffffff);
    if (skelidx !== 0xffffffff) skelidx += recIndex;
    if (fragidx !== 0xffffffff) fragidx += recIndex;
    if (guideidx !== 0xffffffff) guideidx += recIndex;
    if (fdst !== 0xffffffff) fdst += recIndex;
  }
  if (firstResource !== 0xffffffff) firstResource += recIndex;
  if (ncxidx !== 0xffffffff) ncxidx += recIndex;

  const hasExth = (exthFlags & 0x40) !== 0;
  const exth = hasExth ? parseEXTH(rec, view, headerLength + 16) : { tags: {}, length: 0 };

  let title = null;
  if (fullNameLength > 0 && fullNameOffset + fullNameLength <= rec.length) {
    title = decodeText(rec.subarray(fullNameOffset, fullNameOffset + fullNameLength), textEncoding);
  }

  return {
    recIndex, isK8, version, compressionType, encryptionType, textRecordCount,
    headerLength, textEncoding, locale, firstResource, drmOffset, drmCount,
    traildataFlags, ncxidx, skelidx, fragidx, guideidx, fdst, fdstFlowCount,
    exth, title,
  };
}

/* ---------- FDST：主文本流分段 ---------- */

function parseFDST(sections, idx, rawSize) {
  if (idx === 0xffffffff || !sections[idx] || asciiStr(sections[idx], 0, 4) !== 'FDST') return [0, rawSize];
  const data = sections[idx];
  const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
  const numSections = view.getUint32(8);
  const starts = [];
  for (let j = 0; j < numSections && 12 + j * 8 + 4 <= data.length; j++) starts.push(view.getUint32(12 + j * 8));
  if (!starts.length) return [0, rawSize];
  starts.push(rawSize);
  return starts;
}

/* ---------- INDX / TAGX 通用索引解析 ---------- */

function parseINDXHeader(data, view) {
  if (data.length < 56 || asciiStr(data, 0, 4) !== 'INDX') return null;
  const words = ['len', 'nul1', 'type', 'gen', 'start', 'count', 'code', 'lng', 'total', 'ordt', 'ligt', 'nligt', 'nctoc'];
  const header = {};
  words.forEach((w, i) => { header[w] = view.getUint32(4 + i * 4); });
  return header;
}

function readTagSection(data, view, start) {
  let controlByteCount = 0;
  const tags = [];
  if (start + 12 <= data.length && asciiStr(data, start, 4) === 'TAGX') {
    const firstEntryOffset = view.getUint32(start + 4);
    controlByteCount = view.getUint32(start + 8);
    for (let i = 12; i < firstEntryOffset && start + i + 4 <= data.length; i += 4) {
      const p = start + i;
      tags.push([data[p], data[p + 1], data[p + 2], data[p + 3]]);
    }
  }
  return { controlByteCount, tags };
}

function countSetBits(v) {
  let c = 0;
  for (let i = 0; i < 8; i++) { if (v & 1) c++; v >>= 1; }
  return c;
}

function getVariableWidthValue(data, offset) {
  let value = 0, consumed = 0, finished = false;
  while (!finished && offset + consumed < data.length) {
    const v = data[offset + consumed];
    consumed++;
    if (v & 0x80) finished = true;
    value = value * 128 + (v & 0x7f);
  }
  return [Math.max(consumed, 1), value];
}

function getTagMap(controlByteCount, tagTable, data, startPos, endPos) {
  const prelim = [];
  let controlByteIndex = 0;
  let dataStart = startPos + controlByteCount;
  for (const [tag, valuesPerEntry, mask, endFlag] of tagTable) {
    if (endFlag === 1) { controlByteIndex++; continue; }
    const cbyte = data[startPos + controlByteIndex] || 0;
    const value = cbyte & mask;
    if (value !== 0) {
      if (value === mask) {
        if (countSetBits(mask) > 1) {
          const [consumed, v] = getVariableWidthValue(data, dataStart);
          dataStart += consumed;
          prelim.push([tag, null, v, valuesPerEntry]);
        } else {
          prelim.push([tag, 1, null, valuesPerEntry]);
        }
      } else {
        let m = mask, val = value;
        while ((m & 1) === 0 && m !== 0) { m >>= 1; val >>= 1; }
        prelim.push([tag, val, null, valuesPerEntry]);
      }
    }
  }
  const tagMap = {};
  for (const [tag, valueCount, valueBytes, valuesPerEntry] of prelim) {
    const values = [];
    if (valueCount !== null) {
      for (let i = 0; i < valueCount * valuesPerEntry; i++) {
        const [consumed, v] = getVariableWidthValue(data, dataStart);
        dataStart += consumed; values.push(v);
      }
    } else {
      let totalConsumed = 0;
      while (totalConsumed < valueBytes && dataStart < endPos + 8) {
        const [consumed, v] = getVariableWidthValue(data, dataStart);
        dataStart += consumed; totalConsumed += consumed; values.push(v);
      }
    }
    tagMap[tag] = values;
  }
  return tagMap;
}

function readCTOC(data) {
  const result = {};
  let offset = 0;
  while (offset < data.length && data[offset] !== 0) {
    const idxOffs = offset;
    const [consumed, len] = getVariableWidthValue(data, offset);
    offset += consumed;
    result[idxOffs] = data.subarray(offset, offset + len);
    offset += len;
  }
  return result;
}

function getIndexData(sections, idx) {
  const outtbl = [];
  const ctocText = {};
  if (idx === 0xffffffff || !sections[idx]) return { outtbl, ctocText };
  const data = sections[idx];
  const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
  const hdr = parseINDXHeader(data, view);
  if (!hdr) return { outtbl, ctocText };
  const indexCount = hdr.count;
  let recOff = 0;
  const ctocStart = idx + indexCount + 1;
  for (let j = 0; j < hdr.nctoc && sections[ctocStart + j]; j++) {
    const ctoc = readCTOC(sections[ctocStart + j]);
    for (const k in ctoc) ctocText[Number(k) + recOff] = ctoc[k];
    recOff += 0x10000;
  }
  const { controlByteCount, tags: tagTable } = readTagSection(data, view, hdr.len);
  for (let i = idx + 1; i <= idx + indexCount; i++) {
    const edata = sections[i];
    if (!edata) continue;
    const edv = new DataView(edata.buffer, edata.byteOffset, edata.byteLength);
    const ehdr = parseINDXHeader(edata, edv);
    if (!ehdr) continue;
    const idxtPos = ehdr.start;
    const entryCount = ehdr.count;
    const idxPositions = [];
    for (let j = 0; j < entryCount && idxtPos + 4 + 2 * j + 2 <= edata.length; j++) {
      idxPositions.push(edv.getUint16(idxtPos + 4 + 2 * j));
    }
    idxPositions.push(idxtPos);
    for (let j = 0; j < idxPositions.length - 1; j++) {
      const startPos = idxPositions[j], endPos = idxPositions[j + 1];
      if (startPos >= edata.length) continue;
      const textLength = edata[startPos];
      const text = edata.subarray(startPos + 1, startPos + 1 + textLength);
      const tagMap = getTagMap(controlByteCount, tagTable, edata, startPos + 1 + textLength, endPos);
      outtbl.push([text, tagMap]);
    }
  }
  return { outtbl, ctocText };
}

/* ---------- skeleton / fragment / ncx 表 ---------- */

function parseSkeletonIndex(sections, idx) {
  const { outtbl } = getIndexData(sections, idx);
  return outtbl.map(([nameBytes, tagMap]) => ({
    name: asciiStr(nameBytes),
    fragcnt: tagMap[1] ? tagMap[1][0] : 0,
    start: tagMap[6] ? tagMap[6][0] : 0,
    length: tagMap[6] ? tagMap[6][1] : 0,
  }));
}

/* ---------- 组装 part（skeleton + fragment 拼接） ---------- */

function buildParts(flow0, skeltbl, fragtbl) {
  const parts = [];
  const partinfo = [];
  let fragptr = 0;
  for (let skelnum = 0; skelnum < skeltbl.length; skelnum++) {
    const sk = skeltbl[skelnum];
    let baseptr = sk.start + sk.length;
    let skeleton = flow0.subarray(sk.start, Math.min(baseptr, flow0.length));
    for (let i = 0; i < sk.fragcnt && fragptr < fragtbl.length; i++) {
      const frag = fragtbl[fragptr];
      const sliceEnd = Math.min(baseptr + frag.length, flow0.length);
      const slice = flow0.subarray(Math.min(baseptr, flow0.length), sliceEnd);
      let insertpos = frag.insertpos - sk.start;
      if (insertpos < 0) insertpos = 0;
      if (insertpos > skeleton.length) insertpos = skeleton.length;
      const head = skeleton.subarray(0, insertpos);
      const tail = skeleton.subarray(insertpos);
      skeleton = concatBytes(head, slice, tail);
      baseptr += frag.length;
      fragptr++;
    }
    parts.push(skeleton);
    partinfo.push({ skelnum, start: sk.start, end: baseptr });
  }
  return { parts, partinfo };
}

function findPartForPos(partinfo, pos) {
  for (const pi of partinfo) {
    if (pos >= pi.start && pos < pi.end) return pi.skelnum;
  }
  return null;
}

/* ---------- 资源（图片） ---------- */

function extractImages(sections, firstResource) {
  const images = [];
  if (firstResource === 0xffffffff) return images;
  let i = firstResource;
  while (i < sections.length) {
    const rec = sections[i];
    if (!rec || rec.length === 0) break;
    const mime = detectImageMime(rec);
    if (!mime) break;
    images.push({ index: images.length + 1, mime, data: rec });
    i++;
  }
  return images;
}

/* ---------- HTML 后处理：图片引用 / aid / 站内链接 ---------- */

function rewriteImages(html, images, onUnresolved) {
  return html.replace(/<img\b[^>]*>/gi, (tag) => {
    let idx = null;
    let m = tag.match(/\bsrc\s*=\s*["']kindle:embed:([0-9A-Za-z]+)[^"']*["']/i);
    if (m) idx = parseInt(m[1], 32);
    else {
      m = tag.match(/\brecindex\s*=\s*["']?0*(\d+)["']?/i);
      if (m) idx = parseInt(m[1], 10);
    }
    if (idx == null || Number.isNaN(idx)) { onUnresolved(); return ''; }
    const img = images[idx - 1];
    if (!img) { onUnresolved(); return ''; }
    let altM = tag.match(/\balt\s*=\s*("([^"]*)"|'([^']*)')/i);
    const alt = altM ? (altM[2] ?? altM[3] ?? '') : '';
    return `<img src="${img.href}" alt="${alt.replace(/"/g, '&quot;')}" />`;
  });
}

function rewriteAid(html) {
  return html.replace(/\said\s*=\s*("([^"]*)"|'([^']*)')/gi, (m, _q, d, s) => {
    const val = d ?? s ?? '';
    return ` id="aid-${val}"`;
  });
}

function rewriteInternalLinks(html, fragtbl, partinfo, chapterIds) {
  return html.replace(/href\s*=\s*("kindle:pos:fid:([0-9A-Za-z]+):off:([0-9A-Za-z]+)[^"]*"|'kindle:pos:fid:([0-9A-Za-z]+):off:([0-9A-Za-z]+)[^']*')/gi,
    (m, _whole, dPos, dOff, sPos, sOff) => {
      const posfid = dPos ?? sPos;
      const offset = dOff ?? sOff;
      const row = parseInt(posfid, 32);
      const off = parseInt(offset, 32);
      const frag = fragtbl[row];
      if (!frag) return 'href="#"';
      const pos = frag.insertpos + off;
      const partIdx = findPartForPos(partinfo, pos);
      if (partIdx == null || !chapterIds[partIdx]) return 'href="#"';
      return `href="#${chapterIds[partIdx]}"`;
    });
}

function extractTitle(html) {
  const m = html.match(/<h[1-6][^>]*>([\s\S]*?)<\/h[1-6]>/i);
  if (!m) return null;
  const t = plainText(m[1]).trim();
  return t || null;
}

/* ---------- locale -> BCP47 ---------- */

function mapLocale(code) {
  const langId = code & 0xff;
  if (langId === 4) {
    const sub = (code >>> 10) & 0xff;
    return sub === 1 || sub === 3 ? 'zh-Hant' : 'zh-Hans';
  }
  const map = {
    9: 'en', 17: 'ja', 18: 'ko', 25: 'ru', 1: 'ar', 2: 'bg', 3: 'ca', 5: 'cs',
    6: 'da', 7: 'de', 8: 'el', 10: 'es', 11: 'fi', 12: 'fr', 13: 'he', 14: 'hu',
    15: 'is', 16: 'it', 19: 'nl', 20: 'no', 21: 'pl', 22: 'pt', 23: 'rm', 24: 'ro',
    27: 'sk', 28: 'sq', 29: 'sv', 30: 'th', 31: 'tr', 32: 'ur', 33: 'id', 34: 'uk',
    36: 'sl', 37: 'et', 38: 'lv', 39: 'lt', 42: 'vi',
  };
  return map[langId] || 'zh-Hans';
}

/* ---------- 主流程 ---------- */

async function readImpl(buf, opts) {
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  if (bytes.length < 78) fail('这似乎不是有效的 AZW3 文件。');
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

  const { sections, name: pdbName } = parsePDB(bytes, view);
  await tick();

  let header = parseMobiHeader(sections[0], 0);
  if (!header) fail('这个文件的头部结构无法识别，可能不是标准的 AZW3/MOBI 文件。');

  checkDrm(header);

  let isK8 = header.version >= 8;
  const warnings = [];
  if (!isK8) {
    const boundaryTag = header.exth.tags[121];
    if (boundaryTag && boundaryTag[0].length >= 4) {
      const bv = new DataView(boundaryTag[0].buffer, boundaryTag[0].byteOffset, boundaryTag[0].byteLength);
      const boundaryRec = bv.getUint32(0);
      const altRec = boundaryRec + 1;
      if (sections[altRec]) {
        const alt = parseMobiHeader(sections[altRec], altRec);
        if (alt && alt.version >= 8) {
          checkDrm(alt);
          header = alt;
          isK8 = true;
          warnings.push({ code: 'azw3.combo', detail: '检测到新旧双格式合并文件，已只提取新版（KF8）排版内容。' });
        }
      }
    }
  }
  if (!isK8) {
    fail('这个文件是较旧的 MOBI6 电子书，不是 KF8/AZW3 格式，暂不支持；可以用 Calibre 转换成 EPUB 后再试。');
  }

  if (header.compressionType === 0x4448) {
    fail('这本 AZW3 使用了少见的 HUFF/CDIC 压缩方式，暂不支持解析；可以用 Calibre 转换成 EPUB 后再试。');
  }
  if (header.compressionType !== 1 && header.compressionType !== 2) {
    fail('无法识别这本 AZW3 的正文压缩格式。');
  }

  const rawML = buildRawML(sections, header);
  await tick();
  if (!rawML.length) fail('这本 AZW3 没有可提取的正文内容。');

  const fdsttbl = parseFDST(sections, header.fdst, rawML.length);
  const flow0 = rawML.subarray(fdsttbl[0], Math.min(fdsttbl[1], rawML.length));

  const skeltbl = parseSkeletonIndex(sections, header.skelidx);
  const fragtbl = parseFragmentIndexReal(sections, header.fragidx);
  if (!skeltbl.length) fail('无法解析这本 AZW3 的章节结构索引（skeleton index 缺失或损坏）。');

  const { parts, partinfo } = buildParts(flow0, skeltbl, fragtbl);
  await tick();

  const images = extractImages(sections, header.firstResource);

  const meta = buildMeta(header, pdbName, opts);
  const book = newBook(meta);
  for (const w of warnings) warn(book, w.code, w.detail);

  for (const img of images) {
    const rid = `img${String(img.index).padStart(3, '0')}`;
    const href = `images/${rid}.${extFor(img.mime)}`;
    book.resources.set(rid, { href, mime: img.mime, data: img.data.slice() });
    img.href = href;
    img.rid = rid;
  }

  const chapterIds = parts.map((_, i) => `c${i + 1}`);
  let unresolvedImages = false;
  for (let i = 0; i < parts.length; i++) {
    let html = decodeText(parts[i], header.textEncoding);
    html = rewriteImages(html, images, () => { unresolvedImages = true; });
    html = rewriteAid(html);
    html = rewriteInternalLinks(html, fragtbl, partinfo, chapterIds);
    html = sanitizeHtml(html);
    const title = extractTitle(html);
    book.chapters.push({ id: chapterIds[i], title, level: 1, html });
    if (i % 20 === 0) await tick();
  }
  if (unresolvedImages) warn(book, 'azw3.image-unresolved', '部分插图引用未能解析，对应位置已省略。');

  const ncxEntries = parseNCXIndex(sections, header.ncxidx, header.textEncoding);
  if (ncxEntries.length) {
    book.nav = buildNavTree(ncxEntries, fragtbl, partinfo, chapterIds);
  } else {
    warn(book, 'azw3.no-nav', '未找到目录索引，已按章节顺序生成平铺目录。');
    book.nav = chapterIds.map((id, i) => ({
      title: book.chapters[i].title || `第 ${i + 1} 部分`,
      target: id, anchor: null, level: 1, children: [],
    }));
  }

  const coverTag = header.exth.tags[201];
  if (coverTag && coverTag[0].length >= 4 && header.firstResource !== 0xffffffff) {
    const cv = new DataView(coverTag[0].buffer, coverTag[0].byteOffset, coverTag[0].byteLength);
    const off = cv.getUint32(0);
    const img = images[off];
    if (img) book.cover = img.rid;
  }

  const v = validate(book);
  if (!v.ok) fail('这本 AZW3 解析后的结构没有通过内部校验，可能使用了本工具暂不支持的排版方式。');
  return book;
}

function checkDrm(header) {
  const hasDrm = header.encryptionType !== 0 ||
    (header.drmOffset !== 0xffffffff && header.drmCount !== 0xffffffff && header.drmCount > 0);
  if (hasDrm) fail('这本书带有版权保护，无法处理。');
}

function buildRawML(sections, header) {
  const applyTrailers = header.headerLength >= 0xe4 && header.version >= 5;
  const { trailers, multibyte } = applyTrailers ? countTrailers(header.traildataFlags) : { trailers: 0, multibyte: 0 };
  const pieces = [];
  for (let i = 1; i <= header.textRecordCount; i++) {
    let data = sections[header.recIndex + i];
    if (!data) break;
    data = trimTrailingEntries(data, trailers, multibyte);
    pieces.push(header.compressionType === 2 ? palmDocDecompress(data) : Uint8Array.from(data));
  }
  return concatBytes(...pieces);
}

/** fragment index 逐条读取：insertpos（切入位置）+ ctoc 里的 aid 文本 + filenum/seqnum + [start,length] */
function parseFragmentIndexReal(sections, idx) {
  const { outtbl, ctocText } = getIndexData(sections, idx);
  return outtbl.map(([textBytes, tagMap]) => ({
    insertpos: parseInt(asciiStr(textBytes), 10) || 0,
    aid: tagMap[2] && ctocText[tagMap[2][0]] ? asciiStr(ctocText[tagMap[2][0]]) : '',
    filenum: tagMap[3] ? tagMap[3][0] : 0,
    seqnum: tagMap[4] ? tagMap[4][0] : 0,
    start: tagMap[6] ? tagMap[6][0] : 0,
    length: tagMap[6] ? tagMap[6][1] : 0,
  }));
}

function parseNCXIndex(sections, ncxidx, textEncoding) {
  const { outtbl, ctocText } = getIndexData(sections, ncxidx);
  return outtbl.map(([, tagMap]) => {
    const e = { hlvl: 0, text: '', posFidRow: null, posFidOff: 0 };
    if (tagMap[4]) e.hlvl = tagMap[4][0];
    if (tagMap[3] && ctocText[tagMap[3][0]]) e.text = decodeText(ctocText[tagMap[3][0]], textEncoding);
    if (tagMap[6]) { e.posFidRow = tagMap[6][0]; e.posFidOff = tagMap[6][1] ?? 0; }
    return e;
  });
}

function buildNavTree(entries, fragtbl, partinfo, chapterIds) {
  const nodes = entries.map((e) => {
    const level = Math.min(Math.max((e.hlvl || 0) + 1, 1), 3);
    let target = chapterIds[0] || null;
    if (e.posFidRow != null) {
      const frag = fragtbl[e.posFidRow];
      if (frag) {
        const pos = frag.insertpos + e.posFidOff;
        const partIdx = findPartForPos(partinfo, pos);
        if (partIdx != null && chapterIds[partIdx]) target = chapterIds[partIdx];
      }
    }
    return { title: e.text || '', target, anchor: null, level, children: [], _lvl: level };
  }).filter((n) => n.target);

  const root = [];
  const stack = [];
  for (const n of nodes) {
    while (stack.length && stack[stack.length - 1]._lvl >= n._lvl) stack.pop();
    const parentArr = stack.length ? stack[stack.length - 1].children : root;
    parentArr.push(n);
    stack.push(n);
  }
  const strip = (arr) => { for (const n of arr) { delete n._lvl; strip(n.children); } };
  strip(root);
  return root;
}

function buildMeta(header, pdbName, opts) {
  const decodeStr = (bytes) => decodeText(bytes, header.textEncoding);
  const exthStr = (id) => (header.exth.tags[id] ? decodeStr(header.exth.tags[id][0]).replace(/\u0000+$/, '').trim() : null);

  const updatedTitle = exthStr(503);
  const title = updatedTitle || header.title || pdbName || (opts && opts.filename) || undefined;

  const authors = (header.exth.tags[100] || []).map((b) => decodeStr(b).trim()).filter(Boolean);
  const author = authors.length ? authors.join('、') : null;

  const publisher = exthStr(101) || null;
  const descRaw = exthStr(103);
  const description = descRaw ? plainText(sanitizeHtml(descRaw)) || null : null;
  const dateRaw = exthStr(106);
  const date = normalizeDate(dateRaw);
  const asin = exthStr(113);
  const identifier = asin ? `urn:mobi:asin:${asin}` : undefined;
  const language = mapLocale(header.locale);

  return { title, author, language, identifier, publisher, date, description };
}

function normalizeDate(raw) {
  if (!raw) return null;
  const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  const y = raw.match(/^(\d{4})/);
  if (y) return `${y[1]}-01-01`;
  return null;
}

return { read };
})();

/* ==== src/readers/pdf.js ==== */
SJ.readers.pdf = (function () {
'use strict';
/* ============================================================
 * src/readers/pdf.js · PDF（文本版）→ Book IR
 *
 * 分级：C —— 仅承诺"正确顺序的文字流 + 合并被换行切断的段落 +
 * 按明显空行/大间距（退而按固定页数）断章"。不承诺章节标题、不承诺
 * 目录层级、不承诺图片/脚注。分栏、表格、图注混排出错是格式固有损失。
 *
 * 依赖：pdf.js（UMD）。本模块不自己加载脚本，只消费已经存在的
 * pdfjsLib —— 优先 opts.pdfjsLib 注入，否则用 globalThis.pdfjsLib。
 * 产品集成层负责从 CDN 加载 pdf.min.js / pdf.worker.min.js 并配置
 * GlobalWorkerOptions；Node 测试环境下把两个 vendor 文件都 eval 进
 * globalThis 即可（pdf.worker.min.js 会设置 globalThis.pdfjsWorker，
 * pdf.js 检测到它就直接走"假 worker"主线程路径，不需要配置
 * workerSrc）。
 *
 * 核心流程：
 *   1. getDocument() 打开文档，捕获加密 / 非法 PDF。
 *   2. 逐页 getTextContent()，按 y 坐标聚类成"行"、按 x 坐标排序
 *      拼接行内文字（大间隙补一个空格）。
 *   3. 把全书所有行按页序拼接，用两级间距阈值判断"正常换行"
 *      "空一行的段落间隔""大间距的疑似章节分隔"，加上"下一行是否
 *      缩进"来决定段落边界；换行合并时中文直接相连、西文补空格。
 *   4. 全书没有任何"大间距分隔"信号时，退化为固定页数分块。
 *   5. 全文可提取字符数低于阈值 → 判定为扫描版，人话报错并中止。
 *
 * 已知限制（写入 ResultReport，不在此重复展开）：
 *   - 不抽取图片/资源（BOOK-IR 允许 pdf reader 缺 resources）。
 *   - 不做标题识别，chapter.title 恒为 null（C 档允许）。
 *   - 段落断行只用"首行缩进"作为断段信号，不用行尾标点单独断段——
 *     否则会把多句一段的正常段落拆成逐句一段，比不拆更糟。
 * ============================================================ */

const { newBook, warn } = SJ.ir;

/* ---------- 经验常数（未在大规模真实 PDF 语料上标定，见 limits） ---------- */

const MIN_DOC_CHARS = 20;         // 全书可提取字符数低于此判定为扫描版
const LINE_HEIGHT_FACTOR = 1.3;   // 正常单倍行距 ≈ 1.3 × 字号
const PARA_GAP_FACTOR = 1.8;      // 行距 ≥ 1.8×(单倍行距) 视为空了一行：断段
const CHAPTER_GAP_FACTOR = 3.2;   // 行距 ≥ 3.2×(单倍行距) 视为大间距：断章
const SPACE_GAP_FACTOR = 0.25;    // 同行内两个文字片段水平间隙 > 0.25×字号 补空格
const INDENT_FACTOR = 1.2;        // 行首 x 比本页最左边界多出 1.2×字号 视为缩进
const PAGES_PER_CHAPTER = 20;     // 全书无大间距信号时，兜底按此页数切章
const YIELD_EVERY_PAGES = 5;      // 每处理 N 页让出一次主线程

const CJK_RE = /[㐀-鿿豈-﫿぀-ヿㇰ-ㇿ가-힯]/;

function tick() {
  return new Promise((resolve) => setTimeout(resolve, 0));
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/** 中文直接相连、西文之间补一个空格；已有空白就不重复加 */
function joinText(a, b) {
  if (!a) return b;
  if (!b) return a;
  const lastChar = a[a.length - 1];
  const firstChar = b[0];
  if (/\s/.test(lastChar) || /\s/.test(firstChar)) return a + b;
  if (CJK_RE.test(lastChar) || CJK_RE.test(firstChar)) return a + b;
  return `${a} ${b}`;
}

/**
 * 把 pdf.js 一页的 getTextContent().items 重排成"行"：
 * 按 y 坐标聚类（容差与字号相关），聚类内按 x 坐标排序后拼接文字。
 * @returns {Array<{text:string, x0:number, y:number, fontSize:number}>}
 */
function buildLines(items) {
  const enriched = [];
  for (const it of items) {
    if (!it.str || !it.str.trim()) continue;
    const fontSize = Math.abs(it.transform[3]) || it.height || 10;
    enriched.push({ str: it.str, x: it.transform[4], y: it.transform[5], width: it.width || 0, fontSize });
  }
  if (!enriched.length) return [];

  // 先按 y 降序（PDF 坐标系 y 向上增长，越大越靠页面顶部），x 升序打底
  enriched.sort((a, b) => (b.y - a.y) || (a.x - b.x));

  const rows = [];
  for (const it of enriched) {
    const last = rows[rows.length - 1];
    const eps = Math.max(2, 0.5 * it.fontSize);
    if (last && Math.abs(last.y - it.y) <= eps) last.items.push(it);
    else rows.push({ y: it.y, items: [it] });
  }

  const lines = [];
  for (const row of rows) {
    row.items.sort((a, b) => a.x - b.x);
    let text = '';
    let prevRight = null;
    let maxFont = 0;
    for (const it of row.items) {
      maxFont = Math.max(maxFont, it.fontSize);
      if (prevRight != null && it.x - prevRight > SPACE_GAP_FACTOR * it.fontSize) {
        text = joinText(text, it.str);
      } else {
        text += it.str;
      }
      prevRight = it.x + it.width;
    }
    text = text.trim();
    if (text) lines.push({ text, x0: row.items[0].x, y: row.y, fontSize: maxFont });
  }
  return lines;
}

/** 是否判定为"这本 PDF 没有可用文字层"（扫描版等） */
function scannedError() {
  const err = new Error('这本 PDF 是扫描图片，里面没有可提取的文字');
  err.code = 'pdf.scanned';
  return err;
}

async function read(buf, opts = {}) {
  const pdfjsLib = opts.pdfjsLib || globalThis.pdfjsLib;
  if (!pdfjsLib) {
    throw new Error('PDF 解析组件尚未加载，刷新页面后再试一次');
  }

  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);

  let doc;
  try {
    doc = await pdfjsLib.getDocument({
      data: bytes,
      verbosity: pdfjsLib.VerbosityLevel ? pdfjsLib.VerbosityLevel.ERRORS : 0,
    }).promise;
  } catch (e) {
    if (e && e.name === 'PasswordException') {
      const err = new Error('这本书带有版权保护，无法处理');
      err.code = 'pdf.encrypted';
      throw err;
    }
    throw new Error('这似乎不是有效的 PDF 文件');
  }

  try {
    // ---- 元数据（尽力而为，取不到就用默认值） ----
    let title = null;
    let author = null;
    try {
      const md = await doc.getMetadata();
      if (md && md.info) {
        if (md.info.Title) title = String(md.info.Title).trim() || null;
        if (md.info.Author) author = String(md.info.Author).trim() || null;
      }
    } catch { /* 元数据缺失或损坏不影响正文抽取 */ }
    if (!title && opts.filename) {
      const base = String(opts.filename).replace(/\\/g, '/').split('/').pop() || '';
      title = base.replace(/\.[^.]+$/, '') || null;
    }

    const book = newBook({ title, author });

    // ---- 逐页抽取文字，重排成行 ----
    const numPages = doc.numPages;
    const allLines = [];
    for (let p = 1; p <= numPages; p++) {
      try {
        const page = await doc.getPage(p);
        const tc = await page.getTextContent();
        for (const l of buildLines(tc.items)) allLines.push({ ...l, page: p });
      } catch {
        // 单页解析失败不阻断全书，跳过该页（其余页仍尽量抽取）
      }
      if (p % YIELD_EVERY_PAGES === 0) await tick();
    }

    const totalChars = allLines.reduce((s, l) => s + l.text.replace(/\s+/g, '').length, 0);
    if (totalChars < MIN_DOC_CHARS) throw scannedError();

    // ---- 每页左边界（判断首行缩进用） ----
    const leftMargin = new Map();
    for (const l of allLines) {
      const cur = leftMargin.get(l.page);
      if (cur === undefined || l.x0 < cur) leftMargin.set(l.page, l.x0);
    }
    const isIndented = (l) => l.x0 - (leftMargin.get(l.page) ?? l.x0) > INDENT_FACTOR * l.fontSize;

    // ---- 合并成段落，同时标记"这一段前面是否有大间距（疑似章节分隔）" ----
    const paragraphs = [];
    let curText = '';
    let curPage = allLines.length ? allLines[0].page : 1;
    let curChapterBreak = false;
    let usedGapChapterBreak = false;

    const flush = (nextChapterBreak) => {
      if (curText) paragraphs.push({ text: curText, page: curPage, chapterBreak: curChapterBreak });
      curText = '';
      curChapterBreak = nextChapterBreak;
    };

    for (let i = 0; i < allLines.length; i++) {
      const line = allLines[i];
      if (i === 0) { curText = line.text; curPage = line.page; continue; }
      const prev = allLines[i - 1];

      let breakPara = false;
      let breakChapter = false;
      if (prev.page === line.page) {
        const advance = Math.max(prev.fontSize, line.fontSize) * LINE_HEIGHT_FACTOR;
        const gap = prev.y - line.y;
        if (gap >= advance * CHAPTER_GAP_FACTOR) { breakPara = true; breakChapter = true; }
        else if (gap >= advance * PARA_GAP_FACTOR) { breakPara = true; }
        else { breakPara = isIndented(line); }
      } else {
        // 跨页：没有可比的行距，只用缩进判断是否为新段落
        breakPara = isIndented(line);
      }

      if (breakPara) {
        flush(breakChapter);
        curText = line.text;
        curPage = line.page;
        if (breakChapter) usedGapChapterBreak = true;
      } else {
        curText = joinText(curText, line.text);
      }
    }
    flush(false);

    if (!paragraphs.length) throw scannedError();

    // ---- 分章：优先用检测到的大间距；全书没有信号时按固定页数兜底 ----
    let chapterGroups = [];
    if (usedGapChapterBreak) {
      let cur = null;
      for (const para of paragraphs) {
        if (!cur || para.chapterBreak) { cur = []; chapterGroups.push(cur); }
        cur.push(para);
      }
    } else {
      let cur = null;
      let curBucket = null;
      for (const para of paragraphs) {
        const bucket = Math.floor((para.page - 1) / PAGES_PER_CHAPTER);
        if (!cur || bucket !== curBucket) { cur = []; chapterGroups.push(cur); curBucket = bucket; }
        cur.push(para);
      }
      if (chapterGroups.length > 1) {
        warn(book, 'pdf.paged-chapters', '全书没有检测到明显的分段空白，按固定页数切分章节，可能与原书章节不一致');
      }
    }

    book.chapters = chapterGroups.map((paras, idx) => ({
      id: `pdf-ch-${idx + 1}`,
      title: null,
      level: 1,
      html: paras.map((p) => `<p>${escapeHtml(p.text)}</p>`).join(''),
    }));

    book.nav = book.chapters.map((c, idx) => ({
      title: `第 ${chapterGroups[idx][0].page} 页起`,
      target: c.id,
      anchor: null,
      level: 1,
      children: [],
    }));

    warn(book, 'pdf.no-structure', 'PDF 不含章节标题等结构信息，章节按页面空白或固定页数粗略切分，可能与原书目录不一致');
    warn(book, 'pdf.flat-nav', 'PDF 无法提取真实目录层级，导航按页码位置平铺生成，没有层级');

    return book;
  } finally {
    try { await doc.destroy(); } catch { /* 忽略清理失败 */ }
  }
}

return { read };
})();

'use strict';
/* ============================================================
 * src/writers/epub.js · Book IR → EPUB 3

 *   1. 章节正文里的 <hN>{title}</hN> 改为"缺才补"，不再无条件注入。
 *      根因排查：epub reader 认标题的唯一途径是扫正文开头的 <h1>-<h6>（试过 <title>
 *      标签、nav.xhtml 链接文本都不认，黑盒实测确认），且它是逐字保留 html 的——
 *      读到什么就是什么，不会把标题摘出 html。所以：
 *        - epub 源书：html 里本来就带着与 title 相同的标题标签，旧实现无条件再注入
 *          一次 → 标题出现两次，回读字数被算重复、标题也不再是"当前实现唯一还原"。
 *        - md/txt 源书：它们的 reader 约定"标题不进 html"，回读时若完全不注入标题，

 *          标题序列这项硬性（0 容差）比对失败，比字数超出 ±0.5% 容差更严重。
 *      两害相权：`bodyHasMatchingTitleHeading()` 检测正文里第一个 <hN> 是否已是与

 *      md/txt 源书回读标题不丢）。副作用：md/sample.md 这类"标题本不进 html"的源书，
 *      回读字数会比它自己 reader 的原生统计多出标题的字数，超出该样本 expected.json
 *      按"标题不算正文"口径定的 ±0.5% —— 这不是本文件能单方面解决的，已在
 *      ResultReport 里作为 needs_human 提给 Orchestrator（建议重新核定该样本的
 *      chars 基准，把标题计入，与 epub 源书样本的口径一致）。
 *   2. 不再把资源/自身文档统一挂在写死的 "OEBPS/" 目录下。
 *      根因：resources[].href 是 reader 给的、已经"扁平化"过的 zip 内绝对路径
 *      （例如某些源书内部就是 "OEBPS/images/x.png"），旧实现又在外面套一层
 *      "OEBPS/" 前缀，拼出 "OEBPS/OEBPS/images/x.png"，实际存入 zip 的路径和
 *      章节 html 里 <img src="OEBPS/images/x.png"> 引用的路径对不上。

 *      href="#…">（reader 读进 IR 时才转写成 IR 的 class="noteref" 形式）。
 *      旧实现把所有 notes 攒成单独一个 notes.xhtml 并塞进 spine，epub reader
 *      于是把它当成第 4 "章"，跨文件的 noteref 链接被当成普通章节间引用改写，

 *   重复 <h1>。修法：比对前先剥 <rt>…</rt> / <rp>…</rp>（连内容一起），再剥其余标签

 *
 * 导出契约（Orchestrator 仲裁，2026-07-20）：
 *   write(book, opts, onProgress) -> Uint8Array（不是 Blob）。
 *   原因：Node 环境下 `new Uint8Array(blob)` 会静默解出空数组，
 *   下载用的 Blob 由 UI 集成层按需包一层 `new Blob([bytes], {type:...})`。

 *   所有变形（sanitize、id 改写、href 改写、note 归并）都在本地新字符串/新
 *   Map 上进行。
 * ============================================================ */

const { sanitizeHtml } = SJ.ir;

const tick = () => new Promise((resolve) => setTimeout(resolve, 0));

/* ---------- XML / URI 小工具 ---------- */

function escText(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
/** zip 条目名保留字面 UTF-8；引用它的 href 按段 percent-encode（RFC 3986） */
function encodeHrefPath(path) {
  return String(path).split('/').map(encodeURIComponent).join('/');
}

/** 生成 XML NCName 安全、全书唯一、可复现（同一 raw 值永远映射到同一结果）的 id */
function makeIdSanitizer() {
  const cache = new Map();
  const used = new Set();
  return function safeId(raw) {
    const key = String(raw);
    if (cache.has(key)) return cache.get(key);
    let s = key.normalize ? key.normalize('NFC') : key;
    // NCName 允许的字符集（含 CJK）；其余一律替换为连字符
    s = s.replace(/[^\p{L}\p{N}_.-]/gu, '-').replace(/-{2,}/g, '-').replace(/^[-.]+|[-.]+$/g, '');
    if (!s) s = 'id';
    if (/^[0-9]/.test(s)) s = 'id-' + s; // NCName 不能以数字开头
    let candidate = s, n = 2;
    while (used.has(candidate)) candidate = `${s}-${n++}`;
    used.add(candidate);
    cache.set(key, candidate);
    return candidate;
  };
}

/** 章节标题 → 文件名基底，剥掉文件系统/zip 路径不安全字符 */
function slugifyFileBase(title, fallback) {
  let s = String(title || '').trim();
  s = s.replace(/[\\/:*?"<>|\x00-\x1F]/g, '');
  s = s.replace(/\s+/g, '-').replace(/-{2,}/g, '-');
  s = s.slice(0, 60).replace(/^-+|-+$/g, '');
  return s || fallback;
}

function tocLabelFor(lang) {
  const zh = /^zh/i.test(lang || '');
  const ja = /^ja/i.test(lang || '');
  return zh ? '目录' : ja ? '目次' : 'Contents';
}

function navDepth(nav) {
  let max = 0;
  const walk = (list, d) => { for (const n of list || []) { max = Math.max(max, d); walk(n.children, d + 1); } };
  walk(nav, 1);
  return max || 1;
}

/** 正文里 epub reader 会当成章节标题的那个标题（正文中*第一个* <hN>）是否与 title
 * 文字相同——相同就说明标题已在正文内，writer 无需再补注入（否则回读会重复）。
 *
 * 必须与 src/readers/epub.js 的 extractFirstHeading 对称：reader 认的是正文里
 * *第一个* <h1>-<h6>（出现在任意位置，不要求在开头），并不在意它前面还裹着什么。
 *
 * 第 4 轮修复（writer_epub_04，真实源书 read→write→read 暴露）：本函数原先只认
 * "开头"（`^\s*<hN>`）的标题标签，漏判了"标题前面还裹着封面图 <div> / 外层 <div>"
 * 这类正文——reader 仍从内部的 <hN> 取到 title，writer 却因不在开头判成"标题缺失"
 * 又注入一个 <hN>，回读时正文里就有了两个相同标题（displayText 变长）。
 *   实测：testBook/出發 (韓寒).epub 纯 read→write→read，displayText 120443→121633，
 *   根因即首章 `<div><div class=cover>…</div><h1>出發</h1>…`、目次章 `<div><h3>目次</h3>`
 *   的标题都不在开头，被重复注入。改为"匹配正文中第一个 <hN>"即与 reader 对称。
 *
 * 第 3 轮修复（D1）：比对前先剥掉 <rt>/<rp>（连同内部内容）再剥其余标签。
 * 根因：furigana transform 会把标题标签标注成
 *   <h1><ruby>第<rt>だい</rt></ruby><ruby>一<rt>いち</rt></ruby>章<ruby>...<rt>...</rt></ruby></h1>
 * 这类形态——旧实现只剥"标签本身"（`<[^>]+>` 只吃掉尖括号定界的标签，吃不掉
 * <rt>…</rt> 里的读音*内容*，那是普通文本节点），于是拿"第だい一いち章しょう"
 * 去跟纯文本 title「第一章」比较，永远判不相等，导致已注音的标题前又被注入一个
 * 未注音的重复 <hN>。<rt>/<rp> 在 sanitizeHtml 之后保证良构、不自嵌套，
 * 用非贪婪正则整段剥除（连内容一起）是安全的；多个 <ruby> 并列（逐字/逐词标注）
 * 时正则会依次剥掉每一段，不受影响。 */
function bodyHasMatchingTitleHeading(html, title) {
  if (title == null) return false;
  const m = /<h[1-6]\b[^>]*>([\s\S]*?)<\/h[1-6]>/i.exec(html || '');
  if (!m) return false;
  const withoutReadings = m[1]
    .replace(/<rt\b[^>]*>[\s\S]*?<\/rt>/gi, '')
    .replace(/<rp\b[^>]*>[\s\S]*?<\/rp>/gi, '');
  const text = withoutReadings.replace(/<[^>]+>/g, '').trim().replace(/\s+/g, ' ');
  const norm = String(title).trim().replace(/\s+/g, ' ');
  return text === norm;
}

/** 章节正文（已 sanitize）里所有 class 含 noteref 的 <a href="#X">，返回引用到的原始 id 列表 */
function findNoterefIds(html) {
  const ids = [];
  const tagRe = /<a\b([^>]*)>/gi;
  let m;
  while ((m = tagRe.exec(html))) {
    const attrs = m[1];
    if (!/\bclass="[^"]*\bnoteref\b[^"]*"/.test(attrs)) continue;
    const hrefM = attrs.match(/\bhref="#([^"]*)"/);
    if (hrefM) ids.push(hrefM[1]);
  }
  return ids;
}

const CONTAINER_XML =
`<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
  <rootfiles>
    <rootfile full-path="content.opf" media-type="application/oebps-package+xml" />
  </rootfiles>
</container>
`;

const STYLE_CSS =
`html, body { margin: 0; padding: 0; }
body { line-height: 1.7; }
body.vertical-rl {
  writing-mode: vertical-rl;
  -epub-writing-mode: vertical-rl;
  -webkit-writing-mode: vertical-rl;
  text-orientation: mixed;
}
img { max-width: 100%; }
section.chapter { }
ruby rt { font-size: 0.6em; }
aside[epub|type~="footnote"] { font-size: 0.92em; }
nav[epub|type~="toc"] ol { list-style: none; padding-left: 1em; }
`;

/**
 * Book IR → EPUB 3 二进制。
 * @param {import('../ir.js').Book} book  只读，不会被修改
 * @param {object} [opts]
 * @param {(p:number)=>void} [onProgress]
 * @returns {Promise<Uint8Array>}
 */
async function write(book, opts = {}, onProgress = () => {}) {
  if (typeof globalThis.JSZip === 'undefined') {
    throw new Error('JSZip 未加载，无法生成 EPUB');
  }
  const chapters = Array.isArray(book.chapters) ? book.chapters : [];
  if (!chapters.length) throw new Error('book.chapters 为空，无法生成 EPUB');

  const meta = book.meta || {};
  const language = meta.language || 'zh-Hans';
  const vertical = meta.writingMode === 'vertical-rl';
  const resources = book.resources instanceof Map ? book.resources : new Map();
  const notes = book.notes instanceof Map ? book.notes : new Map();

  onProgress(0);

  const safeId = makeIdSanitizer();

  /* ---------- 1. 章节文件名分配（标题 slug，非 ASCII 也可，唯一化） ---------- */
  const reserved = new Set(['content.opf', 'nav.xhtml', 'toc.ncx', 'style.css']);
  const chapterFile = new Map(); // ChapterId -> 文件名
  chapters.forEach((ch, i) => {
    const fallback = `chapter-${String(i + 1).padStart(4, '0')}`;
    const base = slugifyFileBase(ch.title, fallback);
    let name = `${base}.xhtml`, n = 2;
    while (reserved.has(name.toLowerCase())) { name = `${base}-${n++}.xhtml`; }
    reserved.add(name.toLowerCase());
    chapterFile.set(ch.id, name);
  });

  /* ---------- 2. 章节起始锚点 + 交叉引用目标索引 ---------- */
  const chapterFrag = new Map(); // ChapterId -> 安全 fragment id（同时是该章 <section id>）
  chapters.forEach((ch) => chapterFrag.set(ch.id, safeId(ch.id)));

  const targetIndex = new Map(); // 原始 id 字符串（ChapterId 或章内 id）-> {file, frag}
  chapters.forEach((ch) => {
    targetIndex.set(ch.id, { file: chapterFile.get(ch.id), frag: chapterFrag.get(ch.id) });
  });

  const sanitized = new Map(); // ChapterId -> sanitizeHtml 后的正文（改写前）
  chapters.forEach((ch) => sanitized.set(ch.id, sanitizeHtml(ch.html || '')));

  chapters.forEach((ch) => {
    const html = sanitized.get(ch.id);
    const re = /\bid="([^"]*)"/g;
    let m;
    while ((m = re.exec(html))) {
      const raw = m[1];
      if (!targetIndex.has(raw)) {
        targetIndex.set(raw, { file: chapterFile.get(ch.id), frag: safeId(raw) });
      }
    }
  });

  /* ---------- 2b. notes 归并：每条 note 挂到"第一个引用它的章节"，孤儿挂最后一章 ---------- */
  const noteFrag = new Map(); // NoteId -> 安全 fragment id
  for (const nid of notes.keys()) noteFrag.set(nid, safeId(nid));

  const noteOwnerFile = new Map(); // NoteId -> 该 note 内嵌所在的章节文件名
  chapters.forEach((ch) => {
    const html = sanitized.get(ch.id);
    for (const nid of findNoterefIds(html)) {
      if (noteFrag.has(nid) && !noteOwnerFile.has(nid)) {
        noteOwnerFile.set(nid, chapterFile.get(ch.id));
      }
    }
  });
  if (noteFrag.size) {
    const lastFile = chapterFile.get(chapters[chapters.length - 1].id);
    for (const nid of noteFrag.keys()) {
      if (!noteOwnerFile.has(nid)) noteOwnerFile.set(nid, lastFile); // 孤儿 note（无人引用）
    }
  }

  /**
   * 解析正文里的内部 #href：优先当作 note 引用（落到 note 所在章节文档），
   * 否则按章节/章内锚点解析。返回 null 表示无法解析（按 IR 约定不应发生）。
   */
  function resolveFragment(rawId, fromFile) {
    if (noteFrag.has(rawId)) {
      const ownerFile = noteOwnerFile.get(rawId);
      const frag = noteFrag.get(rawId);
      const href = ownerFile === fromFile ? `#${frag}` : `${encodeHrefPath(ownerFile)}#${frag}`;
      return { href, isNote: true };
    }
    const t = targetIndex.get(rawId);
    if (t) {
      const href = t.file === fromFile ? `#${t.frag}` : `${encodeHrefPath(t.file)}#${t.frag}`;
      return { href, isNote: false };
    }
    return null;
  }

  /** 改写一段已 sanitize 的正文：id 归一化 + img[src] 编码 + 内部 #href 解析（含 noteref 标注） */
  function rewriteBody(html, fromFile) {
    let out = html.replace(/\bid="([^"]*)"/g, (m0, raw) => `id="${escAttr(safeId(raw))}"`);
    out = out.replace(/(<img\b[^>]*\ssrc=")([^"]*)(")/gi, (m0, pre, src, post) => {
      if (/^([a-z][a-z0-9+.-]*:)?\/\//i.test(src) || /^data:/i.test(src)) return m0; // 不该出现，防御性跳过
      return pre + encodeHrefPath(src) + post;
    });
    out = out.replace(/(<a\b)([^>]*\shref=")#([^"]*)(")/gi, (m0, open, mid, raw, post) => {
      const resolved = resolveFragment(raw, fromFile);
      if (!resolved) return m0;
      const openTag = resolved.isNote && !/\sepub:type=/.test(mid) ? `${open} epub:type="noteref"` : open;
      return `${openTag}${mid}${escAttr(resolved.href)}${post}`;
    });
    return out;
  }

  /* ---------- 2c. 每章要内嵌的 note asides（EPUB3 popup footnote 惯例） ---------- */
  const noteAsidesByFile = new Map(); // 文件名 -> aside html[]
  for (const [nid, note] of notes) {
    const ownerFile = noteOwnerFile.get(nid);
    const frag = noteFrag.get(nid);
    const body = rewriteBody(sanitizeHtml(note.html || ''), ownerFile);
    const aside = `<aside epub:type="footnote" id="${escAttr(frag)}">\n${body}\n</aside>`;
    if (!noteAsidesByFile.has(ownerFile)) noteAsidesByFile.set(ownerFile, []);
    noteAsidesByFile.get(ownerFile).push(aside);
  }

  /* ---------- 3. 目录树：如实使用 book.nav，不代它凭空生成 ----------
   * 第 2 轮修复前这里在 book.nav 为空时会按章节标题自动补一份平铺目录，
   * 本意是提升"裸转"场景的可用性，但黑盒回读证明这是结构保真的反向违规——
   * G3 比对的是"目录树形状"跟原 IR 一致，IR 里没有的 nav 不该被写手凭空造出来
   * （zip/*.zip 黄金样本的 book.nav 本就是 []，回读后被判"目录树形状不一致"）。
   * 老实反映 IR：book.nav 是空的，nav.xhtml 就只有一个空 <ol>。 */
  const effectiveNav = Array.isArray(book.nav) ? book.nav : [];

  function resolveNavTarget(nv) {
    const file = chapterFile.get(nv.target);
    const frag = nv.anchor ? safeId(nv.anchor) : chapterFrag.get(nv.target);
    return { file, frag };
  }

  function buildNavList(list) {
    if (!list || !list.length) return '';
    const items = list.map((nv) => {
      const { file, frag } = resolveNavTarget(nv);
      const href = file ? `${encodeHrefPath(file)}#${frag}` : '#';
      const children = buildNavList(nv.children);
      return `<li><a href="${escAttr(href)}">${escText(nv.title || '')}</a>${children}</li>`;
    }).join('\n');
    return `<ol>\n${items}\n</ol>`;
  }

  let playOrder = 0;
  function buildNcxPoints(list) {
    return (list || []).map((nv) => {
      playOrder += 1;
      const id = `navpoint-${playOrder}`;
      const { file, frag } = resolveNavTarget(nv);
      const src = file ? `${encodeHrefPath(file)}#${frag}` : '#';
      const children = buildNcxPoints(nv.children);
      return `<navPoint id="${id}" playOrder="${playOrder}">
<navLabel><text>${escText(nv.title || '')}</text></navLabel>
<content src="${escAttr(src)}" />
${children}
</navPoint>`;
    }).join('\n');
  }

  const tocLabel = tocLabelFor(language);
  const navListHtml = buildNavList(effectiveNav) || '<ol></ol>';
  const navDoc =
`<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="${escAttr(language)}" xml:lang="${escAttr(language)}">
<head>
<meta charset="UTF-8" />
<title>${escText(tocLabel)}</title>
<link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
<nav epub:type="toc" id="toc">
<h1>${escText(tocLabel)}</h1>
${navListHtml}
</nav>
</body>
</html>
`;

  const ncxBody = buildNcxPoints(effectiveNav);
  const ncxDoc =
`<?xml version="1.0" encoding="UTF-8"?>
<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1" xml:lang="${escAttr(language)}">
<head>
<meta name="dtb:uid" content="${escAttr(meta.identifier || '')}" />
<meta name="dtb:depth" content="${navDepth(effectiveNav)}" />
<meta name="dtb:totalPageCount" content="0" />
<meta name="dtb:maxPageNumber" content="0" />
</head>
<docTitle><text>${escText(meta.title || '')}</text></docTitle>
<navMap>
${ncxBody}
</navMap>
</ncx>
`;

  onProgress(0.04);

  /* ---------- 4. 打包（章节/资源/自身文档全部落在 zip 根目录，见文件头"第 2 轮修复"说明） ---------- */
  const zip = new JSZip();
  zip.file('mimetype', 'application/epub+zip', { compression: 'STORE' }); // 必须是首个条目且不压缩
  zip.file('META-INF/container.xml', CONTAINER_XML);
  zip.file('style.css', STYLE_CSS);

  const totalUnits = chapters.length + resources.size || 1;
  let doneUnits = 0;

  // 资源原样落盘：zip 路径 = res.href 字面值（reader 给的已是可直接寻址的内部路径，
  // 不再叠加任何前缀）；引用它的地方另做 percent-encoding。
  let ri = 0;
  const resItemId = new Map();
  let coverItemId = null;
  for (const [rid, res] of resources) {
    ri += 1;
    const id = `res-${ri}`;
    resItemId.set(rid, id);
    if (book.cover != null && rid === book.cover) coverItemId = id;
    zip.file(res.href, res.data);
    doneUnits += 1;
    onProgress(0.04 + 0.6 * (doneUnits / totalUnits));
    if (ri % 8 === 0) await tick();
  }

  // 章节文档：标题只在"正文里还没有"时才补一个 <hN>（epub reader 只认正文里的标题标签，
  // 见文件头"第 2 轮修复"1 —— 无标题可注入时不重复，本来就没有标题标签时才补）
  const manifestItems = [];
  const spineItems = [];
  let ci = 0;
  for (const ch of chapters) {
    ci += 1;
    const file = chapterFile.get(ch.id);
    const rawHtml = sanitized.get(ch.id);
    const bodyInner = rewriteBody(rawHtml, file);
    const asides = noteAsidesByFile.get(file);
    const asidesHtml = asides && asides.length ? `\n${asides.join('\n')}` : '';
    const level = Math.min(Math.max(ch.level || 1, 1), 6);
    const heading = ch.title != null && !bodyHasMatchingTitleHeading(rawHtml, ch.title)
      ? `<h${level}>${escText(ch.title)}</h${level}>\n`
      : '';
    const bodyClass = vertical ? ' class="vertical-rl"' : '';
    const doc =
`<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="${escAttr(language)}" xml:lang="${escAttr(language)}">
<head>
<meta charset="UTF-8" />
<title>${escText(ch.title || meta.title || '')}</title>
<link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body${bodyClass}>
<section id="${escAttr(chapterFrag.get(ch.id))}" class="chapter">
${heading}${bodyInner}${asidesHtml}
</section>
</body>
</html>
`;
    zip.file(file, doc);
    const itemId = `chap-${ci}`;
    manifestItems.push(`<item id="${itemId}" href="${escAttr(encodeHrefPath(file))}" media-type="application/xhtml+xml" />`);
    spineItems.push(`<itemref idref="${itemId}" />`);

    doneUnits += 1;
    onProgress(0.04 + 0.6 * (doneUnits / totalUnits));
    if (ci % 15 === 0) await tick();
  }

  onProgress(0.66);
  await tick();

  // resources 的 manifest 项（放在章节之后写，避免打断上面的进度计数逻辑）
  for (const [rid, res] of resources) {
    const id = resItemId.get(rid);
    const props = coverItemId === id ? ' properties="cover-image"' : '';
    manifestItems.push(
      `<item id="${id}" href="${escAttr(encodeHrefPath(res.href))}" media-type="${escAttr(res.mime || 'application/octet-stream')}"${props} />`
    );
  }
  manifestItems.push('<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav" />');
  manifestItems.push('<item id="ncx" href="toc.ncx" media-type="application/x-dtbncx-xml" />');
  manifestItems.push('<item id="css" href="style.css" media-type="text/css" />');

  zip.file('nav.xhtml', navDoc);
  zip.file('toc.ncx', ncxDoc);

  const dcCreator = meta.author ? `<dc:creator>${escText(meta.author)}</dc:creator>` : '';
  const dcPublisher = meta.publisher ? `<dc:publisher>${escText(meta.publisher)}</dc:publisher>` : '';
  const dcDate = meta.date ? `<dc:date>${escText(meta.date)}</dc:date>` : '';
  const dcDesc = meta.description ? `<dc:description>${escText(meta.description)}</dc:description>` : '';
  const metaCover = coverItemId ? `<meta name="cover" content="${escAttr(coverItemId)}" />` : '';
  const modified = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');

  const opfDoc =
`<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="pub-id" xml:lang="${escAttr(language)}">
<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
<dc:identifier id="pub-id">${escText(meta.identifier || '')}</dc:identifier>
<dc:title>${escText(meta.title || '')}</dc:title>
<dc:language>${escText(language)}</dc:language>
${dcCreator}
${dcPublisher}
${dcDate}
${dcDesc}
<meta property="dcterms:modified">${modified}</meta>
${metaCover}
</metadata>
<manifest>
${manifestItems.join('\n')}
</manifest>
<spine toc="ncx"${vertical ? ' page-progression-direction="rtl"' : ''}>
${spineItems.join('\n')}
</spine>
</package>
`;
  zip.file('content.opf', opfDoc);

  onProgress(0.7);

  const bytes = await zip.generateAsync(
    { type: 'uint8array', compression: 'DEFLATE' },
    (m) => onProgress(0.7 + 0.3 * (m.percent / 100))
  );
  onProgress(1);
  return bytes;
}

return { write };
})();

/* ==== src/writers/txt.js ==== */
SJ.writers.txt = (function () {
'use strict';
/* ============================================================
 * src/writers/txt.js · Book IR → 纯文本 TXT
 *
 * 契约：docs/harness/BOOK-IR.md §5「txt」一行。
 *   用到字段：chapters.title + html 的纯文本
 *   丢弃字段：resources（图片）/ notes（脚注）/ nav（目录）/ ruby（注音）
 *     —— TXT 格式的固有限制，不是实现缺陷，BOOK-IR.md §5 已登记。
 *   丢弃需提示用户（文案由 ux-writer 定稿，本文件不写）：
 *     「纯文本不能保留图片和注释」
 *
 * 输出：UTF-8 with BOM（REQUIREMENTS.md R3）。
 * 环境中立：只用标准 JS 全局（TextEncoder，Node ≥ 18 与浏览器均有），
 *   不碰 DOM，不做网络请求。
 *
 * IR 只读：本模块不修改传入的 book，也不深拷贝后修改——从头到尾只读取。
 *
 * 返回值类型说明（与 test/roundtrip.mjs 的实测约定对齐，未自创接口）：
 *   返回 Uint8Array（原始字节，含 BOM），不是 Blob。
 *   实测 `new Uint8Array(blob)` 在 Node/浏览器均不解出字节（得到空数组），
 *   test/roundtrip.mjs 正是用 `new Uint8Array(outBytes)` 回读产物，
 *   若返回 Blob 会导致"文件是空的"这类误报（已用真实 txt reader 验证）。
 *   调用方（UI 下载逻辑）可用一行代码转成 Blob：
 *     new Blob([bytes], { type: 'text/plain;charset=utf-8' })
 * ============================================================ */

const { plainText } = SJ.ir;

/** 主线程让出一次 tick，避免大部头转换时页面假死 */
function tick() {
  return new Promise((resolve) => setTimeout(resolve, 0));
}

/**
 * 把单章渲染成一段纯文本：
 *   标题（若非 null）独立一行，空一行，再接正文。
 *   正文段落之间以单个换行分隔——章节内部的空行不承载任何结构信息，
 *   纯文本 reader 按"非空行即一个段落"解析，空行只是排版留白。
 * HTML 标签与内联样式全部丢弃，HTML 实体经 plainText() 反解码为明文
 *   （decode 由 src/ir.js 的 plainText 统一实现，避免各 writer 各写一遍）。
 */
function renderChapter(chapter) {
  const body = plainText(chapter && chapter.html);
  const rawTitle = chapter && chapter.title;
  const title = typeof rawTitle === 'string' ? rawTitle.trim() : null;
  if (title) return body ? `${title}\n\n${body}` : title;
  return body;
}

/**
 * @param {import('../ir.js').Book} book    只读，不修改
 * @param {object} [opts]                   预留（当前无可配置项）
 * @param {(p:number)=>void} [onProgress]   进度回调，取值 0..1
 * @returns {Promise<Uint8Array>}           原始字节（含 UTF-8 BOM），见文件头说明
 */
async function write(book, opts = {}, onProgress = () => {}) {
  onProgress(0);

  const chapters = Array.isArray(book && book.chapters) ? book.chapters : [];
  const total = Math.max(chapters.length, 1);
  const blocks = [];

  for (let i = 0; i < chapters.length; i++) {
    const rendered = renderChapter(chapters[i]);
    if (rendered) blocks.push(rendered);

    onProgress(Math.min(0.9, ((i + 1) / total) * 0.9));

    // 每 20 章让出一次主线程：大部头书（几千章）转换时不让页面假死
    if (i > 0 && i % 20 === 0) await tick();
  }

  const text = blocks.join('\n\n');

  // UTF-8 with BOM（EF BB BF）
  const BOM = new Uint8Array([0xef, 0xbb, 0xbf]);
  const encoded = new TextEncoder().encode(text);
  const out = new Uint8Array(BOM.length + encoded.length);
  out.set(BOM, 0);
  out.set(encoded, BOM.length);

  onProgress(1);
  return out;
}

return { write };
})();

/* ==== src/writers/kepub.js ==== */
SJ.writers.kepub = (function () {
'use strict';
/* ============================================================
 * src/writers/kepub.js · Book IR → .kepub.epub（Kobo 专用格式）
 *
 * 实现路径（WorkPacket writer_kepub_01 指定）：
 *   1. 黑盒调用 src/writers/epub.js 的 write() 得到标准 EPUB 字节
 *      （不复制/不重写 epub writer 的内部逻辑）
 *   2. 用 JSZip 解包该 EPUB
 *   3. 通过 META-INF/container.xml → OPF manifest/spine 找出正文
 *      xhtml 内容文档（排除 properties="nav" 的导航文档），逐句注入
 *      <span class="koboSpan" id="kobo.{para}.{seg}">
 *   4. 重打包：mimetype 仍是首条目、STORE 不压缩
 *
 * 环境假设：仅依赖 globalThis.JSZip（由调用方/测试注入），零网络请求。
 *
 * Kobo span 规则（BOOK-IR §5 / WorkPacket contract）：
 *   - 段落计数（para）：每个块级元素（h1-h6/p/div/li/blockquote/pre/
 *     dt/dd/td/th/figcaption）各自起一个新 para，编号在全章（单个
 *     xhtml 文档）范围内单调递增、从 1 起
 *   - 句子计数（seg）：每个 para 内部从 1 起，按中日文断句符
 *     （。！？；）与西文断句符（.!? + 空白/结尾）切分
 *   - 只在纯文本 token 上包 span，绝不跨越已有标签边界——因此不会
 *     拆断 ruby/rt、a、img 等任何标签
 *   - 空白/纯空白文本片段不包 span（避免无意义的空 span）
 * ============================================================ */

const { write: writeEpub } = SJ.writers.epub;

/** 让出主线程，避免大书处理时页面假死 */
const tick = () => new Promise((resolve) => setTimeout(resolve, 0));

/** 会在其中直接产出句子 span 的块级元素（BOOK-IR §3 白名单的文本承载子集） */
const BLOCK_TAGS = new Set([
  'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
  'p', 'div', 'li', 'blockquote', 'pre',
  'dt', 'dd', 'td', 'th', 'figcaption',
]);

/* ---------- 断句 ---------- */

const CJK_ENDERS = '。！？；';
// 断句符之后若紧跟这些收尾标点/引号，一并归入上一句（常见于「……。」「……」这类结尾）
const CLOSERS = '”’」』）)】》〉";\'';

/**
 * 把一段原始文本（未解码实体、逐字符保留）切成句子数组，
 * 数组按顺序拼接严格等于输入（不丢字符、不加字符）。
 */
function splitSentences(text) {
  const result = [];
  let start = 0;
  let i = 0;
  const n = text.length;
  while (i < n) {
    const ch = text[i];
    if (CJK_ENDERS.includes(ch)) {
      i += 1;
      while (i < n && CLOSERS.includes(text[i])) i += 1;
      result.push(text.slice(start, i));
      start = i;
      continue;
    }
    if (ch === '.' || ch === '!' || ch === '?') {
      const next = text[i + 1];
      if (next === undefined || /\s/.test(next)) {
        i += 1;
        while (i < n && /\s/.test(text[i])) i += 1;
        result.push(text.slice(start, i));
        start = i;
        continue;
      }
    }
    i += 1;
  }
  if (start < n) result.push(text.slice(start));
  return result;
}

/* ---------- 极简 XHTML tokenizer（只为定位标签边界，不解析属性语义） ---------- */

/**
 * 把 XHTML 串切成 token 流，标签原样保留（不重建，避免任何属性/写法被改写）。
 * token: {type:'text',value} | {type:'open',tag,selfClose,raw}
 *       | {type:'close',tag,raw} | {type:'raw',value}（注释/doctype/PI，原样透传）
 */
function tokenizeXhtml(s) {
  const tokens = [];
  let i = 0;
  const n = s.length;
  while (i < n) {
    const lt = s.indexOf('<', i);
    if (lt === -1) { tokens.push({ type: 'text', value: s.slice(i) }); break; }
    if (lt > i) tokens.push({ type: 'text', value: s.slice(i, lt) });

    if (s.startsWith('<!--', lt)) {
      const end = s.indexOf('-->', lt + 4);
      const stop = end === -1 ? n : end + 3;
      tokens.push({ type: 'raw', value: s.slice(lt, stop) });
      i = stop;
      continue;
    }
    if (s[lt + 1] === '!' || s[lt + 1] === '?') {
      const end = s.indexOf('>', lt + 1);
      const stop = end === -1 ? n : end + 1;
      tokens.push({ type: 'raw', value: s.slice(lt, stop) });
      i = stop;
      continue;
    }

    const gt = s.indexOf('>', lt);
    if (gt === -1) { tokens.push({ type: 'text', value: s.slice(lt) }); break; }
    const raw = s.slice(lt, gt + 1);
    i = gt + 1;

    const inner = raw.slice(1, -1).trim();
    if (!inner) { tokens.push({ type: 'text', value: raw }); continue; }

    if (inner[0] === '/') {
      const tag = inner.slice(1).trim().split(/[\s/]/)[0].toLowerCase();
      tokens.push({ type: 'close', tag, raw });
      continue;
    }

    let body = inner;
    let selfClose = false;
    if (body.endsWith('/')) { selfClose = true; body = body.slice(0, -1).trim(); }
    const m = body.match(/^([a-zA-Z][a-zA-Z0-9:_-]*)/);
    if (!m) { tokens.push({ type: 'text', value: raw }); continue; }
    tokens.push({ type: 'open', tag: m[1].toLowerCase(), selfClose, raw });
  }
  return tokens;
}

/**
 * 对一段 body 内部 HTML 注入 koboSpan。
 * 保证：
 *  - 不修改任何标签（只原样透传 open/close/raw token）
 *  - 只在文本 token 内部插入 <span>，不跨 token 边界
 *  - 剥掉所有注入的 span 后，文本内容与输入逐字符一致
 */
function injectSpansIntoBody(bodyInner) {
  const tokens = tokenizeXhtml(bodyInner);
  let globalPara = 0;
  const stack = []; // 当前打开的块级元素对应的 frame 栈
  let rootFrame = null; // 不在任何块级元素内的顶层文本使用的 frame（惰性分配）
  const out = [];

  const currentFrame = () => (stack.length ? stack[stack.length - 1] : rootFrame);

  for (const t of tokens) {
    if (t.type === 'raw') { out.push(t.value); continue; }

    if (t.type === 'open') {
      out.push(t.raw);
      if (BLOCK_TAGS.has(t.tag) && !t.selfClose) {
        globalPara += 1;
        stack.push({ tag: t.tag, paraId: globalPara, seg: 0 });
      }
      rootFrame = null; // 离开顶层文本上下文；下次顶层文本重新分配 para
      continue;
    }

    if (t.type === 'close') {
      if (BLOCK_TAGS.has(t.tag) && stack.length && stack[stack.length - 1].tag === t.tag) {
        stack.pop();
      }
      out.push(t.raw);
      rootFrame = null;
      continue;
    }

    // text
    const text = t.value;
    if (!text || !text.trim()) { out.push(text); continue; }

    let frame = currentFrame();
    if (!frame) {
      globalPara += 1;
      rootFrame = { tag: null, paraId: globalPara, seg: 0 };
      frame = rootFrame;
    }

    const pieces = splitSentences(text);
    for (const piece of pieces) {
      if (!piece.trim()) { out.push(piece); continue; }
      frame.seg += 1;
      out.push(`<span class="koboSpan" id="kobo.${frame.paraId}.${frame.seg}">${piece}</span>`);
    }
  }

  return out.join('');
}

/** 只处理 <body>...</body> 内部，<head> 原样保留 */
function injectSpansIntoDocument(xhtml) {
  const bodyOpenMatch = xhtml.match(/<body\b[^>]*>/i);
  if (!bodyOpenMatch) return xhtml; // 找不到 body，原样返回（不应发生，但保守处理）
  const bodyOpenEnd = bodyOpenMatch.index + bodyOpenMatch[0].length;
  const bodyCloseIdx = xhtml.lastIndexOf('</body>');
  if (bodyCloseIdx === -1 || bodyCloseIdx < bodyOpenEnd) return xhtml;

  const prefix = xhtml.slice(0, bodyOpenEnd);
  const inner = xhtml.slice(bodyOpenEnd, bodyCloseIdx);
  const suffix = xhtml.slice(bodyCloseIdx);

  return prefix + injectSpansIntoBody(inner) + suffix;
}

/* ---------- OPF / spine 解析（通用 EPUB 结构解析，不依赖 epub writer 内部实现） ---------- */

function parseAttr(attrs, name) {
  const m = attrs.match(new RegExp(`\\b${name}\\s*=\\s*"([^"]*)"`));
  return m ? m[1] : '';
}

function resolveHref(baseDir, href) {
  const decodedParts = href.split('/').map((p) => {
    try { return decodeURIComponent(p); } catch { return p; }
  });
  const baseParts = baseDir ? baseDir.split('/').filter(Boolean) : [];
  const stack = [...baseParts];
  for (const part of decodedParts) {
    if (!part || part === '.') continue;
    if (part === '..') { stack.pop(); continue; }
    stack.push(part);
  }
  return stack.join('/');
}

/**
 * 从已解包的 zip 里找出正文内容文档（spine 顺序，排除 nav 文档）。
 * @returns {Promise<string[]>} zip 内部路径数组
 */
async function findChapterEntries(zip) {
  const containerXml = await zip.file('META-INF/container.xml').async('string');
  const fullPathMatch = containerXml.match(/full-path\s*=\s*"([^"]*)"/);
  const opfPath = fullPathMatch ? fullPathMatch[1] : 'content.opf';
  const opfDir = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/')) : '';

  const opfEntry = zip.file(opfPath);
  if (!opfEntry) throw new Error(`kepub: 找不到 OPF 文件 ${opfPath}`);
  const opfXml = await opfEntry.async('string');

  const manifestById = new Map();
  const itemRe = /<item\b([^>]*?)\/?>/g;
  let im;
  while ((im = itemRe.exec(opfXml))) {
    const attrs = im[1];
    const id = parseAttr(attrs, 'id');
    if (!id) continue;
    manifestById.set(id, {
      href: parseAttr(attrs, 'href'),
      mediaType: parseAttr(attrs, 'media-type'),
      properties: parseAttr(attrs, 'properties'),
    });
  }

  const spineMatch = opfXml.match(/<spine\b[^>]*>([\s\S]*?)<\/spine>/);
  const spineBody = spineMatch ? spineMatch[1] : '';
  const idrefRe = /<itemref\b([^>]*?)\/?>/g;
  const idrefs = [];
  let sm;
  while ((sm = idrefRe.exec(spineBody))) {
    const idref = parseAttr(sm[1], 'idref');
    if (idref) idrefs.push(idref);
  }

  const entries = [];
  for (const idref of idrefs) {
    const item = manifestById.get(idref);
    if (!item) continue;
    if (!/html/i.test(item.mediaType)) continue;
    if (/\bnav\b/.test(item.properties || '')) continue; // 跳过 EPUB3 导航文档
    entries.push(resolveHref(opfDir, item.href));
  }
  return entries;
}

/* ---------- 主入口 ---------- */

/**
 * @param {import('../ir.js').Book} book
 * @param {object} [opts]
 * @param {(p:number)=>void} [onProgress]
 * @returns {Promise<Uint8Array>}
 */
async function write(book, opts, onProgress) {
  const report = typeof onProgress === 'function' ? onProgress : () => {};
  const JSZip = globalThis.JSZip;
  if (!JSZip) throw new Error('kepub writer 需要 globalThis.JSZip');

  // 阶段 1：借道标准 EPUB writer 生成基底字节（不复制其内部逻辑）
  const epubBytes = await writeEpub(book, opts, (p) => report(p * 0.45));
  report(0.45);

  const zip = await JSZip.loadAsync(epubBytes);
  const chapterPaths = await findChapterEntries(zip);
  report(0.5);

  // 阶段 2：定位正文内容文档，逐句注入 koboSpan
  const chapterSet = new Set(chapterPaths);
  const outZip = new JSZip();
  outZip.file('mimetype', 'application/epub+zip', { compression: 'STORE' });

  const names = Object.keys(zip.files).filter((n) => n !== 'mimetype' && !zip.files[n].dir);
  const total = names.length || 1;
  let done = 0;

  for (const name of names) {
    if (chapterSet.has(name)) {
      const xhtml = await zip.file(name).async('string');
      const injected = injectSpansIntoDocument(xhtml);
      outZip.file(name, injected, { compression: 'DEFLATE' });
    } else {
      const bytes = await zip.file(name).async('uint8array');
      outZip.file(name, bytes, { compression: 'DEFLATE' });
    }
    done += 1;
    report(0.5 + 0.4 * (done / total));
    if (done % 5 === 0) await tick();
  }

  // 阶段 3：重打包，mimetype 必须是第一个条目且不压缩
  const bytes = await outZip.generateAsync({ type: 'uint8array', mimeType: 'application/epub+zip' });
  report(1);
  return bytes;
}

return { write };
})();

SJ.writers.mobi = (function () {
'use strict';
/* ============================================================
 * src/writers/mobi.js · Book IR → MOBI (KF7)
 *
 * 容器：PalmDB (.pdb) + PalmDOC 头 + MOBI 头 + EXTH。
 * 文本记录用 compression=1（无压缩）——合法格式值，省去 LZ77 压缩器实现；
 *   工作量记录见 ResultReport，KF7 老格式受众收缩中，此为 C 档合理取舍。
 *
 * KF7 没有多文件概念：所有章节被拼成单一 HTML 流，
 *   每章前插入 <mbp:pagebreak/> 作分页/分章提示，并在章首放置
 *   <a id="<ChapterId>">，使 IR 里已经改写好的 "#<ChapterId>" /
 *   "#<anchor>" 交叉引用无需再变形即可在合流后的单文档里继续生效。
 *
 * 按 docs/harness/BOOK-IR.md §5（mobi 行）声明的丢弃：
 *   - notes：不再是独立的 IR 结构，降级为书末"注释"区块，
 *     原 <a class="noteref" href="#<NoteId>"> 直接跳到该区块对应 id。
 *   - ruby 注音：KF7 渲染不可靠，剥离 <rt>/<rp>，只保留 <ruby> 的基础文本。
 *   这两项都需要提示用户（表格第三列 = 是），提示文案由 Orchestrator/ux-writer 决定，
 *   本文件只在 ResultReport 里回报建议措辞。
 *
 * 目录：nav 不写进正文流。
 *   round 1 曾把 nav 压平成书末一页可见 TOC（<ul><li><a href="#...">），但本项目的
 *   mobi reader 直接把整段解压文本当纯内容流按 <mbp:pagebreak>/标题切章解析，
 *   那页 TOC 会被原样读回成一个多余的"目录"章节，正文末尾凭空多出一段目录文字，
 *   破坏 read→write→read 的显示层字节一致（0 容差硬门）。
 *   而 mobi reader 本就会在回读时按各章标题重建平铺 nav（见 readers/mobi.js），
 *   nav 无需靠正文里的 TOC 页承载——写进去只会污染正文、无任何可回收信息。
 *   KF7 惯例的 <head><guide><reference filepos="..."/></guide></head> 同样不可用：
 *   reader 不识别 <html>/<head>/<body> 包裹，塞进去会被判"结构异常"。
 *   故本 writer 不产出任何 TOC 页，也不接设备原生"跳至目录"菜单（KF7 受众收缩中，
 *   此为 C 档合理取舍）；注释页仍作为书末普通分页内容块保留（见 renderNotes）。
 *
 * 图片：进图片记录区（跟在文本记录后面），正文里的 <img src="..."> 改写成
 *   <img recindex="00001">（1-based，相对于图片记录区起点的序号，
 *   不是 PalmDB 绝对记录号）；封面固定排在图片区第一位，
 *   EXTH 201/202（Cover/Thumb Offset）取值固定为 0。
 *
 * 零依赖：只用 TypedArray / DataView / TextEncoder（环境中立的标准 JS）。
 * ============================================================ */

const { plainText } = SJ.ir;

const PALM_EPOCH_OFFSET = 2082844800; // 1904-01-01 00:00:00 UTC → 1970 epoch 的秒数差
const RECORD_SIZE = 4096;
const PDB_HEADER_LEN = 78;
const PALMDOC_HEADER_LEN = 16;
const MOBI_HEADER_LEN = 232; // 0xE8。数值取自 test/golden/mobi/ 两份黄金样本的实测头部布局

async function tick() {
  await new Promise((r) => setTimeout(r, 0));
}

/* ---------- 字节写入器：只做定长/大端数值与原始字节的拼接 ---------- */

class ByteWriter {
  constructor() {
    this.chunks = [];
    this.length = 0;
  }
  bytes(arr) {
    this.chunks.push(arr);
    this.length += arr.length;
    return this;
  }
  u8(v) {
    return this.bytes(Uint8Array.of(v & 0xff));
  }
  u16(v) {
    const b = new Uint8Array(2);
    new DataView(b.buffer).setUint16(0, v >>> 0, false);
    return this.bytes(b);
  }
  u32(v) {
    const b = new Uint8Array(4);
    new DataView(b.buffer).setUint32(0, v >>> 0, false);
    return this.bytes(b);
  }
  /** 固定宽度、UTF-8 编码、截断或零填充到 len 字节 */
  str(s, len) {
    const enc = new TextEncoder().encode(String(s));
    const out = new Uint8Array(len);
    out.set(enc.subarray(0, len));
    return this.bytes(out);
  }
  /** 原样写入一个 ASCII 字面量（如 "MOBI" "BOOK"），不做长度约束 */
  raw(s) {
    return this.bytes(new TextEncoder().encode(s));
  }
  toBytes() {
    const out = new Uint8Array(this.length);
    let o = 0;
    for (const c of this.chunks) {
      out.set(c, o);
      o += c.length;
    }
    return out;
  }
}

/* ---------- 小工具 ---------- */

function escText(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

/** 极简、非加密强度的字符串哈希，只用来给 MOBI 头的 "unique id" 数值字段填一个稳定值 */
function hash32(s) {
  let h = 0x811c9dc5;
  const str = String(s ?? '');
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

/** BCP47 语言标签 → MOBI/LCID 风格语言码。只认常见标签，未知一律 0（neutral） */
function langCode(bcp47) {
  const s = String(bcp47 || '').toLowerCase();
  if (s.startsWith('zh-hans') || s === 'zh-cn') return 0x0804;
  if (s.startsWith('zh-hant') || s === 'zh-tw') return 0x0404;
  if (s.startsWith('zh')) return 0x0004;
  if (s.startsWith('ja')) return 0x0411;
  if (s.startsWith('ko')) return 0x0412;
  if (s.startsWith('en')) return 0x0409;
  if (s.startsWith('fr')) return 0x040c;
  if (s.startsWith('de')) return 0x0407;
  if (s.startsWith('es')) return 0x040a;
  return 0;
}

/** 剥离 <rt>/<rp>（注音），只保留 <ruby> 里的基础文本；BOOK-IR §5 声明的丢弃项 */
function stripRuby(html) {
  return String(html || '')
    .replace(/<rp\b[^>]*>[\s\S]*?<\/rp>/gi, '')
    .replace(/<rt\b[^>]*>[\s\S]*?<\/rt>/gi, '')
    .replace(/<\/?ruby\b[^>]*>/gi, '');
}

/** 把 <img src="..."> 改写成 <img recindex="NNNNN">（1-based，找不到就整个丢弃该图） */
function rewriteImages(html, hrefToRecindex, missing) {
  return String(html || '').replace(/<img\b([^>]*?)\/?>/gi, (m, attrs) => {
    const srcM = attrs.match(/\bsrc\s*=\s*"([^"]*)"/i) || attrs.match(/\bsrc\s*=\s*'([^']*)'/i);
    const src = srcM ? srcM[1] : '';
    const altM = attrs.match(/\balt\s*=\s*"([^"]*)"/i) || attrs.match(/\balt\s*=\s*'([^']*)'/i);
    const alt = altM ? altM[1] : '';
    const idx = hrefToRecindex.get(src);
    if (idx == null) {
      missing.push(src);
      return '';
    }
    const rec = String(idx).padStart(5, '0');
    return `<img recindex="${rec}"${alt ? ` alt="${escAttr(alt)}"` : ''} />`;
  });
}

/**
 * notes 在 KF7 里降级为书末可见正文（见 renderNotes），noteref 锚点本身
 * 变成了一个普通的内部跳转链接，不再是"指向 IR notes 结构"的语义标记。
 * 剥掉 class 里的 noteref 记号，避免回读产物里出现"有 noteref 类但
 * book.notes 是空 Map"的悬空引用（mobi reader 允许不产出 notes，见
 * BOOK-IR §4），否则会在往返校验时被判定为结构损坏。
 */
function stripNoterefClass(html) {
  return String(html || '').replace(/(<a\b[^>]*)\bclass\s*=\s*"([^"]*)"/gi, (m, pre, cls) => {
    const rest = cls.split(/\s+/).filter((c) => c && c !== 'noteref').join(' ');
    return rest ? `${pre}class="${rest}"` : pre;
  });
}

/** 拼接所有章节为单一 KF7 正文流：章首锚点 + 补标题 + 分页提示 */
function renderChapters(chapters, hrefToRecindex, missing) {
  const parts = [];
  chapters.forEach((ch) => {
    parts.push('<mbp:pagebreak/>');
    parts.push(`<a name="${escAttr(ch.id)}" id="${escAttr(ch.id)}"></a>`);
    let html = stripRuby(ch.html);
    html = stripNoterefClass(html);
    html = rewriteImages(html, hrefToRecindex, missing);
    if (ch.title) {
      const headMatch = html.match(/^\s*<h([1-6])[^>]*>([\s\S]*?)<\/h\1>/i);
      const already = headMatch && plainText(headMatch[2]).trim() === String(ch.title).trim();
      if (!already) {
        const lvl = ch.level >= 1 && ch.level <= 6 ? ch.level : 1;
        html = `<h${lvl}>${escText(ch.title)}</h${lvl}>` + html;
      }
    }
    parts.push(html);
  });
  return parts.join('\n');
}

/** notes 降级为书末"注释"区块，id 直接用 NoteId，使原 noteref 锚点无需改写即可跳达 */
function renderNotes(notes) {
  if (!(notes instanceof Map) || notes.size === 0) return '';
  const parts = ['<mbp:pagebreak/>', '<h2>注释</h2>'];
  for (const [id, note] of notes) {
    parts.push(`<div name="${escAttr(id)}" id="${escAttr(id)}">${note.html || ''}</div>`);
  }
  return parts.join('\n');
}

/* nav 不序列化进正文流：reader 会把书末 TOC 页读回成多余章节，破坏往返显示层一致；
 * 且 reader 本就按章标题重建平铺 nav，TOC 页无可回收信息。理由详见文件头注释。 */

/* ---------- EXTH ---------- */

function exthStr(id, str) {
  return { id, data: new TextEncoder().encode(String(str)) };
}
function exthU32(id, val) {
  const b = new Uint8Array(4);
  new DataView(b.buffer).setUint32(0, val >>> 0, false);
  return { id, data: b };
}

function buildExth(records) {
  const sorted = [...records].sort((a, b) => a.id - b.id);
  let bodyLen = 12; // "EXTH" + length(4) + count(4)
  for (const r of sorted) bodyLen += 8 + r.data.length;
  const padded = Math.ceil(bodyLen / 4) * 4;

  const w = new ByteWriter();
  w.raw('EXTH');
  w.u32(padded);
  w.u32(sorted.length);
  for (const r of sorted) {
    w.u32(r.id);
    w.u32(8 + r.data.length);
    w.bytes(r.data);
  }
  const pad = padded - bodyLen;
  if (pad > 0) w.bytes(new Uint8Array(pad));
  return w.toBytes();
}

/* ---------- 主流程 ---------- */

async function write(book, opts = {}, onProgress = () => {}) {
  const notify = (p) => {
    try {
      onProgress(Math.max(0, Math.min(1, p)));
    } catch {
      /* onProgress 抛错不应打断转换 */
    }
  };
  notify(0);

  const resources = book.resources instanceof Map ? book.resources : new Map();

  // ---- 1. href → ResourceId → recindex（封面固定第一位）----
  const hrefToRid = new Map();
  for (const [rid, res] of resources) {
    if (res && typeof res.href === 'string') hrefToRid.set(res.href, rid);
  }

  const usedRids = [];
  const seenRid = new Set();
  const pushRid = (rid) => {
    if (rid && !seenRid.has(rid) && resources.has(rid)) {
      seenRid.add(rid);
      usedRids.push(rid);
    }
  };
  if (book.cover) pushRid(book.cover);
  for (const ch of book.chapters) {
    const html = String(ch.html || '');
    for (const m of html.matchAll(/<img\b[^>]*\bsrc\s*=\s*"([^"]*)"/gi)) pushRid(hrefToRid.get(m[1]));
    for (const m of html.matchAll(/<img\b[^>]*\bsrc\s*=\s*'([^']*)'/gi)) pushRid(hrefToRid.get(m[1]));
  }

  const ridToRecindex = new Map();
  usedRids.forEach((rid, i) => ridToRecindex.set(rid, i + 1));
  const hrefToRecindex = new Map();
  for (const rid of usedRids) {
    const res = resources.get(rid);
    if (res) hrefToRecindex.set(res.href, ridToRecindex.get(rid));
  }

  notify(0.1);
  await tick();

  // ---- 2. 拼正文 / 注释 / 目录 ----
  const missingImgs = [];
  const bodyChapters = renderChapters(book.chapters, hrefToRecindex, missingImgs);
  await tick();
  notify(0.25);

  const notesHtml = renderNotes(book.notes);
  notify(0.35);

  // ---- 3. 组装整篇正文：不加 <html>/<head>/<body> 包裹（原因见文件头注释），
  //         就是一段以 <mbp:pagebreak/> 分隔章节的纯内容流。
  //         不写 nav/TOC 页（会被 reader 读回成多余章节，破坏往返；理由见文件头注释）----
  const title = book.meta?.title || '未命名';
  const fullHtml = [bodyChapters, notesHtml].filter(Boolean).join('\n');

  notify(0.4);
  await tick();

  // ---- 4. 文本记录（compression = 1，无压缩，按 4096 字节切块）----
  const textBytes = new TextEncoder().encode(fullHtml);
  const textRecords = [];
  for (let off = 0; off < textBytes.length; off += RECORD_SIZE) {
    textRecords.push(textBytes.subarray(off, off + RECORD_SIZE));
    if (textRecords.length % 64 === 0) await tick();
  }
  if (textRecords.length === 0) textRecords.push(new Uint8Array(0));
  notify(0.6);

  // ---- 5. 图片记录 ----
  const imageRecords = [];
  for (const rid of usedRids) {
    const res = resources.get(rid);
    imageRecords.push(res && res.data instanceof Uint8Array ? res.data : new Uint8Array(0));
    await tick();
  }
  notify(0.75);

  const numTextRecords = textRecords.length;
  const firstImageIndex = imageRecords.length > 0 ? numTextRecords + 1 : 0xffffffff;
  const allRecords = [null /* record0 占位，稍后填 */, ...textRecords, ...imageRecords];
  const numRecordsTotal = allRecords.length;

  // ---- 6. EXTH ----
  const exthList = [];
  if (book.meta?.author) exthList.push(exthStr(100, book.meta.author));
  if (book.meta?.publisher) exthList.push(exthStr(101, book.meta.publisher));
  if (book.meta?.description) exthList.push(exthStr(103, book.meta.description));
  if (book.meta?.date) exthList.push(exthStr(106, book.meta.date));
  exthList.push(exthStr(503, title)); // Updated Title
  exthList.push(exthStr(524, book.meta?.language || 'zh')); // Language
  if (book.cover && ridToRecindex.has(book.cover)) {
    const coverOffset = ridToRecindex.get(book.cover) - 1; // 固定 0（封面永远排第一）
    exthList.push(exthU32(201, coverOffset));
    exthList.push(exthU32(202, coverOffset));
  }
  const exthBytes = buildExth(exthList);

  // ---- 7. record0 = PalmDOC 头 + MOBI 头 + EXTH + full name ----
  const fullNameBytes = new TextEncoder().encode(title);
  const fullNameOffset = PALMDOC_HEADER_LEN + MOBI_HEADER_LEN + exthBytes.length;
  const fullNamePadded = Math.ceil(fullNameBytes.length / 4) * 4;

  const r0 = new ByteWriter();
  // PalmDOC 头（16 字节）
  r0.u16(1); // compression = none
  r0.u16(0); // unused
  r0.u32(textBytes.length); // 未压缩全文字节数
  r0.u16(numTextRecords);
  r0.u16(RECORD_SIZE);
  r0.u16(0); // encryption = none
  r0.u16(0); // unused

  // MOBI 头（232 字节，见 MOBI_HEADER_LEN 处注释：数值来自黄金样本实测）
  r0.raw('MOBI');
  r0.u32(MOBI_HEADER_LEN);
  r0.u32(2); // mobi type = book
  r0.u32(65001); // utf-8
  r0.u32(hash32(book.meta?.identifier || title));
  r0.u32(6); // file version
  for (let i = 0; i < 10; i++) r0.u32(0); // 10 个保留索引字段（本书不用索引，黄金样本里全 0）
  r0.u32(0); // first non-book index（黄金样本里为 0）
  r0.u32(fullNameOffset);
  r0.u32(fullNameBytes.length);
  r0.u32(langCode(book.meta?.language));
  r0.u32(0); // input language
  r0.u32(0); // output language
  r0.u32(0); // min version（黄金样本里为 0）
  r0.u32(firstImageIndex);
  r0.u32(0); // huffman record offset
  r0.u32(0); // huffman record count
  r0.u32(0); // huffman table offset
  r0.u32(0); // huffman table length
  r0.u32(0x40); // EXTH flags：bit6 = 有 EXTH
  // 0x74–0xE8：DRM / FDST / FCIS / FLIS / extra-data-flags 等字段本书全部不用，
  // 黄金样本里这一整段就是连续 0，直接补齐到 header 长度即可
  r0.bytes(new Uint8Array(MOBI_HEADER_LEN - 0x74));

  r0.bytes(exthBytes);
  r0.bytes(fullNameBytes);
  const namePad = fullNamePadded - fullNameBytes.length;
  if (namePad > 0) r0.bytes(new Uint8Array(namePad));

  allRecords[0] = r0.toBytes();
  notify(0.85);
  await tick();

  // ---- 8. PalmDB 容器：文件头 + 记录目录 + 记录数据 ----
  const recordListLen = 8 * numRecordsTotal;
  let cursor = PDB_HEADER_LEN + recordListLen + 2; // +2：记录目录后固定的 2 字节间隙
  const offsets = [];
  for (const r of allRecords) {
    offsets.push(cursor);
    cursor += r.length;
  }

  const now = Math.floor(Date.now() / 1000) + PALM_EPOCH_OFFSET;
  const asciiName = (title.replace(/[^\x20-\x7e]/g, '_').trim() || 'book').slice(0, 31);

  const pdb = new ByteWriter();
  pdb.str(asciiName, 32);
  pdb.u16(0); // attributes
  pdb.u16(0); // version
  pdb.u32(now); // creation date
  pdb.u32(now); // modification date
  pdb.u32(0); // last backup date
  pdb.u32(0); // modification number
  pdb.u32(0); // appInfoID
  pdb.u32(0); // sortInfoID
  pdb.raw('BOOK');
  pdb.raw('MOBI');
  pdb.u32(numRecordsTotal); // uniqueIDseed
  pdb.u32(0); // nextRecordListID
  pdb.u16(numRecordsTotal);

  for (let i = 0; i < numRecordsTotal; i++) {
    pdb.u32(offsets[i]);
    pdb.u8(0); // record attributes
    pdb.u8((i >> 16) & 0xff);
    pdb.u16(i & 0xffff); // 3 字节 uniqueID（高字节+u16）
    if (i % 200 === 0) await tick();
  }
  pdb.bytes(new Uint8Array(2)); // 记录目录后的固定间隙

  for (const r of allRecords) pdb.bytes(r);

  notify(1);
  return pdb.toBytes();
}

return { write };
})();

/* ==== src/writers/pdf.js ==== */
SJ.writers.pdf = (function () {
'use strict';

 *
 * 返回值：Uint8Array（UTF-8 字节），不是 Blob——与其它 writer 的既定契约一致

 *
 * 已知限制（如实记录，不隐藏）：
 *   - `@page` 的页眉页脚（margin box：@top-center / @bottom-center）是

 *     实际显示效果依浏览器而异（本环境无 GUI 浏览器，未做真机验证）。
 *   - `writing-mode: vertical-rl` 在打印分页下的可靠性同样依赖浏览器

 *   - 章节标题的"缺才补、已有则跳过"判断只识别 html 最前面的一个
 *     h1-h6 标签，不做更深的结构分析（章节标题不在最前面的罕见排版
