<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书简</title>
<meta name="description" content="">
<!-- 仅首屏诗句 + 版权句在「非苹果设备」上用到的网络字体（见 main.css --serif-hero）。
     苹果端这两处也命中本地 Songti SC，压根不会用到这里；正文与其他地方一律本地
     字体、不联网（拉取太慢）。故只保留 Noto Serif SC 一支，Sans 不再需要。
     fontsource 可变字重包替代被墙的 Google Fonts：单文件覆盖 200–900，按
     unicode-range 分片，只有诗句/版权那十几个字的子集会被拉取。
     取源沿用本站「CDN 多源回退」：主源 cdn.jsdelivr.net，onerror 落备源
     fastly.jsdelivr.net；两源皆挂再退回系统字体，页面照常。 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/noto-serif-sc@5.3.0/index.css"
      onerror="this.onerror=null;this.href='https://fastly.jsdelivr.net/npm/@fontsource-variable/noto-serif-sc@5.3.0/index.css'">
<link rel="stylesheet" href="./styles/main.css">
</head>
<body>

<main class="sheet-wrap">
  <div class="sheet" id="sheet" data-active-mode="ts">
    <h1 id="heroTitle" class="poem"></h1>

    <div class="modes" role="tablist" aria-label="转换功能">
      <button type="button" class="mode" id="modeTs" role="tab" aria-selected="true">
        <span class="mode-name" id="modeTsName"></span>
      </button>
      <button type="button" class="mode" id="modeFuri" role="tab" aria-selected="false">
        <span class="mode-name" id="modeFuriName"></span>
      </button>
    </div>

    <p class="lede" id="heroLede"></p>

    <div class="controls">
      <div class="scheme-pair" data-mode="ts">
        <div class="scheme">
          <label for="tsDirection" id="directionLabel"></label>
          <select id="tsDirection"></select>
        </div>
        <div class="scheme">
          <label for="tsRegion" id="regionLabel"></label>
          <select id="tsRegion"></select>
        </div>
      </div>
      <div class="scheme" data-mode="furigana">
        <label for="annot" id="annotLabel"></label>
        <select id="annot"></select>
      </div>
      <div class="scheme">
        <label for="outputFormat" id="outputLabel"></label>
        <select id="outputFormat"></select>
      </div>
      <div class="scheme">
        <label for="writingDir" id="writingDirLabel"></label>
        <select id="writingDir"></select>
      </div>
    </div>
    <p class="output-notice" id="modeNotice"></p>
    <p class="output-notice" id="outputNotice"></p>

    <label class="drop" id="drop">
      <input type="file" id="picker" accept=".txt,.md,.zip,.epub,.docx,.pdf,.mobi,.azw3,.azw" multiple>
      <div class="main" id="dropMain"></div>
      <div class="sub" id="dropSub"></div>
    </label>

    <div class="engine" id="engine"><span class="dot"></span><span id="engineText"></span></div>

    <div class="pending" id="pending" hidden>
      <div class="pending-head" id="pendingHead"></div>
      <div class="pending-list" id="pendingList"></div>
    </div>

    <div class="actions">
      <button type="button" class="start" id="startBtn" disabled></button>
    </div>

    <div class="files" id="files" aria-live="polite"></div>
  </div>
</main>

<footer class="foot">
  <span id="footerLine"></span>
</footer>

<script type="module" src="./src/ui/app.js"></script>
</body>
</html>
